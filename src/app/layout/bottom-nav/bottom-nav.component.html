<nav
  [attr.aria-label]="ebayContext() ? 'eBay-Schnellnavigation' : 'Schnellnavigation'"
  class="fb-safe-bottom-nav md:hidden fixed bottom-0 left-0 right-0 h-14 max-w-full overflow-hidden bg-fb-sidebar/95 backdrop-blur-md border-t border-fb-border-subtle flex items-center justify-around px-2 z-30 select-none shadow-lg"
>
  @if (vintedContext() || ebayContext()) {
    @for (item of ebayContext() ? ebayLinks : vintedLinks; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="font-semibold"
        ariaCurrentWhenActive="page"
        class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition min-w-0 max-w-full overflow-hidden"
      >
        <svg [lucideIcon]="item.icon" class="size-4 shrink-0" aria-hidden="true"></svg>
        <span class="max-w-full truncate text-[11px] leading-tight">{{ item.label }}</span>
      </a>
    }
  } @else {
    <a
      routerLink="/dashboard"
      routerLinkActive="font-semibold"
      ariaCurrentWhenActive="page"
      class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition"
    >
      <svg [lucideIcon]="DashboardIcon" class="w-4 h-4"></svg>
      <span class="max-w-full truncate">Übersicht</span>
    </a>

    <a
      routerLink="/purchases"
      routerLinkActive="font-semibold"
      ariaCurrentWhenActive="page"
      class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition"
    >
      <svg [lucideIcon]="PurchasesIcon" class="w-4 h-4"></svg>
      <span class="max-w-full truncate">Einkauf</span>
    </a>

    <a
      routerLink="/catalog"
      [class.font-semibold]="isArticlesActive()"
      [attr.aria-current]="isArticlesActive() ? 'page' : null"
      class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition"
    >
      <svg [lucideIcon]="InventoryIcon" class="w-4 h-4"></svg>
      <span class="max-w-full truncate">Artikel</span>
    </a>

    <a
      routerLink="/sales"
      routerLinkActive="font-semibold"
      ariaCurrentWhenActive="page"
      class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition"
    >
      <svg [lucideIcon]="SalesIcon" class="w-4 h-4"></svg>
      <span class="max-w-full truncate">Verkauf</span>
    </a>
  }

  <button
    type="button"
    (click)="toggleMenu.emit()"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="app-sidebar"
    class="flex min-w-0 flex-1 max-w-full overflow-hidden flex-col items-center justify-center gap-1 text-fb-text-muted text-xs py-1 hover:text-fb-text-primary transition cursor-pointer"
  >
    <svg [lucideIcon]="MenuIcon" class="w-4 h-4"></svg>
    <span class="max-w-full truncate">Menü</span>
  </button>
</nav>
