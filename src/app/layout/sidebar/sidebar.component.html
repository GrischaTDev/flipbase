<!-- Mobile Backdrop -->
@if (isOpen()) {
  <div
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 md:hidden"
    (click)="close.emit()"
  ></div>
}

<!-- Sidebar Container -->
<aside
  class="fixed top-0 bottom-0 left-0 z-50 w-64 bg-slate-900 text-slate-100 flex flex-col transition-transform duration-300 md:translate-x-0 md:static md:z-auto"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
>
  <!-- Brand Logo Header -->
  <div class="h-16 flex items-center justify-between px-6 border-b border-slate-800">
    <div class="flex items-center gap-2.5 font-bold text-lg text-white">
      <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-900 shadow-md">
        <lucide-icon [img]="logoIcon" class="w-5 h-5 text-white"></lucide-icon>
      </div>
      <div class="flex flex-col">
        <span class="tracking-tight leading-none text-emerald-400 font-extrabold text-xl">ReFlip</span>
        <span class="text-[10px] text-slate-400 font-normal tracking-wider uppercase">SaaS Reselling OS</span>
      </div>
    </div>

    <button
      type="button"
      (click)="close.emit()"
      class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800"
    >
      <lucide-icon [img]="closeIcon" class="w-5 h-5"></lucide-icon>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 overflow-y-auto p-4 space-y-1">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-emerald-600/15 text-emerald-400 font-semibold border-l-4 border-emerald-500"
        (click)="close.emit()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800/60 transition group border-l-4 border-transparent"
      >
        <lucide-icon [img]="item.icon" class="w-4 h-4 text-slate-400 group-hover:text-white group-[.border-emerald-500]:text-emerald-400 shrink-0"></lucide-icon>
        <span class="truncate">{{ (item.labelKey | translate) || item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer Info / Version -->
  <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center justify-between">
    <span>ReFlip Core</span>
    <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono text-[10px]">v0.1</span>
  </div>
</aside>
