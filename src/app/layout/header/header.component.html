<header class="h-14 border-b border-rf-border-subtle bg-rf-header/95 backdrop-blur-md px-4 md:px-6 flex items-center justify-between sticky top-0 z-30 select-none shadow-xs">
  <!-- Left: Mobile Toggle & Workspace Switcher -->
  <div class="flex items-center gap-2.5">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="p-1.5 rounded-md text-rf-text-muted hover:text-rf-text-primary hover:bg-rf-surface-hover md:hidden cursor-pointer"
      aria-label="Toggle navigation"
    >
      <lucide-icon [img]="MenuIcon" class="w-4 h-4"></lucide-icon>
    </button>

    <!-- Workspace Selector Dropdown -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleWorkspaceDropdown()"
        class="flex items-center gap-2 px-2.5 py-1 rounded-md border border-rf-border bg-rf-surface text-xs font-medium text-rf-text-primary hover:bg-rf-surface-hover hover:border-rf-border-hover transition shadow-xs cursor-pointer"
      >
        <lucide-icon [img]="LayersIcon" class="w-3.5 h-3.5 text-indigo-400"></lucide-icon>
        <span class="max-w-[120px] md:max-w-[180px] truncate font-semibold">
          {{ workspaceService.currentWorkspace()?.name || ('WORKSPACE.MY_WORKSPACE' | translate) }}
        </span>
        <span class="text-[10px] text-rf-text-muted">▾</span>
      </button>

      @if (isWorkspaceDropdownOpen()) {
        <div class="absolute left-0 mt-1.5 w-60 rounded-xl shadow-2xl bg-rf-surface border border-rf-border py-1 z-50 animate-fade-in">
          <div class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-rf-text-muted">
            {{ 'WORKSPACE.CURRENT' | translate }}
          </div>

          @for (ws of workspaceService.workspaces(); track ws.id) {
            <button
              type="button"
              (click)="selectWorkspace(ws)"
              class="w-full text-left px-3 py-1.5 text-xs flex items-center justify-between hover:bg-rf-surface-hover transition text-rf-text-secondary hover:text-rf-text-primary cursor-pointer"
              [class.font-semibold]="ws.id === workspaceService.currentWorkspace()?.id"
              [class.text-indigo-400]="ws.id === workspaceService.currentWorkspace()?.id"
            >
              <span class="truncate">{{ ws.name }}</span>
              @if (ws.id === workspaceService.currentWorkspace()?.id) {
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
              }
            </button>
          }

          <div class="border-t border-rf-border my-1"></div>

          <button
            type="button"
            (click)="openCreateWorkspace.emit(); isWorkspaceDropdownOpen.set(false)"
            class="w-full text-left px-3 py-1.5 text-xs text-indigo-400 hover:bg-indigo-500/10 flex items-center gap-2 font-medium cursor-pointer"
          >
            <lucide-icon [img]="PlusIcon" class="w-3.5 h-3.5"></lucide-icon>
            <span>Neuer Workspace</span>
          </button>
        </div>
      }
    </div>
  </div>

  <!-- Right: Language Switcher & Profile -->
  <div class="flex items-center gap-2">
    <!-- Language Toggle -->
    <div class="flex items-center border border-rf-border rounded-md p-0.5 bg-rf-surface text-[11px]">
      <button
        type="button"
        (click)="switchLanguage('de')"
        class="px-2 py-0.5 rounded font-medium transition cursor-pointer"
        [class.bg-rf-border]="currentLanguage() === 'de'"
        [class.shadow-xs]="currentLanguage() === 'de'"
        [class.text-rf-text-primary]="currentLanguage() === 'de'"
        [class.text-rf-text-muted]="currentLanguage() !== 'de'"
      >
        DE
      </button>
      <button
        type="button"
        (click)="switchLanguage('en')"
        class="px-2 py-0.5 rounded font-medium transition cursor-pointer"
        [class.bg-rf-border]="currentLanguage() === 'en'"
        [class.shadow-xs]="currentLanguage() === 'en'"
        [class.text-rf-text-primary]="currentLanguage() === 'en'"
        [class.text-rf-text-muted]="currentLanguage() !== 'en'"
      >
        EN
      </button>
    </div>

    <!-- User Profile Dropdown -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleUserDropdown()"
        class="flex items-center gap-2 p-1 rounded-md hover:bg-rf-surface-hover transition cursor-pointer"
      >
        <div class="w-7 h-7 rounded-md bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 flex items-center justify-center font-bold text-xs shadow-xs">
          {{ auth.userName().charAt(0).toUpperCase() }}
        </div>
        <span class="hidden md:inline text-xs font-semibold text-rf-text-primary">
          {{ auth.userName() }}
        </span>
      </button>

      @if (isUserDropdownOpen()) {
        <div class="absolute right-0 mt-1.5 w-52 rounded-xl shadow-2xl bg-rf-surface border border-rf-border py-1 z-50 animate-fade-in">
          <div class="px-3 py-1.5 border-b border-rf-border">
            <p class="text-xs font-semibold text-rf-text-primary truncate">{{ auth.userName() }}</p>
            <p class="text-[10px] text-rf-text-muted truncate">{{ auth.userEmail() }}</p>
          </div>

          <a
            routerLink="/settings"
            (click)="isUserDropdownOpen.set(false)"
            class="px-3 py-1.5 text-xs text-rf-text-secondary hover:text-rf-text-primary hover:bg-rf-surface-hover flex items-center gap-2 cursor-pointer"
          >
            <lucide-icon [img]="UserIcon" class="w-3.5 h-3.5 text-rf-text-muted"></lucide-icon>
            <span>{{ 'NAV.SETTINGS' | translate }}</span>
          </a>

          <button
            type="button"
            (click)="onSignOut()"
            class="w-full text-left px-3 py-1.5 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center gap-2 cursor-pointer"
          >
            <lucide-icon [img]="LogOutIcon" class="w-3.5 h-3.5 text-rose-400"></lucide-icon>
            <span>{{ 'AUTH.LOGOUT' | translate }}</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
