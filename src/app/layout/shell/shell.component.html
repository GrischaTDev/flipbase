<a class="rf-skip-link" href="#hauptinhalt">Zum Inhalt springen</a>

<div class="min-h-screen bg-rf-bg text-rf-text-primary flex flex-col md:flex-row antialiased">
  <!-- Desktop & Mobile Sidebar -->
  <app-sidebar [isOpen]="isSidebarOpen()" (close)="closeSidebar()"></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 pb-16 md:pb-0 bg-rf-bg">
    <!-- Header -->
    <app-header
      (toggleSidebar)="toggleSidebar()"
      (openCreateWorkspace)="openCreateWorkspace()"
    ></app-header>

    <!-- Demo-Modus deutlich kennzeichnen -->
    @if (auth.isDemoMode()) {
      <div
        class="bg-amber-500/15 border-b border-amber-500/30 px-4 md:px-6 py-2 flex flex-wrap items-center justify-center gap-3 text-center"
        role="status"
      >
        <p class="text-[11px] text-amber-300 leading-relaxed">
          <strong>Demo-Modus</strong> &ndash; alle Daten liegen nur in diesem Browser und werden
          nicht auf dem Server gespeichert.
          <a routerLink="/auth/login" class="underline font-semibold hover:text-amber-200 ml-1">
            Mit Konto anmelden
          </a>
        </p>
        <button
          type="button"
          (click)="reloadDemoData()"
          class="px-2.5 py-1 text-[10px] font-bold rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 border border-amber-500/40 cursor-pointer transition flex items-center gap-1"
        >
          <span>🔄</span>
          <span>Beispieldaten neu laden</span>
        </button>
      </div>
    }

    <!-- Fehlgeschlagene Speichervorgaenge sichtbar machen -->
    <app-sync-error-banner></app-sync-error-banner>

    <!-- Page Content Container -->
    <main
      id="hauptinhalt"
      tabindex="-1"
      class="flex-1 p-4 md:p-6 lg:p-7 max-w-7xl w-full mx-auto animate-fade-in"
    >
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <app-bottom-nav (toggleMenu)="toggleSidebar()"></app-bottom-nav>

  <!-- Workspace Modal -->
  @if (isCreateWorkspaceModalOpen()) {
    <app-workspace-modal
      (close)="closeCreateWorkspace()"
      (created)="closeCreateWorkspace()"
    ></app-workspace-modal>
  }
</div>
