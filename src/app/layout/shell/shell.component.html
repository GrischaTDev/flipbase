<div class="min-h-screen bg-slate-50/70 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 flex flex-col md:flex-row antialiased">
  <!-- Desktop & Mobile Sidebar -->
  <app-sidebar
    [isOpen]="isSidebarOpen()"
    (close)="closeSidebar()"
  ></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 pb-16 md:pb-0 bg-slate-50/70 dark:bg-zinc-950">
    <!-- Header -->
    <app-header
      (toggleSidebar)="toggleSidebar()"
      (openCreateWorkspace)="openCreateWorkspace()"
    ></app-header>

    <!-- Page Content Container -->
    <main class="flex-1 p-4 md:p-6 lg:p-7 max-w-7xl w-full mx-auto animate-fade-in">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <app-bottom-nav
    (toggleMenu)="toggleSidebar()"
  ></app-bottom-nav>

  <!-- Workspace Modal -->
  @if (isCreateWorkspaceModalOpen()) {
    <app-workspace-modal
      (close)="closeCreateWorkspace()"
      (created)="closeCreateWorkspace()"
    ></app-workspace-modal>
  }
</div>
