<a class="fb-skip-link" href="#hauptinhalt">Zum Inhalt springen</a>

<div class="min-h-screen bg-fb-bg text-fb-text-primary flex flex-col md:flex-row antialiased">
  <!-- Desktop & Mobile Sidebar -->
  <app-sidebar id="app-sidebar" [isOpen]="isSidebarOpen()" (closed)="closeSidebar()"></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex min-w-0 flex-1 flex-col bg-fb-bg pb-16 md:ml-56 md:pb-0">
    <!-- Header -->
    <app-header
      [isSidebarOpen]="isSidebarOpen()"
      [workspaceActionsBlocked]="workspaceActionsBlocked()"
      (toggleSidebar)="toggleSidebar()"
      (openCreateWorkspace)="openCreateWorkspace()"
    ></app-header>

    <!-- Page Content Container -->
    <main
      id="hauptinhalt"
      tabindex="-1"
      class="flex-1 min-w-0 w-full mx-auto p-4 md:p-5 animate-fade-in"
    >
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <app-bottom-nav [isMenuOpen]="isSidebarOpen()" (toggleMenu)="toggleSidebar()"></app-bottom-nav>

  <!-- Rueckfragen und Hinweise der ganzen Anwendung. Steht genau einmal hier;
       jede Stelle, die etwas fragen will, ruft den ConfirmDialogService. -->
  <app-confirm-dialog></app-confirm-dialog>

  <!-- Workspace Modal -->
  @if (isCreateWorkspaceModalOpen()) {
    <app-workspace-modal
      (closed)="closeCreateWorkspace()"
      (created)="onWorkspaceCreated()"
    ></app-workspace-modal>
  }
</div>
