<app-card variant="section">
  <form
    class="space-y-4"
    aria-labelledby="app-display-heading"
    [formGroup]="form"
    (ngSubmit)="save()"
  >
    <h2 id="app-display-heading" class="text-lg font-semibold text-fb-text-primary">Darstellung</h2>
    <app-form-field
      controlId="action-overview-enabled"
      helpText="Zeigt ein Icon neben der Glocke. Dort kannst Du laufende Aktionen aufklappen."
      [error]="preferences.error()"
    >
      <app-custom-checkbox
        id="action-overview-enabled"
        presentation="row"
        label="Aktionsübersicht anzeigen"
        formControlName="enabled"
        [disabled]="preferences.saving()"
      />
    </app-form-field>
    <app-form-field
      controlId="workspace-switcher-enabled"
      helpText="Blende die Workspace-Auswahl aus, wenn Du sie im Header nicht brauchst."
    >
      <app-custom-checkbox
        id="workspace-switcher-enabled"
        presentation="row"
        label="Workspace-Auswahl im Header anzeigen"
        formControlName="workspaceSwitcherEnabled"
        [disabled]="preferences.saving()"
      />
    </app-form-field>
    <div class="flex justify-end">
      <app-button
        type="submit"
        variant="primary"
        size="touch"
        [loading]="preferences.saving()"
        [disabled]="form.pristine"
      >
        Änderungen speichern
      </app-button>
    </div>
  </form>
</app-card>
