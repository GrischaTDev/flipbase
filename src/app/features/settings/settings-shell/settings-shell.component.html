<div class="space-y-5 animate-fade-in">
  <header class="space-y-1">
    <h1 class="text-xl font-bold tracking-tight text-fb-text-primary" tabindex="-1">
      {{ currentItem().label }}
    </h1>
    <p class="text-sm text-fb-text-muted">{{ currentItem().description }}</p>
  </header>

  <div class="lg:hidden">
    <app-custom-select
      ariaLabel="Einstellungsbereich auswählen"
      [options]="mobileOptions"
      [value]="currentPath()"
      (valueChange)="onMobileSectionChange($event)"
    />
  </div>

  <div class="grid gap-5 lg:grid-cols-[17rem_minmax(0,1fr)]">
    <nav
      aria-label="Einstellungsbereiche"
      class="hidden self-start rounded-2xl border border-fb-border bg-fb-surface p-2 lg:block"
    >
      <ul class="space-y-1">
        @for (item of navigation; track item.path) {
          <li>
            <a
              [routerLink]="['/settings', item.path]"
              routerLinkActive="bg-indigo-500/15 text-fb-text-primary border-indigo-500/30"
              #activeLink="routerLinkActive"
              [attr.aria-current]="activeLink.isActive ? 'page' : null"
              class="flex min-h-11 cursor-pointer items-center gap-3 rounded-xl border border-transparent px-3 py-2 text-fb-text-secondary outline-none transition hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:ring-2 focus-visible:ring-indigo-400"
            >
              <svg [lucideIcon]="item.icon" class="h-4 w-4 shrink-0" aria-hidden="true"></svg>
              <span class="min-w-0">
                <span class="block text-sm font-semibold">{{ item.label }}</span>
                <span class="block text-[11px] text-fb-text-muted">{{ item.description }}</span>
              </span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="min-w-0" aria-live="polite">
      <router-outlet />
    </div>
  </div>
</div>
