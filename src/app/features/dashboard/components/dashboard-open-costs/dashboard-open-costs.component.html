@if (hasContent()) {
  <section aria-labelledby="dashboard-open-costs-heading">
    <app-card padding="none" rounded="xl">
      <div card-header>
        <h2 id="dashboard-open-costs-heading" class="text-sm font-semibold text-fb-text-primary">
          Zu erledigen
        </h2>
      </div>
      <ul class="divide-y divide-fb-line">
        @if (hasPurchaseTask()) {
          <li
            data-open-cost-purchases
            class="flex items-center justify-between gap-3 px-4 py-3 text-[13px] md:px-5"
          >
            <span class="text-fb-text-secondary">{{ purchaseTaskText() }}</span>
            <app-button variant="plain" link="/purchases">Prüfen</app-button>
          </li>
        }
        @if (salesWithoutPurchase() > 0) {
          <li
            data-open-cost-sales
            class="flex items-center justify-between gap-3 px-4 py-3 text-[13px] md:px-5"
          >
            <span class="text-fb-text-secondary">{{ salesWithoutPurchaseText() }}</span>
            <app-button variant="plain" link="/sales">Prüfen</app-button>
          </li>
        }
      </ul>
    </app-card>
  </section>
}
