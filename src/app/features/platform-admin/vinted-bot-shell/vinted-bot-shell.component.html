<div class="mx-auto flex w-full max-w-[90rem] flex-col gap-4">
  <app-page-header
    title="Vinted Bot"
    subtitle="Sammelaufträge, Betrieb und Kategorien des Vinted-Bots verwalten."
  />

  <div class="lg:hidden">
    <app-custom-select
      #sectionSelect
      ariaLabel="Bereich des Vinted Bots auswählen"
      [options]="mobileOptions"
      [value]="currentPath()"
      (valueChange)="onMobileSectionChange($event, sectionSelect)"
    />
  </div>

  <div class="grid gap-5 lg:grid-cols-[15rem_minmax(0,1fr)]">
    <nav
      aria-label="Bereiche des Vinted Bots"
      class="hidden self-start rounded-xl border border-fb-border bg-fb-surface p-2 lg:block"
    >
      <ul class="space-y-1">
        @for (item of navigation; track item.path) {
          <li>
            <a
              [routerLink]="['/admin/vinted-bot', item.path]"
              routerLinkActive="bg-fb-primary/15 border-fb-primary/40 text-fb-text-primary"
              #activeLink="routerLinkActive"
              [attr.aria-current]="activeLink.isActive ? 'page' : null"
              class="flex min-h-11 items-center gap-3 rounded-lg border border-transparent px-3 py-2 text-fb-text-secondary outline-none transition hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:ring-2 focus-visible:ring-fb-primary"
            >
              <svg
                [lucideIcon]="item.icon"
                class="h-4 w-4 shrink-0 text-fb-text-muted"
                [class.text-fb-text-primary]="activeLink.isActive"
                aria-hidden="true"
              ></svg>
              <span class="min-w-0">
                <span class="block text-[13px] font-semibold">{{ item.label }}</span>
                <span class="block text-xs text-fb-text-muted">{{ item.description }}</span>
              </span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="min-w-0">
      <router-outlet />
    </div>
  </div>
</div>
