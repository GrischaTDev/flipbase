<div class="space-y-3">
  <div class="relative flex h-[420px] max-h-[60vh] items-center justify-center overflow-hidden">
    <image-cropper
      [imageURL]="datenUrl()"
      [maintainAspectRatio]="true"
      [aspectRatio]="verhaeltnis()"
      [format]="'jpeg'"
      [output]="'base64'"
      [cropper]="cropperEingabe()"
      [resizeToWidth]="32"
      [disabled]="deaktiviert()"
      (imageCropped)="beiZuschnitt($event)"
      (imageLoaded)="beiBildGeladen($event)"
      (cropperReady)="beiCropperBereit($event)"
      (loadImageFailed)="ladenFehlgeschlagen.emit()"
    ></image-cropper>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="drehen.emit()"
      [disabled]="deaktiviert()"
      class="px-2.5 py-1.5 rounded-lg border border-fb-border text-fb-text-secondary hover:text-fb-text-primary cursor-pointer disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Bild drehen"
    >
      <svg [lucideIcon]="rotateIcon" class="w-3.5 h-3.5"></svg>
    </button>
  </div>
</div>
