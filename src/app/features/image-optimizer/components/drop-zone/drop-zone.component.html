@if (!hasImages()) {
  <label
    class="block cursor-pointer rounded-2xl border-2 border-dashed p-12 text-center transition focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-400/50 motion-reduce:transition-none"
    [class]="zoneClasses()"
  >
    <input
      type="file"
      accept="image/*"
      multiple
      [disabled]="disabled()"
      class="sr-only"
      (change)="onFileInput($event.target)"
    />
    <svg
      [lucideIcon]="uploadIcon"
      class="mx-auto mb-3 h-10 w-10 transition-colors"
      [class]="iconClasses()"
      aria-hidden="true"
    ></svg>
    <span class="block text-base font-bold text-fb-text-primary">
      {{ isDragActive() ? 'Jetzt loslassen' : 'Produktbilder hier ablegen' }}
    </span>
    <span class="mt-1 block text-xs text-fb-text-muted">
      oder klicken und mehrere Dateien auswählen
    </span>
  </label>
} @else if (isDragActive()) {
  <div
    class="pointer-events-none fixed inset-0 z-40 grid place-items-center bg-fb-surface/80 backdrop-blur-sm"
    aria-hidden="true"
  >
    <div
      class="rounded-2xl border-2 border-dashed border-fb-text-primary bg-fb-primary-subtle px-12 py-10 text-center shadow-2xl"
    >
      <svg [lucideIcon]="uploadIcon" class="mx-auto mb-3 h-10 w-10 text-fb-text-primary"></svg>
      <span class="block text-base font-bold text-fb-text-primary">Bilder hier ablegen</span>
      <span class="mt-1 block text-xs text-fb-text-muted">Sie werden der Liste hinzugefügt</span>
    </div>
  </div>
}
