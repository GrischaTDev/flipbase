<div class="flex flex-col gap-4 p-5 lg:flex-row lg:items-end lg:justify-between">
  <div class="max-w-2xl">
    <p class="mb-1 text-xs font-medium text-fb-text-muted">Produktbilder</p>
    <h1 class="text-lg font-bold text-fb-text-primary">Bildoptimierer</h1>
    <p class="mt-1 text-xs leading-relaxed text-fb-text-secondary">
      Plattform wählen, Ausschnitt festlegen und fertige Bilder herunterladen. Alles bleibt in
      deinem Browser.
    </p>
  </div>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <div class="w-56">
      <app-text-field
        id="export-base-name"
        label="Dateiname"
        [value]="baseName()"
        [disabled]="disabled()"
        (valueChange)="baseNameChanged.emit($event)"
        placeholder="z. B. nike-air-max-42"
        ariaLabel="Dateiname"
      />
    </div>

    <input
      #fileInput
      type="file"
      accept="image/*"
      multiple
      [disabled]="disabled()"
      class="sr-only"
      data-shared-ui-exception="native-file-picker"
      (change)="onFileInput($event.target)"
    />
    <app-button variant="primary" size="lg" [disabled]="disabled()" (clicked)="fileInput.click()">
      Bilder hinzufügen
    </app-button>
  </div>
</div>
