<div class="flex flex-col gap-4 p-5 lg:flex-row lg:items-end lg:justify-between">
  <div class="max-w-2xl">
    <p class="mb-1 text-xs font-medium text-fb-text-muted">
      Produktbilder
    </p>
    <h1 class="text-lg font-bold text-fb-text-primary">Bildoptimierer</h1>
    <p class="mt-1 text-xs leading-relaxed text-fb-text-secondary">
      Plattform wählen, Ausschnitt festlegen und fertige Bilder herunterladen. Alles bleibt in
      deinem Browser.
    </p>
  </div>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <div class="flex flex-col gap-1">
      <label
        for="export-base-name"
        class="text-xs font-medium text-fb-text-muted"
      >
        Dateiname
      </label>
      <input
        id="export-base-name"
        type="text"
        [value]="baseName()"
        [disabled]="disabled()"
        (input)="baseNameChanged.emit($any($event.target).value)"
        placeholder="z. B. nike-air-max-42"
        class="w-56 rounded-xl border border-fb-border bg-fb-surface px-3 py-2 text-xs text-fb-text-primary placeholder:text-fb-text-muted focus:border-fb-primary focus:outline-none focus:ring-2 focus:ring-fb-brand-border disabled:opacity-40"
      />
    </div>

    <label
      class="inline-flex cursor-pointer items-center justify-center rounded-xl border border-fb-primary-border bg-fb-primary px-4 py-2.5 text-xs font-semibold text-fb-on-accent shadow-sm hover:bg-fb-primary-hover focus-within:ring-2 focus-within:ring-fb-brand-border"
    >
      <input
        type="file"
        accept="image/*"
        multiple
        [disabled]="disabled()"
        class="sr-only"
        (change)="onFileInput($event.target)"
      />
      Bilder hinzufügen
    </label>
  </div>
</div>
