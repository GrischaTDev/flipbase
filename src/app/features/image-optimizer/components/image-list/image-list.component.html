@if (images().length > 0) {
  <div class="mb-3 flex items-center justify-between gap-2 px-1">
    <p class="text-[10px] text-fb-text-muted" aria-live="polite">
      {{ reviewedCount() }} von {{ images().length }} durchgesehen
    </p>
    <button
      type="button"
      (click)="clearAllRequested.emit()"
      [disabled]="disabled()"
      class="cursor-pointer rounded-lg px-2 py-1 text-[10px] font-semibold text-fb-text-muted hover:bg-rose-500/15 hover:text-rose-300 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Alle entfernen
    </button>
  </div>
}
<div
  class="flex gap-3 overflow-x-auto pb-2 lg:max-h-[560px] lg:flex-col lg:overflow-x-visible lg:overflow-y-auto lg:pr-1"
>
  @for (image of images(); track image.id; let i = $index) {
    <article
      class="w-56 shrink-0 overflow-hidden rounded-xl border bg-fb-surface transition lg:w-full"
      [class.border-indigo-400]="image.id === activeId()"
      [class.ring-2]="image.id === activeId()"
      [class.ring-indigo-400/30]="image.id === activeId()"
      [class.border-fb-border]="image.id !== activeId()"
      [class.opacity-60]="!image.reviewed && image.id !== activeId()"
    >
      <button
        type="button"
        (click)="selected.emit(image.id)"
        [disabled]="disabled()"
        [attr.aria-label]="
          image.id === activeId()
            ? 'Bild ' + (i + 1) + ' ausgewählt' + (i === 0 ? ' (Hauptbild)' : '')
            : 'Bild ' + (i + 1) + ' auswählen' + (i === 0 ? ' (Hauptbild)' : '')
        "
        [attr.aria-current]="image.id === activeId() ? 'true' : null"
        class="relative block aspect-[4/3] w-full cursor-pointer overflow-hidden bg-black/25 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <img [src]="image.dataUrl" alt="" class="h-full w-full object-contain" />
        @if (image.id === activeId()) {
          <span
            class="absolute left-2 top-2 rounded-full bg-indigo-500 px-2 py-1 text-[9px] font-bold text-white shadow"
          >
            AKTIV
          </span>
        }
        @if (i === 0) {
          <span
            class="absolute bottom-2 left-2 rounded-full bg-black/75 px-2 py-1 text-[9px] font-bold text-white shadow"
          >
            HAUPTBILD
          </span>
        }
      </button>

      <footer class="flex items-center justify-between gap-2 border-t border-fb-border px-2 py-2">
        <div class="flex min-w-0 items-center gap-1.5">
          <span class="text-[11px] font-semibold text-fb-text-secondary">Bild {{ i + 1 }}</span>
          <button
            type="button"
            (click)="reviewToggled.emit(image.id)"
            [disabled]="disabled()"
            [attr.aria-pressed]="image.reviewed"
            [attr.aria-label]="
              image.reviewed
                ? 'Bild ' + (i + 1) + ' als nicht durchgesehen markieren'
                : 'Bild ' + (i + 1) + ' als durchgesehen markieren'
            "
            class="inline-flex cursor-pointer items-center gap-1 rounded-full px-2 py-1 text-[9px] font-bold disabled:cursor-not-allowed disabled:opacity-40"
            [class.bg-emerald-500/20]="image.reviewed"
            [class.text-emerald-300]="image.reviewed"
            [class.bg-fb-surface-hover]="!image.reviewed"
            [class.text-fb-text-muted]="!image.reviewed"
          >
            {{ image.reviewed ? '✓ Gesehen' : 'Offen' }}
          </button>
        </div>
        <div class="flex items-center gap-1">
          <button
            type="button"
            (click)="moved.emit({ id: image.id, direction: -1 })"
            [disabled]="disabled() || i === 0"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-25"
            aria-label="Bild in der Reihenfolge nach vorne schieben"
            title="Nach vorne"
          >
            <svg [lucideIcon]="moveUpIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            (click)="moved.emit({ id: image.id, direction: 1 })"
            [disabled]="disabled() || i === images().length - 1"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-25"
            aria-label="Bild in der Reihenfolge nach hinten schieben"
            title="Nach hinten"
          >
            <svg [lucideIcon]="moveDownIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            (click)="removed.emit(image.id)"
            [disabled]="disabled()"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-rose-500/15 hover:text-rose-300 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Bild entfernen"
            title="Entfernen"
          >
            <svg [lucideIcon]="closeIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
        </div>
      </footer>
    </article>
  }
</div>
