<div class="space-y-3">
  <div
    class="relative flex h-[480px] max-h-[62vh] items-center justify-center overflow-hidden rounded-2xl bg-[#090b12] p-3 shadow-inner"
  >
    <image-cropper
      [imageURL]="dataUrl()"
      [maintainAspectRatio]="true"
      [aspectRatio]="ratio()"
      [format]="'jpeg'"
      [output]="'blob'"
      [cropper]="cropperInput()"
      [resizeToWidth]="32"
      [onlyScaleDown]="true"
      [allowMoveImage]="true"
      [transform]="transform()"
      [disabled]="disabled()"
      style="
        --cropper-outline-color: rgba(9, 11, 18, 0.72);
        --cropper-overlay-color: #090b12;
        --cropper-color: rgba(255, 255, 255, 0.78);
        --cropper-border: 2px solid rgb(129 140 248);
        --cropper-hover-border: 2px solid rgb(165 180 252);
        --cropper-focus-border: 3px solid rgb(199 210 254);
        --cropper-resize-square-bg: rgb(238 242 255);
        --cropper-resize-square-border: 2px solid rgb(79 70 229);
      "
      (imageCropped)="onCropped($event)"
      (transformChange)="onTransform($event)"
      (imageLoaded)="onImageLoaded($event)"
      (cropperReady)="onCropperReady($event)"
      (loadImageFailed)="loadFailed.emit()"
    ></image-cropper>
  </div>

  <div
    class="flex flex-wrap items-center gap-2 rounded-xl border border-fb-border bg-fb-surface px-2.5 py-2"
  >
    <button
      type="button"
      (click)="rotateRequested.emit()"
      [disabled]="disabled()"
      class="grid h-8 w-8 cursor-pointer place-items-center rounded-lg text-fb-text-secondary hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Bild drehen"
    >
      <svg [lucideIcon]="rotateIcon" class="w-3.5 h-3.5"></svg>
    </button>

    <div class="mx-1 h-5 w-px bg-fb-border" aria-hidden="true"></div>
    <label for="bild-zoom" class="text-[11px] font-semibold text-fb-text-secondary">Zoom</label>
    <input
      id="bild-zoom"
      type="range"
      min="1"
      max="3"
      step="0.05"
      [value]="transform().scale ?? 1"
      [disabled]="disabled()"
      (input)="setZoom($any($event.target).value)"
      class="h-1.5 min-w-28 flex-1 cursor-pointer accent-indigo-500 disabled:cursor-not-allowed disabled:opacity-40"
    />
    <span class="w-10 text-right text-[10px] tabular-nums text-fb-text-muted">
      {{ ((transform().scale ?? 1) * 100).toFixed(0) }} %
    </span>

    <div class="mx-1 hidden h-5 w-px bg-fb-border sm:block" aria-hidden="true"></div>
    <button
      type="button"
      (click)="center()"
      [disabled]="disabled()"
      class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-lg px-2.5 text-[11px] font-semibold text-fb-text-secondary hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Bild im Ausschnitt zentrieren"
    >
      <svg [lucideIcon]="centerIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
      Zentrieren
    </button>
    <button
      type="button"
      (click)="reset()"
      [disabled]="disabled()"
      class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-lg px-2.5 text-[11px] font-semibold text-fb-text-secondary hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-40"
      aria-label="Bildbearbeitung zurücksetzen"
    >
      <svg [lucideIcon]="resetIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
      Zurücksetzen
    </button>
  </div>
</div>
