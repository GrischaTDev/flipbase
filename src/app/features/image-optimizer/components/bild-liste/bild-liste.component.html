<div
  class="flex gap-3 overflow-x-auto pb-2 lg:max-h-[560px] lg:flex-col lg:overflow-x-visible lg:overflow-y-auto lg:pr-1"
>
  @for (bild of bilder(); track bild.id; let i = $index) {
    <article
      class="w-56 shrink-0 overflow-hidden rounded-xl border bg-fb-surface transition lg:w-full"
      [class.border-indigo-400]="bild.id === aktivesId()"
      [class.ring-2]="bild.id === aktivesId()"
      [class.ring-indigo-400/30]="bild.id === aktivesId()"
      [class.border-fb-border]="bild.id !== aktivesId()"
    >
      <button
        type="button"
        (click)="gewaehlt.emit(bild.id)"
        [disabled]="deaktiviert()"
        [attr.aria-label]="
          bild.id === aktivesId()
            ? 'Bild ' + (i + 1) + ' ausgewählt' + (i === 0 ? ' (Hauptbild)' : '')
            : 'Bild ' + (i + 1) + ' auswählen' + (i === 0 ? ' (Hauptbild)' : '')
        "
        [attr.aria-current]="bild.id === aktivesId() ? 'true' : null"
        class="relative block aspect-[4/3] w-full cursor-pointer overflow-hidden bg-black/25 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <img [src]="bild.datenUrl" alt="" class="h-full w-full object-contain" />
        @if (bild.id === aktivesId()) {
          <span
            class="absolute left-2 top-2 rounded-full bg-indigo-500 px-2 py-1 text-[9px] font-bold text-white shadow"
          >
            AKTIV
          </span>
        }
        @if (i === 0) {
          <span
            class="absolute bottom-2 left-2 rounded-full bg-black/75 px-2 py-1 text-[9px] font-bold text-white shadow"
          >
            HAUPTBILD
          </span>
        }
      </button>

      <footer class="flex items-center justify-between gap-2 border-t border-fb-border px-2 py-2">
        <span class="text-[11px] font-semibold text-fb-text-secondary">Bild {{ i + 1 }}</span>
        <div class="flex items-center gap-1">
          <button
            type="button"
            (click)="verschoben.emit({ id: bild.id, richtung: -1 })"
            [disabled]="deaktiviert() || i === 0"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-25"
            aria-label="Bild in der Reihenfolge nach vorne schieben"
            title="Nach vorne"
          >
            <svg [lucideIcon]="linksIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            (click)="verschoben.emit({ id: bild.id, richtung: 1 })"
            [disabled]="deaktiviert() || i === bilder().length - 1"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-fb-surface-hover hover:text-fb-text-primary disabled:cursor-not-allowed disabled:opacity-25"
            aria-label="Bild in der Reihenfolge nach hinten schieben"
            title="Nach hinten"
          >
            <svg [lucideIcon]="rechtsIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
          <button
            type="button"
            (click)="entfernt.emit(bild.id)"
            [disabled]="deaktiviert()"
            class="grid h-7 w-7 cursor-pointer place-items-center rounded-md text-fb-text-muted hover:bg-rose-500/15 hover:text-rose-300 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Bild entfernen"
            title="Entfernen"
          >
            <svg [lucideIcon]="closeIcon" class="h-3.5 w-3.5" aria-hidden="true"></svg>
          </button>
        </div>
      </footer>
    </article>
  }
</div>
