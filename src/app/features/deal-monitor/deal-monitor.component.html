<section class="mx-auto flex w-full min-w-0 flex-col gap-4">
  <app-page-header
    title="Vinted Feed"
    subtitle="Neue Vinted-Artikel entdecken und für später merken."
    [icon]="pageIcon"
  />
  @if (!workspace()) {
    <p role="status">Bitte einen Arbeitsbereich auswählen.</p>
  }

  <!-- Im Widescreen-Modus teilen sich mehrere Suchen die Breite zu gleichen Teilen. -->
  <div
    data-feed-searches
    class="grid min-w-0 gap-6"
    [style.grid-template-columns]="searchColumns()"
  >
    @for (searchNumber of searches(); track searchNumber; let last = $last) {
      <app-deal-feed-search
        [searchNumber]="searchNumber"
        [widescreen]="widescreen()"
        [canAddSearch]="last && canAddSearch()"
        [removable]="searchNumber !== 1"
        (addSearch)="addSearch()"
        (remove)="removeSearch(searchNumber)"
      />
    }
  </div>
</section>
