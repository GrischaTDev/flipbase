<form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-full space-y-4 text-fb-text-primary">
  @if (errorMessage()) {
    <p role="alert" class="rounded-xl border border-fb-line bg-fb-surface p-4 text-sm">
      {{ errorMessage() }}
    </p>
  }

  <app-two-column-layout ratio="2-1" data-testid="purchase-entry-workspace">
    <div main class="space-y-4" data-testid="purchase-entry-main">
      <app-card title="Verkäufer und Einkauf" padding="md" rounded="xl">
        <app-button
          card-header-actions
          variant="plain"
          size="slim"
          (clicked)="sellerDialogOpen.set(true)"
        >
          Verkäufer erstellen
        </app-button>

        <div class="space-y-4">
          <div>
            <span class="mb-1.5 block text-[13px] font-semibold">Verkäufer</span>
            <app-custom-select
              formControlName="supplier_id"
              [options]="lieferantenOptionen()"
              ariaLabel="Verkäufer auswählen"
              placeholder="Verkäufer auswählen"
            />
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="purchase-date" class="mb-1.5 block text-[13px] font-semibold"
                >Kaufdatum</label
              >
              <app-date-picker
                id="purchase-date"
                ariaLabel="Kaufdatum"
                formControlName="purchase_date"
              />
            </div>
            <div>
              <span class="mb-1.5 block text-[13px] font-semibold">Plattform / Bezugsquelle</span>
              <app-custom-select
                triggerId="purchase-source"
                formControlName="source_id"
                [options]="quellenOptionen()"
                ariaLabel="Plattform oder Bezugsquelle"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <span class="mb-1.5 block text-[13px] font-semibold">Inhalt</span>
              <app-custom-select
                formControlName="content_status"
                ariaLabel="Inhalt"
                [options]="contentStatusOptions"
              />
            </div>
            <div>
              <span class="mb-1.5 block text-[13px] font-semibold">Preise</span>
              <app-custom-select
                formControlName="pricing_mode"
                ariaLabel="Preise"
                [options]="pricingModeOptions"
              />
            </div>
          </div>
        </div>
      </app-card>

      <app-card padding="md" rounded="xl">
        <app-purchase-line-editor
          [purchaseType]="form.controls.type.value"
          [pricingMode]="pricingMode()"
          [initialLines]="purchaseLines()"
          (linesChanged)="onPurchaseLinesChanged($event)"
        />
      </app-card>

      <ng-content select="[entry-main-extra]" />

      <div class="empty:hidden" data-testid="purchase-entry-timeline">
        <ng-content select="[entry-timeline]" />
      </div>
    </div>

    <div sidebar class="space-y-4" data-testid="purchase-entry-sidebar">
      <app-purchase-cost-summary
        role="region"
        aria-label="Kostenübersicht"
        [goodsAmount]="null"
        [discountAmount]="discountAmount()"
        [costs]="costDrafts()"
        [totalAmount]="totalCosts()"
        (editRequested)="openCostEditor()"
      >
        <div cost-summary-goods-editor>
          <label for="purchase-base-price" class="mb-1.5 block text-[13px] font-semibold">
            Warenbetrag
          </label>
          <app-number-input
            id="purchase-base-price"
            formControlName="purchase_price"
            ariaLabel="Warenbetrag"
            [asCurrency]="true"
            [showStepper]="false"
            unit="€"
            [min]="0"
          />
        </div>
      </app-purchase-cost-summary>

      <app-card title="Einkaufsdetails" padding="md" rounded="xl">
        <div class="space-y-4">
          <app-text-field
            formControlName="title"
            label="Beschreibung (optional)"
            placeholder="Kurze Bezeichnung für den Einkauf"
          />
          <app-text-field formControlName="supplier_reference" label="Referenz des Verkäufers" />
          <app-text-field formControlName="original_url" label="Beleg / Angebotslink" type="url" />
          <app-text-field formControlName="notes" label="Interne Notiz" [multiline]="3" />
        </div>
      </app-card>

      <div class="empty:hidden" data-testid="purchase-entry-sidebar-extra">
        <ng-content select="[entry-sidebar-extra]" />
      </div>
    </div>
  </app-two-column-layout>
</form>

@if (sellerDialogOpen()) {
  <app-purchase-seller-dialog
    (closed)="sellerDialogOpen.set(false)"
    (created)="
      form.controls.supplier_id.setValue($event.id); form.markAsDirty(); sellerDialogOpen.set(false)
    "
  />
}

@if (costDialogOpen()) {
  <app-purchase-cost-overview-dialog
    [purchaseType]="form.controls.type.value"
    [initialDiscountAmount]="discountAmount()"
    [initialCosts]="initialCostDrafts()"
    [purchaseLineOptions]="purchaseLineOptions()"
    (saved)="onCostOverviewSaved($event)"
    (closed)="costDialogOpen.set(false)"
  />
}
