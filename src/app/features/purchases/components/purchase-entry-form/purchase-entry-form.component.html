<form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-full space-y-4 text-fb-text-primary">
  @if (errorMessage()) {
    <p role="alert" class="rounded-xl border border-fb-line bg-fb-surface p-4 text-sm">
      {{ errorMessage() }}
    </p>
  }
  <app-two-column-layout ratio="2-1" data-testid="purchase-entry-workspace">
    <div main class="space-y-4" data-testid="purchase-entry-main">
      <app-card title="Einkauf" padding="md" rounded="xl">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div class="min-w-0">
            <span class="mb-1.5 block text-[13px] font-semibold">
              Verkäufer <span aria-hidden="true" class="text-fb-primary">*</span>
            </span>
            <app-custom-select
              formControlName="supplier_id"
              [options]="lieferantenOptionen()"
              ariaLabel="Verkäufer auswählen"
              placeholder="Verkäufer auswählen"
              actionLabel="Verkäufer erstellen"
              [required]="true"
              (action)="sellerDialogOpen.set(true)"
            />
          </div>
          <div class="min-w-0">
            <span class="mb-1.5 block text-[13px] font-semibold">Quelle</span>
            <app-custom-select
              formControlName="source_id"
              [options]="quellenOptionen()"
              ariaLabel="Quelle auswählen"
              placeholder="Quelle auswählen"
              actionLabel="Quelle erstellen"
              (action)="isAddingSource.set(true)"
            />
            @if (isAddingSource()) {
              <div class="mt-3 rounded-lg border border-fb-line bg-fb-subtle p-3">
                <app-text-field
                  id="new-purchase-source"
                  label="Neue Quelle"
                  [required]="true"
                  [formControl]="newSourceControl"
                  (input)="onNewSourceInput($event)"
                />
                <div class="mt-3 flex justify-end gap-2">
                  <app-button variant="plain" size="slim" (clicked)="cancelNewSource()">
                    Abbrechen
                  </app-button>
                  <app-button
                    variant="primary"
                    size="slim"
                    [disabled]="!newSourceName().trim()"
                    (clicked)="saveNewSource()"
                  >
                    Quelle speichern
                  </app-button>
                </div>
              </div>
            }
          </div>
        </div>
      </app-card>

      <app-card padding="md" rounded="xl">
        <app-purchase-line-editor
          [purchaseType]="form.controls.type.value"
          [pricingMode]="pricingMode()"
          [initialLines]="purchaseLines()"
          (linesChanged)="onPurchaseLinesChanged($event)"
        />
      </app-card>

      <ng-content select="[entry-main-extra]" />

      <div class="empty:hidden" data-testid="purchase-entry-timeline">
        <ng-content select="[entry-timeline]" />
      </div>
    </div>

    <div sidebar class="space-y-4" data-testid="purchase-entry-sidebar">
      <app-purchase-cost-summary
        role="region"
        aria-label="Kostenübersicht"
        [goodsAmount]="purchaseBasePrice()"
        [itemCount]="orderedItemCount()"
        [discountAmount]="discountAmount()"
        [costs]="costDrafts()"
        [totalAmount]="totalCosts()"
        (editRequested)="openCostEditor()"
      />

      <app-card title="Einkaufsdetails" padding="md" rounded="xl">
        <div class="space-y-4">
          <div>
            <label for="purchase-date" class="mb-1.5 block text-[13px] font-semibold">
              Kaufdatum <span aria-hidden="true" class="text-fb-primary">*</span>
            </label>
            <app-date-picker
              id="purchase-date"
              ariaLabel="Kaufdatum"
              formControlName="purchase_date"
              [required]="true"
            />
          </div>
          <app-text-field formControlName="supplier_reference" label="Referenznummer" />
          <app-text-field formControlName="notes" label="Beschreibung" [multiline]="3" />
        </div>
      </app-card>

      <div class="empty:hidden" data-testid="purchase-entry-sidebar-extra">
        <ng-content select="[entry-sidebar-extra]" />
      </div>
    </div>
  </app-two-column-layout>
</form>

@if (sellerDialogOpen()) {
  <app-purchase-seller-dialog
    (closed)="sellerDialogOpen.set(false)"
    (created)="onSellerCreated($event)"
  />
}

@if (costDialogOpen()) {
  <app-purchase-cost-overview-dialog
    [purchaseType]="form.controls.type.value"
    [initialDiscountAmount]="discountAmount()"
    [initialCosts]="initialCostDrafts()"
    [purchaseLineOptions]="purchaseLineOptions()"
    (saved)="onCostOverviewSaved($event)"
    (closed)="costDialogOpen.set(false)"
  />
}
