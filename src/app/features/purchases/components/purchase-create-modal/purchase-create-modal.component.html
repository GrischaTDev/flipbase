<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/80 p-3 backdrop-blur-md sm:p-6"
  appModalDialog
  [dialogTitel]="purchase() ? 'Einkauf bearbeiten' : 'Neuen Einkauf erfassen'"
  (dialogClose)="closed.emit()"
>
  <app-purchase-entry-form
    [purchase]="purchase()"
    presentation="dialog"
    (closed)="closed.emit()"
    (created)="created.emit()"
  />
</div>
