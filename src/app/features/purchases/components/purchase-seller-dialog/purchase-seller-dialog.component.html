<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
  appModalDialog
  [dialogTitel]="dialogTitle()"
  [schliesstMitEscape]="!saving()"
  (dialogClose)="closed.emit()"
>
  <section
    class="flex max-h-[85dvh] w-full max-w-xl flex-col rounded-xl border border-fb-line bg-fb-surface shadow-xl"
  >
    <header class="flex items-center justify-between border-b border-fb-line p-4">
      <h2 class="text-base font-semibold">{{ dialogTitle() }}</h2>
      <button
        type="button"
        class="linear-btn-secondary rounded-lg px-3 py-1.5 text-sm"
        [disabled]="saving()"
        (click)="closed.emit()"
      >
        Schließen
      </button>
    </header>
    <div class="space-y-4 overflow-y-auto p-4" [formGroup]="form">
      <label class="block text-sm"
        >Art<select
          formControlName="seller_type"
          class="linear-input mt-1 w-full rounded-lg px-3 py-2"
        >
          <option value="private">Privatperson</option>
          <option value="business">Unternehmen</option>
        </select></label
      >
      <label class="block text-sm"
        >{{ form.controls.seller_type.value === 'business' ? 'Firmenname' : 'Vor- und Nachname'
        }}<input
          formControlName="name"
          class="linear-input mt-1 w-full rounded-lg px-3 py-2"
          required
      /></label>
      @if (form.controls.seller_type.value === 'business') {
        <label class="block text-sm"
          >Kontaktperson (optional)<input
            formControlName="contact_person"
            class="linear-input mt-1 w-full rounded-lg px-3 py-2"
        /></label>
      }
      <p class="text-xs text-fb-text-muted">Alle weiteren Angaben sind optional.</p>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <label class="block text-sm"
          >Land<select
            data-country-select
            formControlName="country_code"
            class="linear-input mt-1 w-full rounded-lg px-3 py-2"
            autocomplete="country"
          >
            @for (country of countries; track country.code) {
              <option [value]="country.code">{{ country.name }}</option>
            }
          </select></label
        >
        @for (field of contactFields; track field.key) {
          <label class="block text-sm"
            >{{ field.label
            }}<input
              [formControlName]="field.key"
              [type]="field.key === 'email' ? 'email' : 'text'"
              class="linear-input mt-1 w-full rounded-lg px-3 py-2"
          /></label>
        }
        <label class="block text-sm sm:col-span-2"
          >Telefon
          <intl-tel-input
            data-phone-input
            formControlName="phone"
            class="mt-1 block w-full"
            containerClass="w-full"
            countryNameLocale="de"
            initialCountry="de"
            [inputAttributes]="phoneInputAttributes"
            [separateDialCode]="true"
            [showFlags]="true"
            [strictMode]="true"
            [uiTranslations]="phoneTranslations"
          />
        </label>
      </div>
      @if (form.controls.seller_type.value === 'business') {
        <label class="block text-sm"
          >Website<input
            formControlName="website"
            class="linear-input mt-1 w-full rounded-lg px-3 py-2"
        /></label>
      }
      <label class="block text-sm"
        >Notiz<textarea
          formControlName="notes"
          rows="3"
          class="linear-input mt-1 w-full rounded-lg px-3 py-2"
        ></textarea>
      </label>
      @if (error()) {
        <p role="alert" class="text-sm text-fb-text-primary">{{ error() }}</p>
      }
    </div>
    <footer class="flex justify-end gap-2 border-t border-fb-line p-4">
      <button
        type="button"
        data-cancel-seller
        class="linear-btn-secondary rounded-lg px-3 py-2 text-sm"
        [disabled]="saving()"
        (click)="closed.emit()"
      >
        Abbrechen</button
      ><button
        type="button"
        class="linear-btn-primary rounded-lg px-3 py-2 text-sm disabled:opacity-50"
        [disabled]="saving() || form.invalid"
        (click)="save()"
      >
        {{ saving() ? 'Speichere…' : dialogTitle() }}
      </button>
    </footer>
  </section>
</div>
