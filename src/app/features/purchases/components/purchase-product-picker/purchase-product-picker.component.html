<app-article-picker
  [entries]="entries()"
  [imageUrls]="imageUrls()"
  [initialSearch]="initialSearch()"
  [allowCreate]="true"
  [allowVariantCreation]="true"
  [detailsOpen]="creatingFor() !== null"
  [(selection)]="selection"
  variantHint="Wähle die Größe und Farbe für diese Einkaufsposition."
  (createRequested)="createRequested.emit()"
  (variantCreateRequested)="startVariantCreation($event)"
  (imageFailed)="imageFailed.emit($event)"
  (closed)="closed.emit()"
  (selected)="onSelected($event)"
>
  <div picker-details>
    @if (creatingFor(); as product) {
      <p class="mb-4 text-sm font-semibold">{{ product.title }}</p>
      <app-product-variant-create-form
        [product]="product"
        (created)="onVariantCreated($event)"
        (cancelled)="creatingFor.set(null)"
      />
    }
  </div>
</app-article-picker>
