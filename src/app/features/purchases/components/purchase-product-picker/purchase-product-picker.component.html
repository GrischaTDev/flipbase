<app-modal-shell title="Artikel auswählen" size="lg" (closed)="closed.emit()">
  <app-text-field
    label="Artikel suchen"
    placeholder="Nach Bezeichnung oder Barcode suchen"
    [formControl]="searchControl"
  />
  @if (initialSearch() && query() === undefined) {
    <p class="text-[13px] text-fb-text-muted">Suche: {{ initialSearch() }}</p>
  }
  <div class="divide-y divide-fb-line">
    @for (product of filtered(); track product.id) {
      <button
        type="button"
        [attr.data-product-option]="product.id"
        [attr.aria-pressed]="selection().has(product.id)"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-2 py-3 text-left hover:bg-fb-surface-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fb-primary/60"
        (click)="toggle(product.id)"
      >
        <span
          aria-hidden="true"
          class="flex h-4 w-4 shrink-0 items-center justify-center rounded border text-[10px] font-bold transition"
          [class.border-[#fcc601]]="selection().has(product.id)"
          [class.bg-[#fcc601]]="selection().has(product.id)"
          [class.text-slate-950]="selection().has(product.id)"
          [class.border-fb-border-hover]="!selection().has(product.id)"
          [class.bg-fb-well]="!selection().has(product.id)"
        >
          @if (selection().has(product.id)) {
            ✓
          }
        </span>
        <app-product-thumbnail
          [src]="imageUrls()[product.id] || null"
          (imageFailed)="imageFailed.emit(product.id)"
        />
        <div class="min-w-0 flex-1 text-[13px]">
          <p class="break-words font-medium">{{ product.title }}</p>
          <p class="text-fb-text-muted">
            {{ product.ean || 'Kein Barcode' }}
            @if (product.condition) {
              · {{ product.condition | itemConditionLabel }}
            }
          </p>
        </div>
      </button>
    } @empty {
      <p class="py-6 text-center text-sm text-fb-text-muted">Keine passenden Artikel gefunden.</p>
    }
  </div>
  <app-button variant="plain" (clicked)="createRequested.emit()">Produkt erstellen</app-button>
  <div modal-footer class="flex gap-2">
    <app-button variant="secondary" (clicked)="closed.emit()">Abbrechen</app-button>
    <app-button variant="primary" [disabled]="selection().size === 0" (clicked)="confirm()"
      >Hinzufügen ({{ selection().size }})</app-button
    >
  </div>
</app-modal-shell>
