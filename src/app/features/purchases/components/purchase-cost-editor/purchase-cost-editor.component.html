<div [formGroup]="form">
  <div
    class="hidden grid-cols-[minmax(0,1fr)_minmax(9rem,1fr)_2.25rem] gap-3 px-0.5 pb-2 text-[13px] font-semibold text-fb-text-secondary sm:grid"
    aria-hidden="true"
  >
    <span>Zusatzausgabe</span>
    <span>Betrag</span>
    <span></span>
  </div>

  <div formArrayName="costRows" class="divide-y divide-fb-line border-y border-fb-line">
    @for (costRow of costRows.controls; track costRow; let index = $index) {
      <div [formGroupName]="index" class="py-3">
        <div
          class="grid grid-cols-[minmax(0,1fr)_2.25rem] gap-3 sm:grid-cols-[minmax(0,1fr)_minmax(9rem,1fr)_2.25rem] sm:items-center"
        >
          <div class="min-w-0">
            <span class="mb-1 block text-[12px] font-semibold text-fb-text-secondary sm:hidden">
              Zusatzausgabe
            </span>
            <app-custom-select
              [ariaLabel]="'Zusatzausgabe ' + (index + 1)"
              [options]="adjustmentOptions"
              formControlName="adjustment"
              placeholder="Auswählen"
              size="sm"
            />
          </div>

          <div class="min-w-0 max-sm:col-start-1">
            <span class="mb-1 block text-[12px] font-semibold text-fb-text-secondary sm:hidden">
              Betrag
            </span>
            <app-number-input
              formControlName="amount"
              placeholder="0,00"
              [ariaLabel]="'Betrag ' + (index + 1)"
              [step]="0.01"
              [min]="0"
              unit="€"
              [asCurrency]="true"
              [showStepper]="false"
            />
          </div>

          <button
            type="button"
            [attr.aria-label]="'Zusatzausgabe ' + (index + 1) + ' entfernen'"
            class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-fb-text-muted hover:bg-fb-critical-surface hover:text-fb-critical focus-visible:outline-2 focus-visible:outline-fb-critical"
            (click)="removeCostRow(index)"
          >
            <svg [lucideIcon]="removeIcon" class="h-4 w-4" aria-hidden="true"></svg>
          </button>
        </div>
      </div>
    }
  </div>

  <app-button
    class="mt-3"
    variant="plain"
    size="md"
    [icon]="addIcon"
    [disabled]="costRows.invalid"
    (clicked)="addCostRow()"
  >
    Zusatzausgabe hinzufügen
  </app-button>
</div>
