<app-entry-page-layout
  title="Einkauf erstellen"
  subtitle="Verkäufer, Artikel und Kosten erfassen. Inhalte können später ergänzt werden."
  backLabel="Zurück zu Einkäufen"
  (cancelled)="returnToPurchases()"
>
  <app-button
    entry-header-actions
    variant="primary-dark"
    [loading]="isSaving()"
    [disabled]="!canSaveDraft()"
    (clicked)="saveDraft()"
  >
    Entwurf speichern
  </app-button>
  <app-purchase-entry-form (closed)="returnToPurchases()" />
</app-entry-page-layout>
