<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        {{ 'PURCHASES.TITLE' | translate }}
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        Verwalte Einzelartikel, Mystery Packs und Paletten mit automatischer Kostenverteilung.
      </p>
    </div>

    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md transition cursor-pointer"
    >
      <lucide-icon [img]="plusIcon" class="w-4 h-4"></lucide-icon>
      <span>{{ 'PURCHASES.NEW_PURCHASE' | translate }}</span>
    </button>
  </div>

  <!-- Type Filter Tabs (Section 8) -->
  <div class="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-2 overflow-x-auto text-xs font-semibold">
    <button
      type="button"
      (click)="activeTab.set('all')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeTab() === 'all'"
      [class.text-white]="activeTab() === 'all'"
      [class.dark:bg-emerald-600]="activeTab() === 'all'"
      [class.text-slate-600]="activeTab() !== 'all'"
      [class.dark:text-slate-400]="activeTab() !== 'all'"
    >
      Alle Einkäufe
    </button>
    <button
      type="button"
      (click)="activeTab.set('single')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeTab() === 'single'"
      [class.text-white]="activeTab() === 'single'"
      [class.dark:bg-emerald-600]="activeTab() === 'single'"
      [class.text-slate-600]="activeTab() !== 'single'"
      [class.dark:text-slate-400]="activeTab() !== 'single'"
    >
      {{ 'PURCHASES.TYPE_SINGLE' | translate }}
    </button>
    <button
      type="button"
      (click)="activeTab.set('mystery_pack')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeTab() === 'mystery_pack'"
      [class.text-white]="activeTab() === 'mystery_pack'"
      [class.dark:bg-emerald-600]="activeTab() === 'mystery_pack'"
      [class.text-slate-600]="activeTab() !== 'mystery_pack'"
      [class.dark:text-slate-400]="activeTab() !== 'mystery_pack'"
    >
      {{ 'PURCHASES.TYPE_MYSTERY' | translate }}
    </button>
    <button
      type="button"
      (click)="activeTab.set('pallet')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeTab() === 'pallet'"
      [class.text-white]="activeTab() === 'pallet'"
      [class.dark:bg-emerald-600]="activeTab() === 'pallet'"
      [class.text-slate-600]="activeTab() !== 'pallet'"
      [class.dark:text-slate-400]="activeTab() !== 'pallet'"
    >
      {{ 'PURCHASES.TYPE_PALLET' | translate }}
    </button>
  </div>

  <!-- Empty state for purchases -->
  <div class="p-12 text-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl">
    <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 mx-auto flex items-center justify-center mb-3">
      <lucide-icon [img]="bagIcon" class="w-6 h-6"></lucide-icon>
    </div>
    <h3 class="text-base font-bold text-slate-800 dark:text-slate-200">Noch keine Einkäufe erfasst</h3>
    <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-5">
      Erfasse deinen ersten Einkauf aus Kleinanzeigen, eBay, Mystery Packs oder Retourenpaletten.
    </p>
    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition"
    >
      <lucide-icon [img]="plusIcon" class="w-4 h-4"></lucide-icon>
      <span>Einkauf hinzufügen</span>
    </button>
  </div>
</div>
