<section
  class="space-y-4 rounded-lg border border-fb-border p-4"
  aria-label="Kleinanzeigen-Zielangaben"
>
  <h2 class="text-sm font-semibold text-fb-text-primary">
    Kleinanzeigen · {{ targetName() || 'Zielkonto prüfen' }}
  </h2>
  @if (error(); as message) {
    <app-notice-banner announcement="alert">{{ message }}</app-notice-banner>
  }
  <app-category-picker
    [source]="categorySource"
    [formControl]="categorySelection"
    label="Kategorie"
    placeholder="Kategorie suchen oder auswählen"
  />
  @if (busy()) {
    <p class="text-sm text-fb-text-secondary" role="status">
      Kleinanzeigen-Eigenschaften werden geladen …
    </p>
  }
  @if (schemaLoadFailed() && categorySelection.value && !busy()) {
    <app-button
      [disabled]="!scope() || !extension.formSchemaAvailable()"
      (clicked)="selectCategory(categorySelection.value)"
      >Eigenschaften erneut laden</app-button
    >
  }
  @if (schema(); as currentSchema) {
    <app-kleinanzeigen-listing-fields
      [schema]="currentSchema"
      [attributes]="attributes"
      [shippingEnabled]="content().shippingType === 'both'"
      [shippingGroup]="shippingGroup"
      [selectedGroup]="selectedGroup()"
      [selectedMethods]="methods()"
      (methodsChanged)="chooseMethods($event)"
    />
  }
  <app-kleinanzeigen-publication-panel
    [scope]="publicationScope()"
    [publicationAllowed]="publicationAllowed()"
    [draftId]="listing().id"
    [revision]="listing().revision ?? 1"
    [published]="listing().status === 'online'"
    [unsaved]="unsaved()"
    [issues]="publicationIssues()"
    (confirmed)="confirmed.emit()"
  />
</section>
