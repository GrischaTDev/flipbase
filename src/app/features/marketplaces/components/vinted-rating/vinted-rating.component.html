<div class="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 text-xs text-fb-text-secondary">
  @if (score() !== null) {
    <span class="font-bold tabular-nums text-fb-text-primary">{{ score() | number: '1.1-1' }}</span>
    <span role="img" [attr.aria-label]="scoreLabel()" class="inline-flex gap-0.5 text-[#d49b00]">
      @for (star of stars; track star) {
        <svg
          [lucideIcon]="starIcon"
          class="size-3.5"
          [class.fill-current]="star <= filledStars()"
          aria-hidden="true"
        ></svg>
      }
    </span>
  }
  <span>({{ count() ?? 0 }} {{ count() === 1 ? 'Bewertung' : 'Bewertungen' }})</span>
</div>
