@if (label() || action() || (!iconOnly() && deadline())) {
  <div data-shipping-label-actions class="flex min-w-0 flex-col gap-2">
    @if (deadline()) {
      <p
        class="truncate text-xs text-fb-text-secondary"
        [class.sr-only]="iconOnly()"
        [attr.title]="'Verschicken bis ' + deadline()"
      >
        Verschicken bis {{ deadline() }}
      </p>
    }
    @if (label(); as current) {
      <app-button
        variant="primary"
        size="slim"
        [fullWidth]="!iconOnly()"
        [iconOnly]="iconOnly()"
        [ariaLabel]="iconOnly() ? actionLabel() : ''"
        [title]="actionTooltip()"
        [icon]="openIcon"
        link="/marketplaces/vinted/shipping-labels"
        [queryParams]="{ labelId: current.id }"
        >{{ actionLabel() }}</app-button
      >
    } @else if (action()) {
      <app-button
        variant="primary"
        size="slim"
        [fullWidth]="!iconOnly()"
        [iconOnly]="iconOnly()"
        [ariaLabel]="iconOnly() ? actionLabel() : ''"
        [title]="actionTooltip()"
        [icon]="iconOnly() ? openIcon : requestIcon"
        [loading]="requesting()"
        (clicked)="request()"
        >{{ actionLabel() }}</app-button
      >
    }
  </div>
}
