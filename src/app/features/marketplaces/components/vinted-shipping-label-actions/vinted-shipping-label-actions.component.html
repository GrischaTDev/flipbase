@if (label() || action() || deadline()) {
  <div data-shipping-label-actions class="flex min-w-0 flex-col gap-2">
    @if (deadline()) {
      <p
        class="truncate text-xs text-fb-text-secondary"
        [attr.title]="'Verschicken bis ' + deadline()"
      >
        Verschicken bis {{ deadline() }}
      </p>
    }
    @if (label(); as current) {
      <app-button
        variant="primary"
        size="slim"
        [fullWidth]="true"
        [icon]="openIcon"
        link="/marketplaces/vinted/shipping-labels"
        [queryParams]="{ connectionId: current.connectionId, labelId: current.id }"
        >Zum Versandschein</app-button
      >
    } @else if (action()) {
      <app-button
        variant="primary"
        size="slim"
        [fullWidth]="true"
        [icon]="requestIcon"
        [loading]="requesting()"
        (clicked)="request()"
        >{{
          action() === 'order' ? 'Versandschein anfordern' : 'Versandschein abholen'
        }}</app-button
      >
    }
  </div>
}
