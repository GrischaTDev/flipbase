<section [attr.aria-label]="accountName()" class="min-w-0">
  <ul class="space-y-1.5">
    @for (row of rows(); track row.action.id) {
      <li
        [attr.data-action-state]="row.action.state"
        [attr.data-action-id]="row.action.id"
        class="flex min-w-0 flex-wrap items-center gap-x-2.5 gap-y-1 rounded-lg bg-fb-surface-hover px-2 py-2"
      >
        <app-action-status-indicator [state]="row.indicator" />
        <div class="min-w-0 flex-1">
          <p class="text-[13px] font-medium leading-5 text-fb-text-primary">{{ row.title }}</p>
          <p class="truncate text-xs leading-5 text-fb-text-secondary" [attr.title]="row.subtitle">
            {{ row.subtitle }}
          </p>
          @if (row.waitReason) {
            <p role="status" class="text-xs leading-5 text-fb-text-secondary">
              {{ row.waitReason }}
            </p>
          }
        </div>
        @if (row.dismissible) {
          <app-button
            variant="ghost"
            size="slim"
            [icon]="dismissIcon"
            [iconOnly]="true"
            ariaLabel="Meldung ausblenden"
            (clicked)="dismiss(row.action)"
          />
        }
        <time
          data-action-time
          class="w-full text-right text-[11px] tabular-nums text-fb-text-secondary"
          [attr.datetime]="row.action.updatedAt"
          >{{ row.action.updatedAt | date: 'dd.MM.yyyy, HH:mm' }}</time
        >
      </li>
    }
  </ul>
</section>
