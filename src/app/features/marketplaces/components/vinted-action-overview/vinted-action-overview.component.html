<section [attr.aria-label]="accountName()" class="space-y-2">
  <h3 class="truncate text-xs font-medium text-fb-text-secondary">{{ accountName() }} · Vinted</h3>
  <ul class="space-y-1.5">
    @for (row of rows(); track row.action.id) {
      <li
        data-action-state="running"
        [attr.data-action-id]="row.action.id"
        class="flex min-w-0 items-start gap-2.5 rounded-lg bg-fb-brand-surface px-2 py-2"
      >
        <span class="mt-0.5 shrink-0 text-fb-brand"><app-loading-indicator size="md" /></span>
        <div class="min-w-0 flex-1">
          <p class="text-[13px] font-medium leading-5 text-fb-text-primary">{{ row.title }}</p>
          @if (row.subtitle) {
            <p
              class="truncate text-xs leading-5 text-fb-text-secondary"
              [attr.title]="row.subtitle"
            >
              {{ row.subtitle }}
            </p>
          }
        </div>
      </li>
    }
  </ul>
</section>
