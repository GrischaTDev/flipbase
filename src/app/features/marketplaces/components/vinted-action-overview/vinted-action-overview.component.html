@let item = row();
<div
  [attr.data-action-state]="item.action.state"
  [attr.data-action-id]="item.action.id"
  class="flex min-w-0 items-start gap-3"
>
  <app-action-status-thumbnail [state]="item.indicator" [imageUrl]="item.action.imageUrl" />
  <div class="min-w-0 flex-1">
    <p class="text-[13px] font-medium leading-5 text-fb-text-primary">{{ item.title }}</p>
    @if (item.action.itemTitle) {
      <p class="truncate text-xs leading-5 text-fb-text-secondary">{{ item.action.itemTitle }}</p>
    }
    <p class="truncate text-xs leading-5 text-fb-text-secondary" [attr.title]="item.subtitle">
      {{ item.subtitle }}
    </p>
    @if (item.waitReason) {
      <p role="status" class="text-xs leading-5 text-fb-text-secondary">{{ item.waitReason }}</p>
    }
    <time
      data-action-time
      class="block text-[11px] leading-5 tabular-nums text-fb-text-secondary"
      [attr.datetime]="item.action.updatedAt"
      >{{ item.action.updatedAt | date: 'dd.MM.yyyy, HH:mm' }}</time
    >
  </div>
  @if (item.dismissible) {
    <app-button
      variant="ghost"
      size="slim"
      [icon]="dismissIcon"
      [iconOnly]="true"
      ariaLabel="Meldung ausblenden"
      (clicked)="dismiss(item.action)"
    />
  }
</div>
