<div class="flex flex-wrap items-center gap-2">
  <div class="min-w-0 flex-1 basis-36 sm:w-48 sm:flex-none sm:basis-auto">
    <app-custom-select
      ariaLabel="Vinted-Konto auswählen"
      [options]="accountOptions()"
      [value]="account().connectionId"
      (valueChange)="accountSelected.emit($event)"
    />
  </div>
  <app-button
    [icon]="refreshIcon"
    [iconOnly]="true"
    ariaLabel="Kontodaten aktualisieren"
    title="Kontodaten aktualisieren"
    [loading]="refreshing()"
    [disabled]="loading() || !canManage() || account().status !== 'connected'"
    (clicked)="refreshRequested.emit()"
  />
  <app-vinted-sync-schedule
    [account]="account()"
    [canManage]="canManage()"
    (synchronized)="synchronized.emit($event)"
  />
</div>
<div class="mt-2 flex justify-end" aria-live="polite" aria-atomic="true">
  @if (account().lastSyncedAt) {
    <app-badge tone="neutral" size="md">
      <span>Aktualisiert</span>
      <time [attr.datetime]="account().lastSyncedAt">
        {{ account().lastSyncedAt | date: 'HH:mm' }} Uhr ·
        {{ account().lastSyncedAt | date: 'dd.MM.yy' }}
      </time>
    </app-badge>
  } @else {
    <span class="text-xs text-fb-text-secondary">Noch keine Datenübernahme</span>
  }
</div>
