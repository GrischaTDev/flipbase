<section class="block" aria-label="Vinted-Benachrichtigungen">
  @if (loading()) {
    <p role="status" class="text-[13px] text-fb-text-secondary">
      Benachrichtigungen werden geladen …
    </p>
  }
  @if (settings()) {
    @for (category of categories; track category.key) {
      <app-custom-checkbox
        [label]="category.label"
        presentation="switch"
        [formControl]="categoryControls[category.key]"
      />
    }
  }
  @if (busy()) {
    <p role="status" class="mt-2 text-xs text-fb-text-secondary">Einstellung wird gespeichert …</p>
  }
  @if (error(); as message) {
    <app-notice-banner class="mt-2" announcement="alert">
      {{ message }}
      <app-button class="mt-2" [disabled]="loading() || busy()" (clicked)="reload()"
        >Erneut versuchen</app-button
      >
    </app-notice-banner>
  }
</section>
