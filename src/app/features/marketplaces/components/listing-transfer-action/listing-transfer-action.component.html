@if (available()) {
  <app-button
    [variant]="compact() ? 'table-action' : 'secondary'"
    size="slim"
    [ariaLabel]="title() + ' inserieren'"
    [ariaHaspopup]="'dialog'"
    [icon]="publishIcon"
    [iconOnly]="true"
    title="Inserieren"
    (clicked)="open.set(true)"
  />
  @if (open()) {
    <app-listing-transfer-dialog
      [source]="reference()"
      (published)="published.emit($event)"
      (closed)="open.set(false)"
    />
  }
}
