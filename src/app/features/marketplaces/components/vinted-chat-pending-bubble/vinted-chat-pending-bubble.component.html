<div
  data-chat-pending-bubble
  class="relative rounded-2xl rounded-br-sm px-3 py-2 text-[13px]"
  [class.min-h-16]="pending()"
  [class.bg-fb-brand-strong/25]="pending()"
  [class.text-fb-text-primary]="pending()"
  [class.bg-fb-brand-strong]="!pending()"
  [class.text-fb-on-accent]="!pending()"
  [attr.aria-busy]="pending() ? 'true' : null"
>
  <div
    data-chat-pending-content
    class="flex items-start justify-between gap-2"
    [class.opacity-40]="pending()"
    [class.grayscale]="pending()"
  >
    <div class="min-w-0"><ng-content /></div>
    <ng-content select="[bubble-action]" />
  </div>
  @if (pending()) {
    <div
      data-chat-pending-status
      role="status"
      class="absolute inset-0 flex flex-col items-center justify-center gap-1.5 text-fb-text-primary"
    >
      <app-loading-indicator size="md" />
      <app-badge [tone]="statusTone()">{{ statusLabel() }}</app-badge>
    </div>
  } @else {
    <div data-chat-pending-status role="status" class="mt-1">
      <app-badge [tone]="statusTone()">{{ statusLabel() }}</app-badge>
    </div>
  }
</div>
