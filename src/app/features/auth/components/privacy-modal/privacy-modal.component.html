<app-modal-shell
  [title]="'AUTH.PRIVACY_TITLE' | translate"
  size="md"
  [closeOnBackdrop]="true"
  (closed)="closed.emit()"
>
  <div
    class="space-y-3 text-xs text-fb-text-secondary leading-relaxed max-h-[60vh] overflow-y-auto pr-1"
  >
    <p class="font-medium text-fb-text-primary">{{ 'AUTH.PRIVACY_HEADING' | translate }}</p>
    <p>
      {{ 'AUTH.PRIVACY_PLACEHOLDER' | translate }}
    </p>
    <p>
      {{ 'AUTH.PRIVACY_USAGE_NOTICE' | translate }}
      <a
        href="https://flipbase.de/datenschutz/#beta-app-nutzung"
        target="_blank"
        rel="noopener noreferrer"
        class="text-fb-text-primary underline decoration-fb-primary decoration-2 underline-offset-2 focus-visible:outline-2 focus-visible:outline-fb-primary"
        >{{ 'AUTH.PRIVACY_USAGE_LINK' | translate }}</a
      >
    </p>
    <div class="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs">
      {{ 'AUTH.PRIVACY_NOTE' | translate }}
    </div>
  </div>

  <div modal-footer class="flex justify-end">
    <app-button type="button" variant="secondary" size="md" (clicked)="closed.emit()">
      {{ 'COMMON.CLOSE' | translate }}
    </app-button>
  </div>
</app-modal-shell>
