<div
  class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in"
  appModalDialog
  [dialogTitel]="'AUTH.PRIVACY_TITLE' | translate"
  (dialogClose)="closed.emit()"
  [schliesstBeiKlickAussen]="true"
>
  <div
    class="linear-surface rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-fb-border bg-fb-surface animate-modal-card"
  >
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-fb-border">
      <h3 class="text-base font-bold text-fb-text-primary">
        {{ 'AUTH.PRIVACY_TITLE' | translate }}
      </h3>
      <button
        type="button"
        (click)="closed.emit()"
        class="p-1.5 rounded-lg text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-surface-hover transition cursor-pointer"
        [attr.aria-label]="'COMMON.CLOSE' | translate"
      >
        <svg [lucideIcon]="closeIcon" class="w-4 h-4"></svg>
      </button>
    </div>

    <div
      class="space-y-3 text-xs text-fb-text-secondary leading-relaxed max-h-[60vh] overflow-y-auto pr-1"
    >
      <p class="font-medium text-fb-text-primary">Flipbase – Datenschutzerklärung</p>
      <p>
        {{ 'AUTH.PRIVACY_PLACEHOLDER' | translate }}
      </p>
      <div
        class="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs"
      >
        Hinweis: Die verbindlichen Datenschutzbestimmungen werden hier rechtzeitig vor dem
        offiziellen Produktivstart hinterlegt.
      </div>
    </div>

    <div class="flex justify-end pt-4 mt-4 border-t border-fb-border">
      <button
        type="button"
        (click)="closed.emit()"
        class="linear-btn-secondary px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer"
      >
        {{ 'COMMON.CLOSE' | translate }}
      </button>
    </div>
  </div>
</div>
