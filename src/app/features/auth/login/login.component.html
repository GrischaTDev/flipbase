<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-500 text-white mb-3 shadow-lg shadow-emerald-500/20">
        <lucide-icon [img]="logoIcon" class="w-6 h-6"></lucide-icon>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">ReFlip</h1>
      <p class="text-xs text-slate-400 mt-1">Entscheidungs- und Finanzsystem für Reseller</p>
      <h2 class="text-lg font-bold text-slate-200 mt-4">{{ 'AUTH.SIGN_IN_TITLE' | translate }}</h2>
    </div>

    <!-- Error Box -->
    @if (errorMessage()) {
      <div class="p-3 mb-5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          {{ 'AUTH.EMAIL' | translate }}
        </label>
        <div class="relative flex items-center">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <lucide-icon [img]="mailIcon" class="w-4 h-4"></lucide-icon>
          </div>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="deine.email@beispiel.de"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white placeholder-slate-500 text-sm focus:outline-hidden focus:ring-2 focus:ring-emerald-500"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          {{ 'AUTH.PASSWORD' | translate }}
        </label>
        <div class="relative flex items-center">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <lucide-icon [img]="lockIcon" class="w-4 h-4"></lucide-icon>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white placeholder-slate-500 text-sm focus:outline-hidden focus:ring-2 focus:ring-emerald-500"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || isLoading()"
        class="w-full mt-2 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 disabled:opacity-50 transition flex items-center justify-center gap-2 cursor-pointer"
      >
        <lucide-icon [img]="loginIcon" class="w-4 h-4"></lucide-icon>
        <span>{{ isLoading() ? ('COMMON.LOADING' | translate) : ('AUTH.SUBMIT_LOGIN' | translate) }}</span>
      </button>

      <!-- Instant Demo Mode Button -->
      <div class="pt-2">
        <div class="relative flex py-2 items-center">
          <div class="grow border-t border-slate-700"></div>
          <span class="shrink mx-3 text-[10px] uppercase font-bold text-slate-500">Oder ohne Backend</span>
          <div class="grow border-t border-slate-700"></div>
        </div>

        <button
          type="button"
          (click)="onDemoLogin()"
          class="w-full py-2.5 rounded-xl border border-emerald-500/40 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-bold text-xs shadow-md transition flex items-center justify-center gap-2 cursor-pointer"
        >
          <lucide-icon [img]="zapIcon" class="w-4 h-4 text-emerald-400"></lucide-icon>
          <span>ReFlip Demo-Modus starten (Sofort loslegen)</span>
        </button>
      </div>
    </form>

    <!-- Footer Switch to Register -->
    <div class="mt-6 text-center text-xs text-slate-400">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a routerLink="/auth/register" class="text-emerald-400 font-semibold hover:underline ml-1">
        {{ 'AUTH.REGISTER' | translate }}
      </a>
    </div>
  </div>
</div>
