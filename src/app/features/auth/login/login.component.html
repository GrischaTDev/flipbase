<div class="min-h-screen bg-fb-well flex items-center justify-center p-4 relative">
  <!-- Zurück zur Startseite -->
  <a
    [href]="landingUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="absolute top-4 left-4 sm:top-6 sm:left-6 z-10 inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-surface-alt/80 transition focus:outline-hidden focus:ring-2 focus:ring-amber-500"
  >
    <svg [lucideIcon]="arrowLeftIcon" class="w-4 h-4"></svg>
    <span>{{ 'AUTH.BACK_TO_HOME' | translate }}</span>
  </a>

  <!-- Theme & Language Switcher (oben rechts) -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10 flex items-center gap-2">
    <!-- Design umschalten (hell / dunkel) -->
    <button
      type="button"
      (click)="themeService.toggleTheme()"
      class="p-2 rounded-xl border border-fb-border bg-fb-surface-alt text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-surface transition cursor-pointer focus:outline-hidden focus:ring-2 focus:ring-amber-500"
      [attr.aria-label]="
        (themeService.isDark() ? 'COMMON.SWITCH_TO_LIGHT' : 'COMMON.SWITCH_TO_DARK') | translate
      "
      [title]="(themeService.isDark() ? 'COMMON.THEME_LIGHT' : 'COMMON.THEME_DARK') | translate"
    >
      <svg [lucideIcon]="themeService.isDark() ? sunIcon : moonIcon" class="w-4 h-4"></svg>
    </button>

    <!-- Language Toggle -->
    <div
      class="flex items-center border border-fb-border rounded-xl p-0.5 bg-fb-surface-alt text-xs font-semibold"
    >
      <button
        type="button"
        (click)="switchLanguage('de')"
        class="px-2.5 py-1 rounded-lg transition cursor-pointer"
        [class.bg-fb-border]="currentLanguage() === 'de'"
        [class.shadow-xs]="currentLanguage() === 'de'"
        [class.text-fb-text-primary]="currentLanguage() === 'de'"
        [class.text-fb-text-muted]="currentLanguage() !== 'de'"
      >
        DE
      </button>
      <button
        type="button"
        (click)="switchLanguage('en')"
        class="px-2.5 py-1 rounded-lg transition cursor-pointer"
        [class.bg-fb-border]="currentLanguage() === 'en'"
        [class.shadow-xs]="currentLanguage() === 'en'"
        [class.text-fb-text-primary]="currentLanguage() === 'en'"
        [class.text-fb-text-muted]="currentLanguage() !== 'en'"
      >
        EN
      </button>
    </div>
  </div>

  <div
    class="max-w-md w-full bg-fb-surface-alt border border-fb-border rounded-2xl p-6 sm:p-8 shadow-xs"
  >
    <!-- Brand & Heading -->
    <div class="mb-6 text-center">
      <div class="flex items-center justify-center gap-2.5 mb-2">
        <img
          ngSrc="images/logo-mark.png"
          width="32"
          height="32"
          alt="Flipbase"
          class="fb-logo-mark w-8 h-8 shrink-0"
          priority
        />
        <span class="text-xl font-bold text-fb-text-primary tracking-tight">Flipbase</span>
      </div>
      <h1 class="text-base font-semibold text-fb-text-secondary">
        {{ 'AUTH.SIGN_IN_TITLE' | translate }}
      </h1>
    </div>

    <!-- Error Box -->
    @if (errorMessage()) {
      <div
        class="p-3 mb-5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs"
      >
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-fb-text-secondary mb-1.5">
          {{ 'AUTH.EMAIL' | translate }}
        </label>
        <div class="relative flex items-center">
          <div
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-fb-text-muted"
          >
            <svg [lucideIcon]="mailIcon" class="w-4 h-4"></svg>
          </div>
          <input
            id="email"
            type="email"
            formControlName="email"
            [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-fb-border bg-fb-well text-fb-text-primary placeholder-fb-text-dimmed text-sm focus:outline-hidden focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-fb-text-secondary mb-1.5">
          {{ 'AUTH.PASSWORD' | translate }}
        </label>
        <div class="relative flex items-center">
          <div
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-fb-text-muted"
          >
            <svg [lucideIcon]="lockIcon" class="w-4 h-4"></svg>
          </div>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-fb-border bg-fb-well text-fb-text-primary placeholder-fb-text-dimmed text-sm focus:outline-hidden focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500"
          />
        </div>
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [disabled]="form.invalid"
        [loading]="isLoading()"
        [icon]="loginIcon"
        class="mt-2 block w-full"
      >
        {{ 'AUTH.SUBMIT_LOGIN' | translate }}
      </app-button>
    </form>

    <!-- Footer Switch to Register -->
    <div class="mt-6 text-center text-xs text-fb-text-muted">
      {{ 'AUTH.NO_ACCOUNT' | translate }}
      <a
        routerLink="/auth/register"
        class="text-amber-500 dark:text-amber-400 font-semibold hover:underline ml-1"
      >
        {{ 'AUTH.REGISTER' | translate }}
      </a>
    </div>
  </div>
</div>
