<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        {{ 'INVENTORY.TITLE' | translate }}
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        Übersicht aller Artikel, Zustand, Status-Lifecycle und Gewinnpotenziale.
      </p>
    </div>

    <button
      type="button"
      class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow-md transition cursor-pointer"
    >
      <lucide-icon [img]="plusIcon" class="w-4 h-4"></lucide-icon>
      <span>{{ 'INVENTORY.NEW_ITEM' | translate }}</span>
    </button>
  </div>

  <!-- Saved Filter Views (Section 23) -->
  <div class="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-2 overflow-x-auto text-xs font-semibold">
    <button
      type="button"
      (click)="activeFilter.set('all')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeFilter() === 'all'"
      [class.text-white]="activeFilter() === 'all'"
      [class.dark:bg-emerald-600]="activeFilter() === 'all'"
      [class.text-slate-600]="activeFilter() !== 'all'"
      [class.dark:text-slate-400]="activeFilter() !== 'all'"
    >
      Alle Artikel
    </button>
    <button
      type="button"
      (click)="activeFilter.set('needs_research')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeFilter() === 'needs_research'"
      [class.text-white]="activeFilter() === 'needs_research'"
      [class.dark:bg-emerald-600]="activeFilter() === 'needs_research'"
      [class.text-slate-600]="activeFilter() !== 'needs_research'"
      [class.dark:text-slate-400]="activeFilter() !== 'needs_research'"
    >
      Noch recherchieren
    </button>
    <button
      type="button"
      (click)="activeFilter.set('unlisted')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeFilter() === 'unlisted'"
      [class.text-white]="activeFilter() === 'unlisted'"
      [class.dark:bg-emerald-600]="activeFilter() === 'unlisted'"
      [class.text-slate-600]="activeFilter() !== 'unlisted'"
      [class.dark:text-slate-400]="activeFilter() !== 'unlisted'"
    >
      Noch nicht gelistet
    </button>
    <button
      type="button"
      (click)="activeFilter.set('aged')"
      class="px-3 py-1.5 rounded-lg transition"
      [class.bg-slate-900]="activeFilter() === 'aged'"
      [class.text-white]="activeFilter() === 'aged'"
      [class.dark:bg-emerald-600]="activeFilter() === 'aged'"
      [class.text-slate-600]="activeFilter() !== 'aged'"
      [class.dark:text-slate-400]="activeFilter() !== 'aged'"
    >
      > 30 Tage im Lager
    </button>
  </div>

  <!-- Empty state for inventory -->
  <div class="p-12 text-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl">
    <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 mx-auto flex items-center justify-center mb-3">
      <lucide-icon [img]="boxesIcon" class="w-6 h-6"></lucide-icon>
    </div>
    <h3 class="text-base font-bold text-slate-800 dark:text-slate-200">Dein Inventar ist leer</h3>
    <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-5">
      Sobald du Einkäufe oder Artikel anlegst, erscheinen sie hier in der Inventartabelle.
    </p>
  </div>
</div>
