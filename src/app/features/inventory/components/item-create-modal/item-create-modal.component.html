<div class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto animate-fade-in select-none">
  <div class="linear-surface rounded-2xl shadow-2xl max-w-xl w-full p-6 border border-[#373e4d] my-8">
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-[#373e4d]">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center">
          <lucide-icon [img]="boxesIcon" class="w-4 h-4"></lucide-icon>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-100">Neuen Inventar-Artikel anlegen</h2>
          <p class="text-[11px] text-slate-400">Artikel erfassen mit Zustand & Kostenallokation</p>
        </div>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="p-1 rounded-md text-slate-400 hover:text-white hover:bg-[#373e4d] transition cursor-pointer"
      >
        <lucide-icon [img]="closeIcon" class="w-4 h-4"></lucide-icon>
      </button>
    </div>

    @if (errorMessage()) {
      <div class="p-3 mb-4 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-3.5">
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="itemTitle" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400">
            Artikelname / Produkttitel
          </label>

          <button
            type="button"
            (click)="onAiAutofill()"
            [disabled]="isAiLoading() || !form.get('title')?.value"
            class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 text-[10px] font-semibold transition disabled:opacity-40 cursor-pointer"
          >
            <lucide-icon [img]="sparklesIcon" class="w-3 h-3 text-emerald-400"></lucide-icon>
            <span>{{ isAiLoading() ? 'Analysiere...' : '🤖 KI-Autofill' }}</span>
          </button>
        </div>
        <input
          id="itemTitle"
          type="text"
          formControlName="title"
          placeholder="z.B. Bosch Akku-Bohrschrauber GSR 18V-55 wie neu"
          class="linear-input w-full px-3 py-2 rounded-lg text-xs font-medium placeholder-slate-400"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <div>
          <label for="itemCategory" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Kategorie
          </label>
          <input
            id="itemCategory"
            type="text"
            formControlName="category"
            placeholder="z.B. Werkzeug"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs"
          />
        </div>

        <div>
          <label for="itemBrand" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Marke
          </label>
          <input
            id="itemBrand"
            type="text"
            formControlName="brand"
            placeholder="z.B. Bosch"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs"
          />
        </div>

        <div>
          <label for="itemModel" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Modell
          </label>
          <input
            id="itemModel"
            type="text"
            formControlName="model"
            placeholder="z.B. GSR 18V-55"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label for="itemCondition" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Zustand
          </label>
          <select
            id="itemCondition"
            formControlName="condition"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs cursor-pointer text-slate-200"
          >
            <option value="new">Neu / OVP</option>
            <option value="like_new">Wie neu</option>
            <option value="very_good">Sehr gut</option>
            <option value="used">Gebraucht</option>
            <option value="heavily_used">Stark gebraucht</option>
            <option value="defective">Defekt / Ersatzteil</option>
          </select>
        </div>

        <div>
          <label for="itemStatus" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Status-Lifecycle
          </label>
          <select
            id="itemStatus"
            formControlName="status"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs cursor-pointer text-slate-200"
          >
            <option value="received">Eingetroffen (received)</option>
            <option value="needs_review">Zu prüfen (needs_review)</option>
            <option value="researched">Recherchiert (researched)</option>
            <option value="ready">Verkaufsbereit (ready)</option>
            <option value="listed">Gelistet (listed)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
        <div>
          <label for="itemCost" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Direkte Anschaffungskosten (€)
          </label>
          <input
            id="itemCost"
            type="number"
            formControlName="allocated_purchase_cost"
            placeholder="0.00"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs font-mono font-bold"
          />
        </div>

        <div>
          <label for="itemExpectedValue" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Erwarteter Marktwert (€)
          </label>
          <input
            id="itemExpectedValue"
            type="number"
            formControlName="expected_value"
            placeholder="0.00"
            class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs font-mono font-bold text-emerald-400"
          />
        </div>
      </div>

      <div>
        <label for="itemPurchaseSelect" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
          Zugehöriger Einkauf (optional)
        </label>
        <select
          id="itemPurchaseSelect"
          formControlName="purchase_id"
          class="linear-input w-full px-2.5 py-1.5 rounded-lg text-xs cursor-pointer text-slate-200"
        >
          <option value="">-- Kein Einkauf zugeordnet --</option>
          @for (p of purchaseService.purchases(); track p.id) {
            <option [value]="p.id">
              {{ p.title }} ({{ p.purchase_date | date:'dd.MM.yy' }})
            </option>
          }
        </select>
      </div>

      <div class="flex items-center justify-end gap-2 pt-4 border-t border-[#373e4d]">
        <button
          type="button"
          (click)="close.emit()"
          class="linear-btn-secondary px-4 py-1.5 rounded-lg text-xs font-semibold cursor-pointer"
        >
          Abbrechen
        </button>
        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
          class="linear-btn-primary px-4 py-1.5 rounded-lg font-semibold text-xs transition disabled:opacity-40 cursor-pointer"
        >
          <span>{{ isSubmitting() ? 'Speichere...' : 'Artikel anlegen' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
