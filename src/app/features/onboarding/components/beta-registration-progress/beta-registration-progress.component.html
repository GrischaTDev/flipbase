<nav [attr.aria-label]="'BETA_ONBOARDING.PROGRESS_LABEL' | translate">
  <ol class="relative grid grid-cols-3 gap-2">
    <li
      aria-hidden="true"
      class="pointer-events-none absolute inset-x-[16.667%] top-4 flex h-0.5 -translate-y-1/2"
    >
      <span class="h-full w-1/2 bg-fb-border">
        @if (step() >= 2) {
          <span
            class="block h-full w-full origin-left bg-fb-primary motion-safe:animate-[beta-progress-fill_450ms_ease-out_both]"
          ></span>
        }
      </span>
      <span class="h-full w-1/2 bg-fb-border">
        @if (step() >= 3) {
          <span
            class="block h-full w-full origin-left bg-fb-primary motion-safe:animate-[beta-progress-fill_450ms_ease-out_both] motion-safe:[animation-delay:100ms]"
          ></span>
        }
      </span>
    </li>
    @for (item of steps; track item.number) {
      <li class="relative flex min-w-0 flex-col items-center gap-2 text-center">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-full border text-sm font-semibold"
          [class.border-fb-primary]="step() >= item.number"
          [class.bg-fb-primary]="step() >= item.number"
          [class.text-fb-on-accent]="step() >= item.number"
          [class.border-fb-border]="step() < item.number"
          [class.text-fb-text-muted]="step() < item.number"
          [attr.aria-current]="step() === item.number ? 'step' : null"
          >{{ item.number }}</span
        >
        <span
          class="text-xs leading-snug"
          [class.font-semibold]="step() === item.number"
          [class.text-fb-text-primary]="step() === item.number"
          [class.text-fb-text-muted]="step() !== item.number"
          >{{ item.label | translate }}</span
        >
      </li>
    }
  </ol>
</nav>
