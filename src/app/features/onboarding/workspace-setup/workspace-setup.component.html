<main class="relative flex min-h-screen items-center justify-center bg-fb-well px-4 py-10 sm:px-6">
  <div
    class="w-full max-w-md rounded-2xl border border-fb-border bg-fb-surface-alt p-6 shadow-sm sm:p-8"
  >
    <div class="mb-7 text-center">
      <div class="mb-5 flex items-center justify-center gap-2.5">
        <img
          ngSrc="images/logo-mark.png"
          width="36"
          height="36"
          alt="Flipbase"
          class="fb-logo-mark h-9 w-9 shrink-0"
          priority
        />
        <span class="text-xl font-bold tracking-tight text-fb-text-primary">Flipbase</span>
      </div>

      <app-beta-registration-progress [step]="2" class="mb-6 block" />

      <h1 class="text-2xl font-semibold tracking-tight text-fb-text-primary">
        {{ 'WORKSPACE.SETUP_WELCOME' | translate }}
      </h1>
    </div>

    @if (errorMessage()) {
      <div
        role="alert"
        class="mb-5 rounded-xl border border-fb-critical-border bg-fb-critical-surface px-4 py-3 text-sm text-fb-critical"
      >
        <p>{{ errorMessage() }}</p>
        @if (canRetryLoad()) {
          <app-button
            type="button"
            variant="plain"
            size="slim"
            [disabled]="isLoading()"
            (clicked)="retryLoad()"
            class="mt-2 inline-block"
          >
            {{ 'WORKSPACE.SETUP_RETRY' | translate }}
          </app-button>
        }
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div>
        <app-text-field
          id="workspace-name"
          type="text"
          formControlName="workspaceName"
          autocomplete="organization"
          [maxLength]="100"
          [label]="'WORKSPACE.SETUP_QUESTION' | translate"
          [helpText]="'WORKSPACE.SETUP_HELP' | translate"
          [placeholder]="'WORKSPACE.SETUP_NAME_PLACEHOLDER' | translate"
          [error]="
            form.controls.workspaceName.invalid && form.controls.workspaceName.touched
              ? ('WORKSPACE.SETUP_NAME_ERROR' | translate)
              : null
          "
        />
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [loading]="isSaving()"
        [disabled]="submitDisabled()"
        class="mt-6 block w-full"
      >
        {{ 'WORKSPACE.SETUP_SUBMIT' | translate }}
      </app-button>
    </form>

    <div class="mt-5 flex justify-center border-t border-fb-border pt-5">
      <app-button type="button" variant="plain" size="slim" (clicked)="signOut()">
        {{ 'AUTH.LOGOUT' | translate }}
      </app-button>
    </div>
  </div>
</main>
