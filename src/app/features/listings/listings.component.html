<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
      {{ 'NAV.LISTINGS' | translate }}
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Erstelle kopierfertige, plattformspezifische Anzeigentexte für eBay, Kleinanzeigen und Vinted.
    </p>
  </div>

  <div class="p-12 text-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl">
    <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 mx-auto flex items-center justify-center mb-3">
      <lucide-icon [img]="tagIcon" class="w-6 h-6"></lucide-icon>
    </div>
    <h3 class="text-base font-bold text-slate-800 dark:text-slate-200">Listing Studio bereit</h3>
    <p class="text-xs text-slate-500 max-w-md mx-auto mt-1 mb-5">
      Wähle einen recherchierten Artikel im Inventar aus, um passende Texte für die Marktplätze zu generieren.
    </p>
  </div>
</div>
