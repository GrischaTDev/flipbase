<div class="relative flex items-center">
  <input
    type="number"
    [id]="effectiveId()"
    [value]="value()"
    [step]="effectiveStep()"
    [min]="effectiveMin()"
    [max]="effectiveMax()"
    [placeholder]="effectivePlaceholder()"
    [attr.aria-label]="effectiveAriaLabel() || null"
    [attr.aria-describedby]="ariaDescribedby() || null"
    [attr.aria-invalid]="ariaInvalid() ? 'true' : null"
    [disabled]="effectiveDisabled()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    class="linear-input min-h-8 w-full rounded-md px-2.5 py-1 text-[13px] transition-colors"
    [class.pr-20]="showStepper()"
    [class.pr-8]="!showStepper() && !!effectiveUnit()"
    [class.font-mono]="effectiveAsCurrency()"
    [class.font-bold]="effectiveAsCurrency()"
  />

  @if (effectiveUnit()) {
    <span
      class="pointer-events-none absolute text-[13px] text-fb-text-dimmed"
      [class.right-20]="showStepper()"
      [class.right-3]="!showStepper()"
    >
      {{ effectiveUnit() }}
    </span>
  }

  @if (showStepper()) {
    <div
      data-number-stepper
      class="absolute inset-y-px right-px flex w-14 overflow-hidden rounded-r-md border-l border-fb-line"
    >
      <button
        type="button"
        tabindex="-1"
        [disabled]="effectiveDisabled() || isAtMin()"
        (click)="decrement()"
        class="flex h-full w-7 cursor-pointer items-center justify-center bg-transparent text-fb-text-muted transition-colors hover:bg-fb-primary/10 hover:text-fb-primary disabled:cursor-not-allowed disabled:opacity-35 disabled:hover:bg-transparent disabled:hover:text-fb-text-muted"
        aria-label="Wert verringern"
      >
        <svg [lucideIcon]="minusIcon" class="size-3" aria-hidden="true"></svg>
      </button>

      <button
        type="button"
        tabindex="-1"
        [disabled]="effectiveDisabled() || isAtMax()"
        (click)="increment()"
        class="flex h-full w-7 cursor-pointer items-center justify-center border-l border-fb-line bg-transparent text-fb-text-muted transition-colors hover:bg-fb-primary/10 hover:text-fb-primary disabled:cursor-not-allowed disabled:opacity-35 disabled:hover:bg-transparent disabled:hover:text-fb-text-muted"
        aria-label="Wert erhöhen"
      >
        <svg [lucideIcon]="plusIcon" class="size-3" aria-hidden="true"></svg>
      </button>
    </div>
  }
</div>
