<div
  class="fixed inset-0 fb-dialog-overlay flex items-center justify-center p-4 z-50 animate-fade-in"
  appModalDialog
  dialogTitel="Neuen Workspace erstellen"
  (dialogClose)="closed.emit()"
>
  <div
    class="linear-surface fb-dialog-surface rounded-2xl shadow-2xl max-w-md w-full p-6 border border-fb-line animate-modal-card"
  >
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-fb-line">
      <h3 class="text-sm font-bold text-fb-text-primary">Neuen Workspace erstellen</h3>
      <button
        type="button"
        (click)="closed.emit()"
        class="p-1 rounded-md text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-line transition cursor-pointer"
      >
        <svg [lucideIcon]="closeIcon" class="w-4 h-4"></svg>
      </button>
    </div>

    <p class="text-xs text-fb-text-muted mb-4">
      Ein Workspace trennt sämtliche Einkäufe, Inventardaten und Verkäufe sauber voneinander.
    </p>

    @if (errorMessage()) {
      <div
        class="p-3 mb-4 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs"
      >
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <app-text-field
          id="workspaceName"
          label="Workspace-Name"
          formControlName="name"
          placeholder="z.B. Mein Reselling-Business"
        />
      </div>

      <div class="flex justify-end gap-2.5 pt-3 border-t border-fb-line">
        <app-button type="button" (clicked)="closed.emit()" variant="secondary">
          Abbrechen
        </app-button>
        <app-button
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
          variant="primary"
          [icon]="plusIcon"
        >
          <span>{{ isSubmitting() ? 'Erstelle...' : 'Erstellen' }}</span>
        </app-button>
      </div>
    </form>
  </div>
</div>
