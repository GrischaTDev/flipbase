<button
  type="button"
  role="checkbox"
  [disabled]="effectiveDisabled()"
  [attr.aria-checked]="indeterminate() ? 'mixed' : checked()"
  [attr.aria-disabled]="effectiveDisabled()"
  [attr.aria-label]="ariaLabel() || label() || 'Checkbox'"
  [id]="id() || null"
  class="relative inline-flex items-center gap-2 select-none group rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fb-primary"
  (click)="toggle($event)"
  (blur)="onBlur()"
>
  <!-- Rounded Square Checkbox Box -->
  <div
    aria-hidden="true"
    class="relative flex items-center justify-center rounded border transition-all duration-150 outline-none shrink-0"
    [class.w-3.5]="size() === 'sm'"
    [class.h-3.5]="size() === 'sm'"
    [class.w-4]="size() === 'md'"
    [class.h-4]="size() === 'md'"
    [class.w-5]="size() === 'lg'"
    [class.h-5]="size() === 'lg'"
    [class.bg-[#fcc601]]="(checked() || indeterminate()) && color() === 'brand'"
    [class.border-[#fcc601]]="(checked() || indeterminate()) && color() === 'brand'"
    [class.bg-emerald-700]="(checked() || indeterminate()) && color() === 'emerald'"
    [class.dark:bg-emerald-600]="(checked() || indeterminate()) && color() === 'emerald'"
    [class.border-emerald-700]="(checked() || indeterminate()) && color() === 'emerald'"
    [class.dark:border-emerald-600]="(checked() || indeterminate()) && color() === 'emerald'"
    [class.shadow-emerald-500/25]="(checked() || indeterminate()) && color() === 'emerald'"
    [class.bg-indigo-600]="(checked() || indeterminate()) && color() === 'indigo'"
    [class.border-indigo-500]="(checked() || indeterminate()) && color() === 'indigo'"
    [class.shadow-indigo-500/30]="(checked() || indeterminate()) && color() === 'indigo'"
    [class.shadow-sm]="checked() || indeterminate()"
    [class.bg-fb-well]="!checked() && !indeterminate()"
    [class.border-fb-border-hover]="!checked() && !indeterminate()"
    [class.group-hover:border-[#fcc601]]="
      !checked() && !indeterminate() && !effectiveDisabled() && color() === 'brand'
    "
    [class.group-hover:border-emerald-500]="
      !checked() && !indeterminate() && !effectiveDisabled() && color() === 'emerald'
    "
    [class.group-hover:border-indigo-400]="
      !checked() && !indeterminate() && !effectiveDisabled() && color() === 'indigo'
    "
    [class.group-hover:bg-fb-subtle]="!checked() && !indeterminate() && !effectiveDisabled()"
  >
    @if (checked() && !indeterminate()) {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-2.5 h-2.5 animate-scale-in"
        [class.text-slate-950]="color() === 'brand'"
        [class.text-fb-on-accent]="color() !== 'brand'"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    } @else if (indeterminate()) {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-2.5 h-2.5"
        [class.text-slate-950]="color() === 'brand'"
        [class.text-fb-on-accent]="color() !== 'brand'"
      >
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    }
  </div>

  <!-- Optional Label -->
  @if (label()) {
    <span
      class="text-xs font-medium text-fb-text-secondary group-hover:text-fb-text-primary transition-colors select-none"
    >
      {{ label() }}
    </span>
  } @else {
    <ng-content></ng-content>
  }
</button>
