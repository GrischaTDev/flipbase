@if (title() || subtitle()) {
  <div
    data-card-header
    class="flex items-center justify-between border-b border-fb-line px-4 py-3 md:px-5 md:py-3.5"
    [class.shrink-0]="contentLayout() === 'fill'"
  >
    <div class="min-w-0">
      @if (title()) {
        <h2 class="text-sm font-bold text-fb-text-primary truncate">{{ title() }}</h2>
      }
      @if (subtitle()) {
        <p class="text-xs text-fb-text-muted truncate mt-0.5">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <ng-content select="[card-header-actions]" />
    </div>
  </div>
} @else {
  <div
    class="empty:hidden border-b border-fb-line px-4 py-3 md:px-5 md:py-3.5"
    [class.shrink-0]="contentLayout() === 'fill'"
  >
    <ng-content select="[card-header]" />
  </div>
}

<div
  class="flex-1"
  [class]="contentPaddingClass()"
  [class.flex]="contentLayout() === 'fill'"
  [class.flex-col]="contentLayout() === 'fill'"
  [class.min-h-0]="contentLayout() === 'fill'"
  [class.overflow-hidden]="contentLayout() === 'fill'"
>
  <ng-content />
</div>

<div
  class="empty:hidden border-t border-fb-line bg-fb-subtle/50 px-4 py-3 md:px-5"
  [class.shrink-0]="contentLayout() === 'fill'"
>
  <ng-content select="[card-footer]" />
</div>
@if (link(); as target) {
  <a
    [routerLink]="target"
    [queryParams]="queryParams()"
    [attr.aria-label]="linkLabel()"
    class="absolute inset-0 rounded-[inherit] hover:bg-fb-surface-hover/10 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-fb-text-primary"
  ></a>
}
