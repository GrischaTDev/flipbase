@if (href(); as url) {
  <a
    [attr.href]="effectiveDisabled() ? null : url"
    [attr.target]="target()"
    [attr.rel]="target() === '_blank' ? 'noopener noreferrer' : null"
    [class]="buttonClasses()"
    [class.opacity-40]="effectiveDisabled()"
    [attr.aria-disabled]="effectiveDisabled() ? 'true' : null"
    [attr.tabindex]="effectiveDisabled() ? -1 : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.title]="title() || null"
    [attr.aria-busy]="loading() ? 'true' : null"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (link(); as target) {
  <a
    [routerLink]="effectiveDisabled() ? null : target"
    [queryParams]="queryParams()"
    [class]="buttonClasses()"
    [class.opacity-40]="effectiveDisabled()"
    [attr.aria-disabled]="effectiveDisabled() ? 'true' : null"
    [attr.tabindex]="effectiveDisabled() ? -1 : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.title]="title() || null"
    [attr.aria-busy]="loading() ? 'true' : null"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    [type]="type()"
    [disabled]="effectiveDisabled()"
    [class]="buttonClasses()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.title]="title() || null"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-pressed]="ariaPressed()"
    [attr.aria-controls]="ariaControls() || null"
    [attr.aria-haspopup]="ariaHaspopup()"
    (click)="handleClick($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  @if (loading()) {
    <svg
      [lucideIcon]="spinnerIcon"
      [class]="iconClasses()"
      class="animate-spin"
      aria-hidden="true"
    ></svg>
  } @else if (icon(); as buttonIcon) {
    @if (iconPosition() === 'start') {
      <svg [lucideIcon]="buttonIcon" [class]="iconClasses()" aria-hidden="true"></svg>
    }
  }

  @if (!iconOnly()) {
    <span class="truncate">
      <ng-content />
    </span>
  }

  @if (!loading() && iconPosition() === 'end') {
    @if (icon(); as buttonIcon) {
      <svg [lucideIcon]="buttonIcon" [class]="iconClasses()" aria-hidden="true"></svg>
    }
  }
</ng-template>
