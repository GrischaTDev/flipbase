<!-- Trigger Button -->
<button
  #triggerBtn
  type="button"
  (click)="toggleOpen()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="panelId"
  aria-haspopup="dialog"
  aria-label="Spalten und Sortierung anpassen"
  title="Spalten und Sortierung anpassen"
  class="inline-flex min-h-9 min-w-9 items-center justify-center rounded-md border border-fb-border bg-fb-surface px-2 text-fb-text-secondary shadow-xs transition-colors duration-150 hover:border-fb-border-hover hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fb-primary cursor-pointer"
>
  <svg [lucideIcon]="icons.columns" class="h-4 w-4" aria-hidden="true"></svg>
</button>

<!-- Popover Dialog -->
@if (isOpen()) {
  <div
    #panel
    [id]="panelId"
    role="dialog"
    [attr.aria-labelledby]="headingId"
    class="fb-popover-enter absolute right-0 top-full z-50 mt-2 w-80 max-w-[calc(100vw-2rem)] overflow-hidden rounded-lg border border-fb-border bg-fb-surface p-1.5 text-fb-text-primary shadow-lg"
  >
    <div class="flex items-center justify-between gap-3 border-b border-fb-line px-2.5 py-2">
      <h2 [id]="headingId" class="text-[13px] font-semibold text-fb-text-primary">
        Tabelleneinstellungen
      </h2>
      <span class="text-xs tabular-nums text-fb-text-muted">
        {{ visibleCount() }}/{{ columns().length }} sichtbar
      </span>
    </div>

    <!-- Section 1: Sortierung -->
    <div class="space-y-2 px-2.5 py-2.5">
      <div class="flex items-center gap-1.5 text-xs font-semibold text-fb-text-secondary">
        <svg [lucideIcon]="icons.sort" class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>Sortieren nach</span>
      </div>

      <div class="flex items-center gap-2">
        <select
          [value]="currentSort().field"
          (change)="onSortFieldChange($event)"
          aria-label="Sortierfeld"
          data-popover-focus
          class="linear-input min-h-9 flex-1 rounded-md border-fb-border bg-fb-surface px-2.5 py-1.5 text-[13px] text-fb-text-primary transition-colors cursor-pointer"
        >
          @for (option of sortOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>

        <button
          type="button"
          (click)="toggleSortDirection()"
          [attr.aria-label]="
            currentSort().direction === 'asc' ? 'Richtung: Aufsteigend' : 'Richtung: Absteigend'
          "
          [title]="
            currentSort().direction === 'asc'
              ? 'Aufsteigend (Klick für Absteigend)'
              : 'Absteigend (Klick für Aufsteigend)'
          "
          class="inline-flex min-h-9 min-w-9 items-center justify-center rounded-md border border-fb-border bg-fb-surface text-fb-text-secondary transition-colors hover:border-fb-border-hover hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-fb-primary cursor-pointer"
        >
          <svg
            [lucideIcon]="currentSort().direction === 'asc' ? icons.asc : icons.desc"
            class="w-3.5 h-3.5"
            aria-hidden="true"
          ></svg>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div class="border-t border-fb-line"></div>

    <!-- Section 2: Spalten Header -->
    <div class="flex items-center justify-between px-2.5 pb-1 pt-2.5">
      <span class="text-xs font-semibold text-fb-text-secondary"> Sichtbare Spalten </span>
      <button
        type="button"
        (click)="resetRequested.emit(); close()"
        class="rounded px-1.5 py-1 text-xs font-medium text-fb-primary transition-colors hover:bg-fb-primary-subtle focus-visible:outline-2 focus-visible:outline-fb-primary cursor-pointer"
      >
        Standard
      </button>
    </div>

    <!-- Section 3: Spalten-Liste -->
    <ul class="max-h-72 overflow-y-auto px-1.5 pb-1 pr-0.5 list-none m-0" role="list">
      @for (col of sortedColumns(); track col.id; let i = $index) {
        <li
          draggable="true"
          (dragstart)="onDragStart(i)"
          (dragover)="onDragOver($event)"
          (drop)="onDrop(i)"
          (dragend)="onDragEnd()"
          class="group flex min-h-9 items-center justify-between rounded-md px-2 py-1 transition-colors duration-150 hover:bg-fb-surface-hover select-none"
          [class.opacity-50]="!col.visible"
          [class.bg-fb-surface-hover]="draggedIndex() === i"
        >
          <!-- Drag handle & Name -->
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span
              class="cursor-grab text-fb-text-dimmed transition-colors group-hover:text-fb-text-muted active:cursor-grabbing"
              title="Ziehen zum Neuanordnen"
              aria-hidden="true"
            >
              <svg [lucideIcon]="icons.drag" class="w-3.5 h-3.5"></svg>
            </span>
            <span class="text-[13px] font-medium text-fb-text-primary truncate">
              {{ col.label }}
            </span>
          </div>

          <!-- Actions / Status -->
          <div class="flex items-center gap-1 shrink-0 ml-2">
            <!-- Keyboard reorder shortcuts for a11y -->
            <button
              type="button"
              (click)="moveColumnKeyboard(i, 'up', $event)"
              [disabled]="i === 0"
              class="sr-only rounded border border-fb-border bg-fb-surface px-1 text-xs text-fb-text-primary focus:not-sr-only"
              [attr.aria-label]="'Spalte ' + col.label + ' nach oben verschieben'"
            >
              Nach oben
            </button>
            <button
              type="button"
              (click)="moveColumnKeyboard(i, 'down', $event)"
              [disabled]="i === sortedColumns().length - 1"
              class="sr-only rounded border border-fb-border bg-fb-surface px-1 text-xs text-fb-text-primary focus:not-sr-only"
              [attr.aria-label]="'Spalte ' + col.label + ' nach unten verschieben'"
            >
              Nach unten
            </button>

            @if (col.locked) {
              <span
                class="p-1 text-fb-text-muted/40 cursor-not-allowed"
                title="Erforderliche Spalte"
                aria-label="Erforderliche Spalte"
              >
                <svg [lucideIcon]="icons.lock" class="w-3.5 h-3.5" aria-hidden="true"></svg>
              </span>
            } @else {
              <button
                type="button"
                (click)="columnVisibilityToggled.emit(col.id)"
                [attr.aria-label]="
                  col.visible
                    ? 'Spalte ' + col.label + ' ausblenden'
                    : 'Spalte ' + col.label + ' einblenden'
                "
                [title]="col.visible ? 'Ausblenden' : 'Einblenden'"
                class="rounded p-1 text-fb-text-muted transition-colors hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-fb-primary cursor-pointer"
              >
                <svg
                  [lucideIcon]="col.visible ? icons.eye : icons.eyeOff"
                  class="h-3.5 w-3.5"
                  aria-hidden="true"
                ></svg>
              </button>
            }
          </div>
        </li>
      }
    </ul>
  </div>
}
