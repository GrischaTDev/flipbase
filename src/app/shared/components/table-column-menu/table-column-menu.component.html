<!-- Trigger Button -->
<button
  #triggerBtn
  type="button"
  (click)="toggleOpen()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="dialog"
  aria-label="Spalten und Sortierung anpassen"
  title="Spalten und Sortierung anpassen"
  class="inline-flex items-center justify-center p-2 rounded-lg border border-[var(--fb-border)] bg-[var(--fb-bg-card)] text-fb-text hover:bg-[var(--fb-bg-surface-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fb-primary transition shadow-xs cursor-pointer"
>
  <svg [lucideIcon]="icons.columns" class="w-4 h-4" aria-hidden="true"></svg>
</button>

<!-- Popover Dialog -->
@if (isOpen()) {
  <div
    role="dialog"
    aria-label="Tabelleneinstellungen"
    class="absolute right-0 top-full mt-1.5 z-50 w-72 sm:w-80 rounded-xl border border-[var(--fb-border)] bg-[var(--fb-bg-surface)] p-3 shadow-xl animate-in fade-in zoom-in-95 duration-100"
  >
    <!-- Section 1: Sortierung -->
    <div class="space-y-2">
      <div
        class="flex items-center gap-1.5 text-xs font-semibold text-fb-text-muted uppercase tracking-wider"
      >
        <svg [lucideIcon]="icons.sort" class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>Sortieren nach</span>
      </div>

      <div class="flex items-center gap-2">
        <select
          [value]="currentSort().field"
          (change)="onSortFieldChange($event)"
          aria-label="Sortierfeld"
          class="flex-1 px-2.5 py-1.5 rounded-lg border border-[var(--fb-border)] bg-[var(--fb-bg-card)] text-xs text-fb-text focus:outline-none focus:border-fb-primary focus:ring-1 focus:ring-fb-primary transition cursor-pointer"
        >
          @for (option of sortOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>

        <button
          type="button"
          (click)="toggleSortDirection()"
          [attr.aria-label]="
            currentSort().direction === 'asc' ? 'Richtung: Aufsteigend' : 'Richtung: Absteigend'
          "
          [title]="
            currentSort().direction === 'asc'
              ? 'Aufsteigend (Klick für Absteigend)'
              : 'Absteigend (Klick für Aufsteigend)'
          "
          class="p-1.5 rounded-lg border border-[var(--fb-border)] bg-[var(--fb-bg-card)] text-fb-text hover:bg-[var(--fb-bg-surface-hover)] focus-visible:outline-2 focus-visible:outline-fb-primary transition cursor-pointer"
        >
          <svg
            [lucideIcon]="currentSort().direction === 'asc' ? icons.asc : icons.desc"
            class="w-3.5 h-3.5"
            aria-hidden="true"
          ></svg>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <hr class="border-[var(--fb-border)] my-3" />

    <!-- Section 2: Spalten Header -->
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs font-semibold text-fb-text-muted uppercase tracking-wider">
        Spalten ({{ visibleCount() }}/{{ columns().length }})
      </span>
      <button
        type="button"
        (click)="resetRequested.emit()"
        class="text-xs text-fb-primary hover:underline font-medium cursor-pointer"
      >
        Standard
      </button>
    </div>

    <!-- Section 3: Spalten-Liste -->
    <ul class="max-h-60 overflow-y-auto space-y-1 pr-0.5 list-none m-0 p-0" role="list">
      @for (col of sortedColumns(); track col.id; let i = $index) {
        <li
          draggable="true"
          (dragstart)="onDragStart(i)"
          (dragover)="onDragOver($event)"
          (drop)="onDrop(i)"
          class="flex items-center justify-between px-2 py-1.5 rounded-lg transition hover:bg-[var(--fb-bg-surface-hover)] group select-none"
          [class.opacity-50]="!col.visible"
          [class.bg-[var(--fb-bg-surface-hover)]]="draggedIndex() === i"
        >
          <!-- Drag handle & Name -->
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span
              class="cursor-grab active:cursor-grabbing text-fb-text-muted/60 group-hover:text-fb-text transition"
              title="Ziehen zum Neuanordnen"
              aria-hidden="true"
            >
              <svg [lucideIcon]="icons.drag" class="w-3.5 h-3.5"></svg>
            </span>
            <span class="text-xs font-medium text-fb-text truncate">
              {{ col.label }}
            </span>
          </div>

          <!-- Actions / Status -->
          <div class="flex items-center gap-1 shrink-0 ml-2">
            <!-- Keyboard reorder shortcuts for a11y -->
            <button
              type="button"
              (click)="moveColumnKeyboard(i, 'up', $event)"
              [disabled]="i === 0"
              class="sr-only focus:not-sr-only px-1 text-[10px] bg-[var(--fb-bg-card)] border border-[var(--fb-border)] rounded text-fb-text"
              [attr.aria-label]="'Spalte ' + col.label + ' nach oben verschieben'"
            >
              Nach oben
            </button>
            <button
              type="button"
              (click)="moveColumnKeyboard(i, 'down', $event)"
              [disabled]="i === sortedColumns().length - 1"
              class="sr-only focus:not-sr-only px-1 text-[10px] bg-[var(--fb-bg-card)] border border-[var(--fb-border)] rounded text-fb-text"
              [attr.aria-label]="'Spalte ' + col.label + ' nach unten verschieben'"
            >
              Nach unten
            </button>

            @if (col.locked) {
              <span
                class="p-1 text-fb-text-muted/40 cursor-not-allowed"
                title="Erforderliche Spalte"
                aria-label="Erforderliche Spalte"
              >
                <svg [lucideIcon]="icons.lock" class="w-3.5 h-3.5" aria-hidden="true"></svg>
              </span>
            } @else {
              <button
                type="button"
                (click)="columnVisibilityToggled.emit(col.id)"
                [attr.aria-label]="
                  col.visible
                    ? 'Spalte ' + col.label + ' ausblenden'
                    : 'Spalte ' + col.label + ' einblenden'
                "
                [title]="col.visible ? 'Ausblenden' : 'Einblenden'"
                class="p-1 rounded text-fb-text-muted hover:text-fb-text transition cursor-pointer"
              >
                <svg
                  [lucideIcon]="col.visible ? icons.eye : icons.eyeOff"
                  class="w-3.5 h-3.5"
                  aria-hidden="true"
                ></svg>
              </button>
            }
          </div>
        </li>
      }
    </ul>
  </div>
}
