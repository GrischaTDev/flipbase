<div
  [class]="
    presentation() === 'list' ? 'divide-y divide-fb-line' : 'flex flex-wrap justify-center gap-3'
  "
>
  @for (platform of platforms(); track platform) {
    <button
      type="button"
      class="relative flex min-w-0 items-center text-sm font-medium text-fb-text-primary transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fb-text-primary disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none"
      [class]="
        presentation() === 'list'
          ? 'w-full justify-start gap-4 p-4 text-left hover:bg-fb-surface-hover'
          : 'min-h-24 min-w-28 flex-1 basis-28 flex-col justify-center gap-3 rounded-xl border border-fb-border bg-fb-surface p-4 hover:bg-[color-mix(in_srgb,var(--platform-color)_10%,var(--fb-bg-surface))]'
      "
      [attr.aria-label]="label(platform)"
      [style.--platform-color]="appearance(platform).color"
      [style.background-color]="
        presentation() === 'tiles' && selectedPlatforms().includes(platform)
          ? 'color-mix(in srgb, var(--platform-color) 20%, var(--fb-bg-surface))'
          : null
      "
      [style.border-color]="
        presentation() === 'tiles' && selectedPlatforms().includes(platform)
          ? appearance(platform).color
          : null
      "
      [disabled]="disabled() || disabledPlatforms().includes(platform)"
      [attr.aria-pressed]="
        selectionMode() === 'toggle' ? selectedPlatforms().includes(platform) : null
      "
      (click)="select(platform)"
    >
      <img [ngSrc]="appearance(platform).logo!" width="32" height="32" alt="" />
      <span>{{ label(platform) }}</span>
      @if (presentation() === 'list' && selectionMode() === 'navigate') {
        <svg
          [lucideIcon]="nextIcon"
          class="ml-auto size-4 shrink-0 text-fb-text-secondary"
          aria-hidden="true"
        ></svg>
      } @else if (presentation() === 'list') {
        <span
          class="ml-auto flex shrink-0 items-center gap-2 text-xs text-fb-text-secondary"
          aria-hidden="true"
        >
          <span>{{ selectedPlatforms().includes(platform) ? 'Sichtbar' : 'Ausgeblendet' }}</span>
          @if (selectedPlatforms().includes(platform)) {
            <svg [lucideIcon]="checkIcon" class="size-4" aria-hidden="true"></svg>
          } @else {
            <span class="size-4"></span>
          }
        </span>
      } @else if (selectedPlatforms().includes(platform)) {
        <svg
          [lucideIcon]="checkIcon"
          class="absolute right-2 top-2 size-4"
          aria-hidden="true"
        ></svg>
      }
    </button>
  }
</div>
