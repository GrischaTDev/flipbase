<div class="space-y-1.5 w-full">
  @if (label()) {
    <label
      [for]="fieldId()"
      class="block text-[13px] font-semibold text-fb-text-primary"
      [class.sr-only]="labelHidden()"
    >
      {{ label() }}
    </label>
  }

  <div class="relative flex items-center">
    @if (prefixIcon(); as pIcon) {
      <div class="absolute left-3 flex items-center pointer-events-none text-fb-text-muted">
        <svg [lucideIcon]="pIcon" class="w-4 h-4" aria-hidden="true"></svg>
      </div>
    } @else if (prefix()) {
      <span class="absolute left-3 text-[13px] text-fb-text-muted font-medium pointer-events-none">
        {{ prefix() }}
      </span>
    }

    @if (isTextarea()) {
      <textarea
        [id]="fieldId()"
        [rows]="textareaRows()"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="effectiveDisabled()"
        [required]="required()"
        [class]="inputClasses()"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="
          error() ? fieldId() + '-error' : helpText() ? fieldId() + '-help' : null
        "
        (input)="handleInput($event)"
        (blur)="handleBlur()"
      ></textarea>
    } @else {
      <input
        [id]="fieldId()"
        [type]="type()"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="effectiveDisabled()"
        [autocomplete]="autocomplete()"
        [required]="required()"
        [class]="inputClasses()"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="
          error() ? fieldId() + '-error' : helpText() ? fieldId() + '-help' : null
        "
        (input)="handleInput($event)"
        (blur)="handleBlur()"
      />
    }

    @if (clearable() && value() && !effectiveDisabled()) {
      <button
        type="button"
        (click)="handleClear()"
        class="absolute right-2.5 p-1 rounded-md text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-surface-hover transition-colors cursor-pointer"
        aria-label="Eingabe leeren"
      >
        <svg [lucideIcon]="clearIcon" class="w-3.5 h-3.5" aria-hidden="true"></svg>
      </button>
    } @else if (suffix()) {
      <span class="absolute right-3 text-[13px] text-fb-text-muted font-medium pointer-events-none">
        {{ suffix() }}
      </span>
    }
  </div>

  @if (error()) {
    <p [id]="fieldId() + '-error'" class="flex items-center gap-1.5 text-xs text-rose-400">
      <svg [lucideIcon]="errorIcon" class="w-3.5 h-3.5 shrink-0" aria-hidden="true"></svg>
      <span>{{ error() }}</span>
    </p>
  } @else if (helpText()) {
    <p [id]="fieldId() + '-help'" class="text-xs text-fb-text-muted leading-relaxed">
      {{ helpText() }}
    </p>
  }
</div>
