<button
  #trigger
  type="button"
  class="linear-btn-secondary inline-flex min-h-9 items-center gap-1.5 cursor-pointer rounded-md px-2.5 text-[13px] font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-fb-primary"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="panelId"
  aria-haspopup="dialog"
  aria-label="Spalten"
  title="Sichtbare Spalten anpassen"
  (click)="toggleOpen()"
>
  <svg [lucideIcon]="columnsIcon" class="h-4 w-4" aria-hidden="true"></svg>
  Spalten
</button>
@if (isOpen()) {
  <fieldset
    #panel
    [id]="panelId"
    [attr.aria-labelledby]="headingId"
    [style.top.px]="panelPosition().top"
    [style.left.px]="panelPosition().left"
    class="fb-popover-enter fixed z-[70] max-h-[calc(100vh-1rem)] w-72 max-w-[calc(100vw-1rem)] overflow-y-auto rounded-xl border border-fb-border bg-fb-surface p-1.5 text-fb-text-primary shadow-xl"
    [class.origin-top-right]="panelPlacement() === 'below'"
    [class.origin-bottom-right]="panelPlacement() === 'above'"
  >
    <legend [id]="headingId" class="px-2.5 pb-1 pt-1.5 text-[13px] font-semibold">
      Sichtbare Spalten
    </legend>
    @for (column of definitions(); track column.id) {
      <label
        class="flex min-h-9 cursor-pointer items-center gap-2 rounded-md px-2.5 py-1 text-[13px] transition-colors hover:bg-fb-surface-hover"
      >
        <input
          type="checkbox"
          class="h-4 w-4 accent-fb-primary focus-visible:outline-2 focus-visible:outline-fb-primary"
          [checked]="column.required || selected().includes(column.id)"
          [disabled]="column.required"
          (change)="toggleColumn(column)"
        />
        {{ column.label }}
        @if (column.required) {
          <span class="text-fb-text-secondary">(fest)</span>
        }
      </label>
    }
    <button
      type="button"
      class="linear-btn-secondary mt-1.5 w-full rounded-md px-2 py-2 text-[13px]"
      (click)="showAll()"
    >
      Alle Spalten
    </button>
  </fieldset>
}
@if (saveError(); as error) {
  <p role="alert" class="mt-1 max-w-xs text-xs text-fb-text-secondary">{{ error }}</p>
}
