<div
  [class]="overlayClasses()"
  appModalDialog
  [dialogTitel]="title()"
  [schliesstBeiKlickAussen]="closeOnBackdrop()"
  (dialogClose)="closed.emit()"
>
  <div [class]="cardClasses()" data-modal-surface>
    <header role="presentation" class="flex shrink-0 items-start justify-between gap-4 px-5 pt-5 sm:px-6">
      <div class="flex min-w-0 items-center gap-3">
        @if (icon(); as ic) {
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border"
            [class]="iconToneClasses()"
          >
            <svg [lucideIcon]="ic" class="h-4 w-4" aria-hidden="true"></svg>
          </div>
        }
        <div class="min-w-0 py-1">
          <h2 class="text-[17px] leading-[22px] font-semibold text-fb-text-primary break-words">
            {{ title() }}
          </h2>
          @if (subtitle()) {
            <p class="mt-1 text-[13px] leading-[18px] text-fb-text-secondary">{{ subtitle() }}</p>
          }
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <ng-content select="[header-actions]" />
        <button
          type="button"
          (click)="closed.emit()"
          class="fb-modal-close flex min-h-7 min-w-7 cursor-pointer items-center justify-center rounded-md text-fb-text-muted transition-colors hover:bg-fb-surface-hover hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--fb-control-focus)]"
          aria-label="Dialog schließen"
        >
          <svg [lucideIcon]="closeIcon" class="h-4 w-4" aria-hidden="true"></svg>
        </button>
      </div>
    </header>
    <div
      data-modal-content
      class="min-h-0 flex-1 space-y-5 overflow-y-auto overscroll-contain px-5 pt-4 pb-5 sm:px-6"
    >
      <ng-content />
    </div>
    @if (hasFooter()) {
      <footer
        role="presentation"
        class="flex min-h-14 shrink-0 flex-wrap items-center justify-end gap-2 px-5 pt-2 pb-5 sm:px-6"
      >
        <ng-content select="[modal-footer]" />
      </footer>
    }
  </div>
</div>
