<div class="relative flex items-center w-full group" [class.opacity-50]="effectiveDisabled()">
  <!-- Search Icon (Rock-solid Centered) -->
  <div
    class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none flex items-center justify-center text-fb-text-muted group-focus-within:text-fb-primary transition-colors w-4 h-4"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-3.5 h-3.5"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>

  <!-- Input Field -->
  <input
    #searchInput
    type="search"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="effectiveDisabled()"
    [id]="id() || null"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur()"
    [class]="inputClasses()"
    [class.pr-8]="clearable() && value()"
    [class.pr-3]="!clearable() || !value()"
  />

  <!-- Clear Button -->
  @if (clearable() && value() && !effectiveDisabled()) {
    <button
      type="button"
      (click)="onClear()"
      class="absolute right-2 top-1/2 -translate-y-1/2 flex h-6 w-6 items-center justify-center rounded-md text-fb-text-muted transition-colors hover:bg-fb-line/60 hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-fb-primary cursor-pointer"
      title="Suche zurücksetzen"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-3 h-3"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
</div>
