<span
  class="inline-flex shrink-0 items-center justify-center overflow-hidden bg-fb-well text-fb-text-muted"
  [class.border]="!flush()"
  [class.border-fb-border]="!flush()"
  [class.size-10]="size() === 'sm'"
  [class.size-4]="size() === 'badge'"
  [class.size-14]="size() === 'md'"
  [class.size-11]="size() === 'avatar'"
  [class.size-20]="size() === 'profile'"
  [class.rounded-full]="size() === 'avatar' || size() === 'profile' || size() === 'badge'"
  [class.rounded-lg]="!flush() && size() !== 'avatar' && size() !== 'profile' && size() !== 'badge'"
  [class.aspect-[4/3]]="size() === 'reference'"
  [class.aspect-[3/4]]="size() === 'listing'"
  [class.w-full]="size() === 'listing' || size() === 'listing-detail' || size() === 'reference'"
  [class.max-w-[360px]]="size() === 'listing-detail'"
  [class.h-[260px]]="size() === 'listing-detail'"
  [class.sm:h-[420px]]="size() === 'listing-detail'"
>
  @if (imageSource(); as source) {
    <img
      [src]="source"
      [alt]="alt()"
      class="size-full"
      [class.object-contain]="!cover()"
      [class.object-cover]="cover()"
      [attr.loading]="priority() ? 'eager' : 'lazy'"
      decoding="async"
      (error)="failed.set(true); imageFailed.emit()"
    />
  } @else {
    <span
      data-product-placeholder
      class="inline-flex items-center justify-center"
      [attr.role]="alt() ? 'img' : null"
      [attr.aria-label]="alt() || null"
      [attr.aria-hidden]="alt() ? null : 'true'"
    >
      <svg lucideImage class="size-4" aria-hidden="true"></svg>
    </span>
  }
</span>
