@if (dialog.anfrage(); as anfrage) {
  <div
    class="fb-dialog-overlay fb-safe-modal fixed inset-0 z-[100] flex h-dvh items-center justify-center overflow-hidden p-4 animate-fade-in"
    appModalDialog
    schliesstBeiKlickAussen
    [dialogTitel]="anfrage.titel"
    (dialogClose)="dialog.antworte(false)"
  >
    <div
      class="fb-dialog-surface flex max-h-[calc(100dvh-2rem)] w-full max-w-[390px] flex-col overflow-hidden rounded-2xl animate-modal-card"
    >
      <div class="min-h-0 overflow-y-auto overscroll-contain px-6 pt-6 pb-5">
        <div class="flex items-start gap-3">
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg"
            [class.bg-fb-critical-surface]="anfrage.gefahr"
            [class.text-fb-critical]="anfrage.gefahr"
            [class.bg-fb-info-surface]="!anfrage.gefahr"
            [class.text-fb-info]="!anfrage.gefahr"
          >
            <svg
              [lucideIcon]="anfrage.gefahr ? warnIcon : infoIcon"
              class="h-4 w-4"
              aria-hidden="true"
            ></svg>
          </div>
          <div class="min-w-0 space-y-2">
            <h2 class="text-[13px] leading-4 font-semibold text-fb-text-primary">
              {{ anfrage.titel }}
            </h2>
            <p class="text-[13px] leading-[18px] text-fb-text-secondary whitespace-pre-line">
              {{ anfrage.text }}
            </p>
          </div>
        </div>
      </div>
      <div class="flex shrink-0 flex-wrap justify-end gap-2 px-5 pt-1 pb-5">
        @if (!anfrage.nurHinweis) {
          <app-button variant="secondary" (clicked)="dialog.antworte(false)">
            {{ anfrage.abbrechenText || 'Abbrechen' }}
          </app-button>
        }
        <app-button
          [variant]="anfrage.gefahr ? 'destructive' : 'primary'"
          (clicked)="dialog.antworte(true)"
        >
          {{ anfrage.bestaetigenText || 'Bestätigen' }}
        </app-button>
      </div>
    </div>
  </div>
}
