<div
  class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in"
  appModalDialog
  schliesstBeiKlickAussen
  dialogTitel="Barcode scannen"
  (dialogClose)="closed.emit()"
>
  <div
    class="linear-surface rounded-2xl shadow-2xl max-w-md w-full p-5 border border-fb-border flex flex-col space-y-4 animate-modal-card"
  >
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-fb-border">
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center"
        >
          <svg [lucideIcon]="cameraIcon" class="w-4 h-4"></svg>
        </div>
        <div>
          <h2 class="text-sm font-bold text-fb-text-primary">Barcode & EAN scannen</h2>
          <p class="text-[11px] text-fb-text-muted">Barcode im Kamerabild sichtbar halten</p>
        </div>
      </div>

      <button
        type="button"
        (click)="closed.emit()"
        class="p-1 rounded-md text-fb-text-muted hover:text-fb-text-primary hover:bg-fb-surface-hover transition cursor-pointer"
      >
        <svg [lucideIcon]="closeIcon" class="w-4 h-4"></svg>
      </button>
    </div>

    <!-- Error Banner -->
    @if (errorMessage()) {
      <div
        class="p-3 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-400 text-xs flex items-start gap-2"
      >
        <svg [lucideIcon]="alertIcon" class="w-4 h-4 shrink-0 mt-0.5"></svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Camera Viewfinder Container -->
    <div
      class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-black flex items-center justify-center border border-fb-border"
    >
      <video #videoElement playsinline autoplay muted class="w-full h-full object-cover"></video>

      <!-- Viewfinder Overlay Elements -->
      @if (isScanning()) {
        <div class="absolute inset-0 pointer-events-none p-2">
          <div class="relative h-full w-full rounded-lg border-2 border-emerald-400/70 shadow-lg">
            <!-- Animated Laser Scan line -->
            <div
              class="scan-laser absolute left-0 right-0 h-0.5 bg-emerald-400 shadow-md shadow-emerald-400"
            ></div>

            <!-- Corner brackets -->
            <span
              class="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-emerald-400"
            ></span>
            <span
              class="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-emerald-400"
            ></span>
            <span
              class="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-emerald-400"
            ></span>
            <span
              class="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-emerald-400"
            ></span>
          </div>
        </div>
      }

      <!-- Success Flash Overlay -->
      @if (scannedResult()) {
        <div
          class="absolute inset-0 bg-emerald-500/40 backdrop-blur-sm flex flex-col items-center justify-center gap-2 animate-fade-in text-fb-text-primary font-bold"
        >
          <svg [lucideIcon]="checkIcon" class="w-10 h-10 text-fb-text-primary animate-bounce"></svg>
          <span class="text-sm font-mono">{{ scannedResult() }}</span>
          <span class="text-xs text-emerald-100 font-sans">Erfolgreich erkannt!</span>
        </div>
      }

      <!-- Camera Controls (Torch & Switch) -->
      <div class="absolute bottom-2 right-2 flex items-center gap-1.5 z-10">
        @if (hasTorch()) {
          <button
            type="button"
            (click)="toggleTorch()"
            class="p-2 rounded-lg bg-black/60 backdrop-blur-sm text-fb-text-primary hover:bg-black/80 transition cursor-pointer"
            title="Taschenlampe / Licht an"
          >
            <svg
              [lucideIcon]="isTorchOn() ? torchOnIcon : torchOffIcon"
              class="w-4 h-4 text-amber-400"
            ></svg>
          </button>
        }

        <button
          type="button"
          (click)="toggleFacingMode()"
          class="p-2 rounded-lg bg-black/60 backdrop-blur-sm text-fb-text-primary hover:bg-black/80 transition cursor-pointer"
          title="Kamera wechseln"
        >
          <svg [lucideIcon]="switchIcon" class="w-4 h-4"></svg>
        </button>
      </div>
    </div>

    <!-- Manual Barcode Entry Fallback -->
    <div class="space-y-1.5 pt-2 border-t border-fb-border">
      <label
        for="barcod-oder-ean-barcode-manuell"
        class="block text-[10px] font-semibold uppercase tracking-wider text-fb-text-muted"
      >
        Oder EAN / Barcode manuell eingeben
      </label>
      <form (ngSubmit)="onManualSubmit()" class="flex items-center gap-2">
        <input
          id="barcod-oder-ean-barcode-manuell"
          type="text"
          [formControl]="manualEanControl"
          placeholder="z.B. 4005317316719"
          class="linear-input flex-1 px-3 py-1.5 rounded-lg text-xs font-mono"
        />
        <button
          type="submit"
          [disabled]="!manualEanControl.value"
          class="linear-btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold disabled:opacity-40 cursor-pointer flex items-center gap-1"
        >
          <svg [lucideIcon]="searchIcon" class="w-3.5 h-3.5"></svg>
          <span>Übernehmen</span>
        </button>
      </form>
    </div>
  </div>
</div>
