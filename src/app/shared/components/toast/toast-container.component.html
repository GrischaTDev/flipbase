<section
  aria-label="Benachrichtigungen"
  aria-live="polite"
  class="pointer-events-none fixed right-3 bottom-20 z-[100] flex max-h-[70vh] w-[calc(100vw-1.5rem)] max-w-md flex-col gap-2 overflow-y-auto md:right-6 md:bottom-6"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <article
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      class="fb-toast pointer-events-auto grid grid-cols-[2rem_minmax(0,1fr)_2rem] items-start gap-3 rounded-xl border px-3.5 py-3 backdrop-blur-md motion-reduce:transition-none"
      [class.fb-toast--success]="toast.type === 'success'"
      [class.fb-toast--error]="toast.type === 'error'"
      [class.fb-toast--warning]="toast.type === 'warning'"
      [class.fb-toast--info]="toast.type === 'info'"
    >
      <div class="fb-toast__icon flex h-8 w-8 items-center justify-center rounded-lg">
        @switch (toast.type) {
          @case ('success') {
            <svg
              aria-hidden="true"
              class="h-[18px] w-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          }
          @case ('error') {
            <svg
              aria-hidden="true"
              class="h-[18px] w-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m15 9-6 6"></path>
              <path d="m9 9 6 6"></path>
            </svg>
          }
          @case ('warning') {
            <svg
              aria-hidden="true"
              class="h-[18px] w-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
              ></path>
              <path d="M12 9v4"></path>
              <path d="M12 17h.01"></path>
            </svg>
          }
          @case ('info') {
            <svg
              aria-hidden="true"
              class="h-[18px] w-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 16v-4"></path>
              <path d="M12 8h.01"></path>
            </svg>
          }
        }
      </div>

      <div class="flex min-h-8 min-w-0 flex-1 flex-col justify-center py-0.5">
        <p class="text-[13px] font-semibold leading-5 text-fb-text-primary">{{ toast.title }}</p>
        @if (toast.description) {
          <p class="mt-0.5 text-xs leading-5 text-fb-text-muted">{{ toast.description }}</p>
        }
      </div>

      <button
        type="button"
        class="fb-toast__close inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-fb-text-muted transition hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-current motion-reduce:transition-none"
        [attr.aria-label]="'Meldung schließen: ' + toast.title"
        (click)="toastService.dismiss(toast.id)"
      >
        <svg
          aria-hidden="true"
          class="h-[17px] w-[17px]"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </article>
  }
</section>
