<div class="relative flex items-center">
  <input
    type="text"
    [id]="resolvedInputId()"
    [value]="displayValue()"
    [placeholder]="effectivePlaceholder()"
    [disabled]="effectiveDisabled()"
    [attr.aria-label]="effectiveAriaLabel() || null"
    (input)="onInput($event)"
    (blur)="onBlur($event)"
    class="linear-input min-h-9 w-full rounded-md px-2.5 py-1.5 pr-9 text-[13px] font-mono transition-colors"
    autocomplete="off"
    inputmode="numeric"
  />

  <button
    #calendarTrigger
    type="button"
    [disabled]="effectiveDisabled()"
    (click)="toggle($event)"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="calendarId()"
    aria-haspopup="dialog"
    class="absolute right-1.5 flex size-7 items-center justify-center rounded-md text-fb-text-muted transition-colors hover:bg-fb-primary/10 hover:text-fb-primary disabled:opacity-40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fb-primary/50 cursor-pointer"
    [class.text-fb-primary]="isOpen()"
    aria-label="Kalender öffnen"
  >
    <svg [lucideIcon]="calendarIcon" aria-hidden="true" class="size-3.5"></svg>
  </button>
</div>

@if (isOpen()) {
  <div
    #calendar
    [id]="calendarId()"
    [attr.popover]="supportsPopover ? 'manual' : null"
    class="fb-popover-enter z-50 w-64 max-w-[calc(100vw-1rem)] overflow-y-auto rounded-lg border border-fb-border bg-fb-surface p-2.5 shadow-lg"
    [class]="supportsPopover ? 'fixed inset-auto m-0' : 'absolute left-0 top-full mt-2'"
    [style.left.px]="supportsPopover ? calendarPosition().left : null"
    [style.top.px]="supportsPopover ? calendarPosition().top : null"
    [style.max-height.px]="supportsPopover ? calendarPosition().maxHeight : null"
    role="dialog"
    aria-label="Datum wählen"
  >
    <div class="mb-2.5 flex items-center justify-between">
      <button
        type="button"
        (click)="navigateMonth(-1)"
        class="flex size-7 items-center justify-center rounded-lg text-fb-text-muted transition hover:bg-fb-surface-hover hover:text-fb-text-primary cursor-pointer"
        aria-label="Voriger Monat"
      >
        <svg [lucideIcon]="prevIcon" aria-hidden="true" class="size-3.5"></svg>
      </button>

      <span class="text-[13px] font-semibold text-fb-text-primary">{{ monthName() }}</span>

      <button
        type="button"
        (click)="navigateMonth(1)"
        class="flex size-7 items-center justify-center rounded-lg text-fb-text-muted transition hover:bg-fb-surface-hover hover:text-fb-text-primary cursor-pointer"
        aria-label="Nächster Monat"
      >
        <svg [lucideIcon]="nextIcon" aria-hidden="true" class="size-3.5"></svg>
      </button>
    </div>

    <div #calendarGrid role="grid" aria-label="Kalendertage">
      <div class="mb-1.5 grid grid-cols-7 gap-0.5" role="row">
        @for (tag of weekdays; track tag) {
          <span class="text-center text-xs font-semibold text-fb-text-dimmed" role="columnheader">
            {{ tag }}
          </span>
        }
      </div>

      <div class="space-y-0.5" role="rowgroup">
        @for (week of weeks(); track week[0].date) {
          <div class="grid grid-cols-7 gap-0.5" role="row">
            @for (t of week; track t.date) {
              <button
                type="button"
                (click)="selectDate(t.date)"
                (keydown)="onCalendarKeydown($event, t.date)"
                [attr.tabindex]="focusedDate() === t.date ? 0 : -1"
                role="gridcell"
                class="flex h-8 w-full items-center justify-center rounded-md text-[13px] transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fb-primary/50"
                [class.text-fb-text-dimmed]="t.isOutside && !t.isSelected"
                [class.text-fb-text-secondary]="!t.isOutside && !t.isSelected && !t.isToday"
                [class.font-bold]="t.isToday || t.isSelected"
                [class.border]="t.isToday && !t.isSelected"
                [class.border-fb-border]="t.isToday && !t.isSelected"
                [class.bg-fb-primary]="t.isSelected"
                [class.text-fb-on-accent]="t.isSelected"
                [class.hover:bg-fb-surface-hover]="!t.isSelected"
                [attr.data-date]="t.date"
                [attr.aria-label]="dateAriaLabel(t.date)"
                [attr.aria-selected]="t.isSelected ? 'true' : null"
                [attr.aria-current]="t.isToday ? 'date' : null"
              >
                {{ t.dayNumber }}
              </button>
            }
          </div>
        }
      </div>
    </div>

    <div class="mt-2.5 flex items-center justify-between border-t border-fb-line pt-2 text-[13px]">
      <button
        type="button"
        (click)="selectToday()"
        class="font-semibold text-fb-primary hover:underline cursor-pointer"
      >
        Heute
      </button>

      @if (value()) {
        <button
          type="button"
          (click)="selectDate('')"
          class="text-fb-text-muted hover:text-rose-400 cursor-pointer"
        >
          Löschen
        </button>
      }
    </div>
  </div>
}
