@switch (state()) {
  @case ('running') {
    <span
      class="flex h-7 w-7 items-center justify-center rounded-full bg-fb-primary text-fb-on-accent"
    >
      <app-loading-indicator size="md" />
    </span>
  }
  @case ('success') {
    <span
      class="animate-checkmark-pop flex items-center justify-center rounded-full bg-fb-success-strong text-white motion-reduce:animate-none!"
      [class]="size() === 'large' ? 'h-14 w-14' : 'h-7 w-7'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="animate-checkmark-stroke motion-reduce:animate-none! motion-reduce:[stroke-dashoffset:0]!"
        [class]="size() === 'large' ? 'h-7 w-7' : 'h-4 w-4'"
      >
        <path d="m5 12 4 4 10-10" />
      </svg>
    </span>
  }
  @case ('error') {
    <span
      class="flex h-7 w-7 items-center justify-center rounded-full bg-fb-critical-surface text-fb-critical"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="h-4 w-4"
      >
        <path d="m7 7 10 10M17 7 7 17" />
      </svg>
    </span>
  }
  @case ('paused') {
    <span
      class="flex h-7 w-7 items-center justify-center rounded-full bg-fb-surface-hover text-fb-text-secondary"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        class="h-4 w-4"
      >
        <path d="M9 5v14M15 5v14" />
      </svg>
    </span>
  }
}
