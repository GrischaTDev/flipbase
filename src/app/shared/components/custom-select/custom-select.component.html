<div class="relative text-left" [class]="widthClass()">
  <!-- Trigger Button -->
  @if (variant() === 'pill') {
    <button
      type="button"
      (click)="toggleDropdown($event)"
      [disabled]="effectiveDisabled()"
      class="inline-flex items-center justify-between gap-1.5 px-3 py-1 rounded-full text-xs font-bold border transition cursor-pointer shadow-sm outline-none select-none max-w-full"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class]="
        selectedOption()?.colorClass ||
        'bg-fb-subtle text-fb-text-primary border-fb-border hover:border-fb-border-hover'
      "
    >
      <span class="truncate">{{ selectedOption()?.label || placeholder() }}</span>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-3 h-3 shrink-0 opacity-70 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  } @else if (variant() === 'filter') {
    <button
      type="button"
      (click)="toggleDropdown($event)"
      [disabled]="effectiveDisabled()"
      class="linear-input w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer transition select-none text-fb-text-secondary"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class.border-fb-primary]="isOpen()"
    >
      <span class="truncate">{{ selectedOption()?.label || placeholder() }}</span>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-3.5 h-3.5 text-fb-text-muted shrink-0 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  } @else {
    <!-- Default Form Select Variant -->
    <button
      type="button"
      (click)="toggleDropdown($event)"
      [disabled]="effectiveDisabled()"
      class="linear-input w-full flex items-center justify-between gap-2 rounded-lg font-medium cursor-pointer transition select-none text-fb-text-primary"
      [class]="groessenKlasse()"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class.border-fb-primary]="isOpen()"
    >
      <div class="flex items-center gap-2 truncate">
        @if (selectedOption()?.badgeClass) {
          <span class="w-2 h-2 rounded-full shrink-0" [class]="selectedOption()?.badgeClass"></span>
        }
        <span class="truncate" [class.text-fb-text-muted]="!selectedOption()">
          {{ selectedOption()?.label || placeholder() }}
        </span>
      </div>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-4 h-4 text-fb-text-muted shrink-0 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  }

  <!-- Floating Dropdown Panel -->
  @if (isOpen()) {
    <div
      class="custom-select-menu absolute z-50 min-w-[160px] max-w-[320px] w-full rounded-xl bg-fb-well border border-fb-line shadow-2xl ring-1 ring-white/5 py-1.5 max-h-60 overflow-y-auto outline-none animate-in fade-in zoom-in-95 duration-100"
      [class.bottom-full]="isDropUp()"
      [class.mb-1.5]="isDropUp()"
      [class.top-full]="!isDropUp()"
      [class.mt-1.5]="!isDropUp()"
      [class.right-0]="variant() === 'pill'"
      [class.left-0]="variant() !== 'pill'"
    >
      <div class="space-y-0.5 px-1">
        @for (option of options(); track option.value) {
          @let isSelected = value() === option.value;
          <button
            type="button"
            (click)="selectOption(option, $event)"
            class="w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-left transition cursor-pointer select-none"
            [class.bg-indigo-600/20]="isSelected"
            [class.text-indigo-300]="isSelected"
            [class.font-bold]="isSelected"
            [class.text-fb-text-secondary]="!isSelected"
            [class.hover:bg-fb-surface-alt]="!isSelected"
            [class.hover:text-fb-text-primary]="!isSelected"
          >
            <div class="flex items-center gap-2 truncate">
              @if (option.badgeClass) {
                <span class="w-2 h-2 rounded-full shrink-0" [class]="option.badgeClass"></span>
              }
              <span class="truncate">{{ option.label }}</span>
            </div>

            @if (isSelected) {
              <svg [lucideIcon]="checkIcon" class="w-3.5 h-3.5 text-indigo-400 shrink-0"></svg>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
