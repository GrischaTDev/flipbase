<div class="relative text-left" [class]="widthClass()">
  <!-- Trigger Button -->
  @if (variant() === 'pill') {
    <button
      #trigger
      type="button"
      role="combobox"
      aria-haspopup="listbox"
      (click)="toggleDropdown($event)"
      (keydown)="onTriggerKeydown($event)"
      (blur)="onTriggerBlur()"
      [disabled]="effectiveDisabled()"
      [id]="resolvedTriggerId()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? listboxId() : null"
      [attr.aria-activedescendant]="activeDescendantId()"
      [attr.aria-disabled]="effectiveDisabled()"
      class="inline-flex min-h-9 items-center justify-between gap-1.5 rounded-full border px-3 py-1 text-[13px] font-semibold transition cursor-pointer shadow-sm outline-none select-none max-w-full focus-visible:ring-2 focus-visible:ring-fb-primary/50 focus-visible:border-fb-primary"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class]="
        selectedOption()?.colorClass ||
        'bg-fb-subtle text-fb-text-primary border-fb-border hover:border-fb-border-hover'
      "
    >
      <span class="truncate">{{ selectedOption()?.label || placeholder() }}</span>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-3 h-3 shrink-0 opacity-70 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  } @else if (variant() === 'toolbar') {
    <button
      #trigger
      type="button"
      role="combobox"
      aria-haspopup="listbox"
      (click)="toggleDropdown($event)"
      (keydown)="onTriggerKeydown($event)"
      (blur)="onTriggerBlur()"
      [disabled]="effectiveDisabled()"
      [id]="resolvedTriggerId()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? listboxId() : null"
      [attr.aria-activedescendant]="activeDescendantId()"
      class="inline-flex h-7 w-full max-w-full items-center justify-between gap-1 rounded-lg border border-transparent bg-transparent px-2 text-[13px] font-medium text-fb-text-primary transition-colors hover:bg-fb-subtle focus-visible:border-fb-primary focus-visible:bg-fb-surface focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-fb-primary"
    >
      <span class="truncate">{{ selectedOption()?.label || placeholder() }}</span>
      <svg [lucideIcon]="chevronIcon" class="size-3 shrink-0 opacity-70"></svg>
    </button>
  } @else if (variant() === 'filter') {
    <button
      #trigger
      type="button"
      role="combobox"
      aria-haspopup="listbox"
      (click)="toggleDropdown($event)"
      (keydown)="onTriggerKeydown($event)"
      (blur)="onTriggerBlur()"
      [disabled]="effectiveDisabled()"
      [id]="resolvedTriggerId()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? listboxId() : null"
      [attr.aria-activedescendant]="activeDescendantId()"
      [attr.aria-disabled]="effectiveDisabled()"
      class="linear-input w-full flex min-h-9 items-center justify-between gap-2 rounded-md px-2.5 py-1.5 text-[13px] font-medium cursor-pointer transition-colors select-none text-fb-text-secondary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fb-primary/50 focus-visible:border-fb-primary"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class.border-fb-primary]="isOpen()"
    >
      <span class="truncate">{{ selectedOption()?.label || placeholder() }}</span>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-3.5 h-3.5 text-fb-text-muted shrink-0 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  } @else {
    <!-- Default Form Select Variant -->
    <button
      #trigger
      type="button"
      role="combobox"
      aria-haspopup="listbox"
      (click)="toggleDropdown($event)"
      (keydown)="onTriggerKeydown($event)"
      (blur)="onTriggerBlur()"
      [disabled]="effectiveDisabled()"
      [id]="resolvedTriggerId()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="isOpen() ? listboxId() : null"
      [attr.aria-activedescendant]="activeDescendantId()"
      [attr.aria-disabled]="effectiveDisabled()"
      class="linear-input w-full flex items-center justify-between gap-2 rounded-md font-medium cursor-pointer transition-colors select-none text-fb-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fb-primary/50 focus-visible:border-fb-primary"
      [class]="groessenKlasse()"
      [class.opacity-50]="effectiveDisabled()"
      [class.cursor-not-allowed]="effectiveDisabled()"
      [class.border-fb-primary]="isOpen()"
    >
      <div class="flex items-center gap-2 truncate">
        @if (selectedOption()?.badgeClass) {
          <span class="w-2 h-2 rounded-full shrink-0" [class]="selectedOption()?.badgeClass"></span>
        }
        <span class="truncate" [class.text-fb-text-muted]="!selectedOption()">
          {{ selectedOption()?.label || placeholder() }}
        </span>
      </div>
      <svg
        [lucideIcon]="chevronIcon"
        class="w-4 h-4 text-fb-text-muted shrink-0 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  }

  <!-- Floating Dropdown Panel -->
  @if (isOpen()) {
    <div
      #panel
      role="listbox"
      tabindex="-1"
      [attr.popover]="supportsPopover ? 'manual' : null"
      [attr.aria-label]="ariaLabel()"
      (keydown)="onTriggerKeydown($event)"
      [id]="listboxId()"
      class="custom-select-menu fb-popover-enter absolute z-50 min-w-[160px] max-w-[320px] w-full rounded-lg bg-fb-surface border border-fb-border shadow-lg py-1.5 max-h-60 overflow-y-auto outline-none"
      [class.bottom-full]="!supportsPopover && isDropUp()"
      [class.mb-1.5]="!supportsPopover && isDropUp()"
      [class.top-full]="!supportsPopover && !isDropUp()"
      [class.mt-1.5]="!supportsPopover && !isDropUp()"
      [class.right-0]="!supportsPopover && variant() === 'pill'"
      [class.left-0]="!supportsPopover && variant() !== 'pill'"
      [style.left.px]="supportsPopover ? panelPosition().left : null"
      [style.top.px]="supportsPopover ? panelPosition().top : null"
      [style.width.px]="supportsPopover ? panelPosition().width : null"
      [style.max-height.px]="supportsPopover ? panelPosition().maxHeight : null"
    >
      <div class="space-y-0.5 px-1">
        @for (option of options(); track option.value; let index = $index) {
          @let isSelected = value() === option.value;
          @let isActive = activeIndex() === index;
          <button
            type="button"
            role="option"
            tabindex="-1"
            (click)="selectOption(option, $event)"
            [disabled]="effectiveDisabled()"
            [id]="optionId(index)"
            [attr.aria-selected]="isSelected"
            [attr.aria-disabled]="effectiveDisabled()"
            class="w-full flex min-h-9 items-center justify-between gap-2 rounded-md px-2.5 py-2 text-[13px] font-medium text-left transition-colors cursor-pointer select-none"
            [class.ring-1]="isActive"
            [class.ring-fb-primary/50]="isActive"
            [class.bg-fb-primary-subtle]="isSelected"
            [class.text-fb-primary]="isSelected"
            [class.font-bold]="isSelected"
            [class.text-fb-text-secondary]="!isSelected"
            [class.hover:bg-fb-surface-alt]="!isSelected"
            [class.hover:text-fb-text-primary]="!isSelected"
          >
            <div class="flex items-center gap-2 truncate">
              @if (option.badgeClass) {
                <span class="w-2 h-2 rounded-full shrink-0" [class]="option.badgeClass"></span>
              }
              <span class="truncate">{{ option.label }}</span>
            </div>

            @if (isSelected) {
              <svg [lucideIcon]="checkIcon" class="w-3.5 h-3.5 text-fb-primary shrink-0"></svg>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
