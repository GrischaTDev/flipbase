<header class="flex flex-col gap-2.5 pb-2">
  @if (backLink()) {
    <nav class="flex items-center" aria-label="Breadcrumb">
      <a
        data-item-back-link
        [routerLink]="backLink()"
        class="inline-flex min-h-7 items-center gap-1.5 rounded-md text-[13px] font-medium text-fb-text-muted transition-colors select-none hover:text-fb-text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--fb-control-focus)] pointer-coarse:min-h-11"
      >
        <svg [lucideIcon]="backIcon" class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>{{ backLabel() }}</span>
      </a>
    </nav>
  }

  <div class="flex min-w-0 flex-wrap items-center justify-between gap-3">
    <div class="min-w-[min(100%,14rem)] flex-1 space-y-1">
      <div class="flex items-center gap-2 flex-wrap min-w-0">
        @if (icon(); as pageIcon) {
          <svg
            [lucideIcon]="pageIcon"
            [class]="
              appearance() === 'overview'
                ? 'size-7 shrink-0 text-fb-text-primary'
                : 'size-5 shrink-0 text-fb-text-secondary'
            "
            aria-hidden="true"
          ></svg>
        }
        <h1
          [class]="
            appearance() === 'overview'
              ? 'min-w-0 break-words text-[28px] leading-9 font-semibold tracking-tight text-fb-text-primary'
              : appearance() === 'content'
                ? 'min-w-0 break-words text-[26px] leading-8 font-semibold tracking-tight text-fb-text-primary'
                : 'min-w-0 break-words text-xl leading-7 font-[450] tracking-tight text-fb-text-primary'
          "
        >
          {{ title() }}
        </h1>
        <ng-content select="[header-badge]" />
      </div>

      @if (subtitle()) {
        <p class="text-[13px] text-fb-text-muted">{{ subtitle() }}</p>
      }

      <div class="empty:hidden flex items-center gap-2 pt-0.5">
        <ng-content select="[header-meta]" />
      </div>
    </div>

    <div class="empty:hidden flex min-w-0 max-w-full flex-wrap items-center gap-2 max-sm:w-full">
      <ng-content select="[header-actions]" />
    </div>
  </div>
</header>
