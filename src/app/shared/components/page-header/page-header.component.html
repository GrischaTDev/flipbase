<header class="flex flex-col gap-2.5 pb-2">
  @if (backLink()) {
    <nav class="flex items-center" aria-label="Breadcrumb">
      <a
        data-item-back-link
        [routerLink]="backLink()"
        class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-fb-text-muted hover:text-fb-text-primary transition-colors select-none py-0.5"
      >
        <svg [lucideIcon]="backIcon" class="w-3.5 h-3.5" aria-hidden="true"></svg>
        <span>{{ backLabel() }}</span>
      </a>
    </nav>
  }

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 min-w-0">
    <div class="min-w-0 space-y-1">
      <div class="flex items-center gap-2.5 flex-wrap min-w-0">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-fb-text-primary truncate">
          {{ title() }}
        </h1>
        <ng-content select="[header-badge]" />
      </div>

      @if (subtitle()) {
        <p class="text-[13px] text-fb-text-muted">{{ subtitle() }}</p>
      }

      <div class="empty:hidden flex items-center gap-2 pt-0.5">
        <ng-content select="[header-meta]" />
      </div>
    </div>

    <div class="empty:hidden flex items-center gap-2 shrink-0 flex-wrap">
      <ng-content select="[header-actions]" />
    </div>
  </div>
</header>
