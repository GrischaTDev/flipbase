<span class="inline-flex min-w-0 items-center gap-2" [title]="label()">
  @if (appearance().logo; as logo) {
    <img
      [ngSrc]="logo"
      width="22"
      height="22"
      alt=""
      class="size-[22px] shrink-0 object-contain"
    />
  } @else {
    <svg [lucideIcon]="storeIcon" aria-hidden="true" class="size-4 shrink-0"></svg>
  }
  <span class="min-w-0 truncate">{{ label() }}</span>
</span>
