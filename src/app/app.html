<router-outlet (activate)="startup.markRouteRendered()"></router-outlet>
<app-toast-container></app-toast-container>
@defer (when pwa.installDialogOpen()) {
  <app-pwa-install-dialog />
}
@defer (when pwa.updateAvailable() || pwa.checkingForUpdate() || pwa.updateCheckError()) {
  <app-pwa-update-notice />
}
@defer (when pushNavigation.pending()) {
  <app-push-navigation-notice />
}
