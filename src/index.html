<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Flipbase – Reselling OS</title>
    <base href="/" />
    <!-- Kein user-scalable=no: das Sperren des Zooms verstoesst gegen WCAG 1.4.4 (Resize Text, AA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- PWA Primary Colors & Apple Touch Meta -->
    <!--
      Startwert fuer die Adressleiste, bis die Anwendung laeuft. Danach setzt
      der Theme-Dienst ihn aus der Design-Variablen --fb-bg-app nach.
    -->
    <meta name="theme-color" content="#1f1f1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flipbase" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <!-- Lokal gehostete Schriften: kein Aufruf an fonts.gstatic.com,
         damit keine Besucher-IP in die USA uebertragen wird (DSGVO) und
         die Typografie auch offline steht. -->
    <link
      rel="preload"
      href="fonts/plus-jakarta-sans-300-latin-fdb05b.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="fonts/fonts.css" />
  </head>
  <!--
    Grundfarbe und Schriftfarbe stehen bewusst nicht hier, sondern in
    styles.css unter :root und html.dark. Fest verdrahtete Klassen an dieser
    Stelle haben den Umschalter ausgehebelt: Die Flaeche hinter der App blieb
    immer zinc-950, egal welches Design gewaehlt war. Aufgefallen ist es erst,
    als das dunkle Design einen anderen Grundton bekam - vorher war der
    Unterschied zum alten Anthrazit zu klein, um ihn zu bemerken.
  -->
  <body class="font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <app-root></app-root>
  </body>
</html>
