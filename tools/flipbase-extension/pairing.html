<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinted-Verbindung bestätigen</title>
    <link rel="stylesheet" href="pairing.css" />
    <script src="pairing.js" defer></script>
  </head>
  <body>
    <main>
      <img src="images/flipbase-mark-48.png" alt="Flipbase" width="48" height="48" />
      <h1>Vinted mit Flipbase verbinden</h1>
      <p>
        Bestätige nur die Verbindung, die Du gerade selbst in Flipbase angefordert hast. Sie erlaubt
        den Import Deiner Vinted-Daten und die in Flipbase freigegebenen Aktionen.
      </p>
      <dl id="details"></dl>
      <p id="status" role="status">Verbindung wird geprüft …</p>
      <button id="approve" disabled>Diese Verbindung bestätigen</button>
      <button id="cancel">Abbrechen</button>
    </main>
  </body>
</html>
