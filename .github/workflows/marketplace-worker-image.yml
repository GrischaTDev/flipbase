name: Marketplace Images

on:
  workflow_call:
    inputs:
      check_plan:
        type: string
        required: true

# Überholte PR-Prüfungen abbrechen; Hauptzweigveröffentlichungen vollständig beenden.
concurrency:
  group: marketplace-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Der manuelle Publisher verwendet denselben Imageprüfbefehl vor dem Push.
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and check selected marketplace images
        env:
          MARKETPLACE_CHECK_PLAN: ${{ inputs.check_plan }}
        run: node scripts/run-marketplace-checks.mjs images
