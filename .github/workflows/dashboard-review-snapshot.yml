name: Dashboard review snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-review-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - name: Package isolated review workspace
        run: |
          mkdir -p /tmp/dashboard-review
          git archive HEAD | tar -x -C /tmp/dashboard-review
          cp -a node_modules /tmp/dashboard-review/node_modules
          tar -czf /tmp/dashboard-review.tgz -C /tmp/dashboard-review .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-review-workspace
          path: /tmp/dashboard-review.tgz
          retention-days: 1
          compression-level: 0
