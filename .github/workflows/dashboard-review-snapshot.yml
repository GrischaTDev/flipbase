name: Dashboard review snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-review-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Package matching Node runtime
        run: |
          cp "$(command -v node)" /tmp/node-runtime
          gzip /tmp/node-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-review-node
          path: /tmp/node-runtime.gz
          retention-days: 1
          compression-level: 0
