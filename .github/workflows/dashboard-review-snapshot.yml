name: Dashboard review snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-review-snapshot.yml'

permissions:
  contents: read

jobs:
  prepare-objects:
    if: github.event.pull_request.number == 248 && github.event.pull_request.head.ref == 'feat/dashboard-modern-rework' && github.event.pull_request.head.repo.full_name == 'GrischaTDev/flipbase'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 61c994d210699a8dc7dd8bfac8a5cec078051380
          persist-credentials: false
      - name: Prepare verified Git blobs without updating branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          endpoint = 'https://api.github.com/repos/GrischaTDev/flipbase/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          chunks = ['fb562b483446d7b47cd5d24883ae68ae934e486f', '3c4ae8766eeec1337474f1effebe0ed89cafe7a4', 'bc0bca3b07c5e633348164ea85029b505c7d4ed2', '6e5aa6b5546d98a006844e08a0ffee09f5b7f2ac', '424588854a891ca9be35c9fcc746a6c1f87ea322', 'f72b11dc68fa19b4d5a5d6a349d72c77a9f3f495']
          encoded = ''
          for sha in chunks:
              request = urllib.request.Request(endpoint + '/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  chunk = json.load(response)
              assert chunk['sha'] == sha
              encoded += base64.b64decode(chunk['content']).decode('ascii')
          assert len(encoded) == 19452, 'Payload length mismatch; no writes performed'
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '22919fe167886bde0901f5f430fc6dc97c5344d471122ea526359c2a1b513b85'
          payload = json.loads(raw)
          allowed = {'e2e/dashboard-design.spec.ts', 'e2e/login.spec.ts', 'e2e/support/fixtures.ts', 'src/app/features/dashboard/dashboard.component.ts', 'src/app/features/dashboard/dashboard.component.html', 'src/app/features/dashboard/dashboard.component.css', 'src/app/features/dashboard/dashboard.component.angular.spec.ts', 'src/app/features/dashboard/models/dashboard-overview.ts', 'src/app/features/dashboard/models/dashboard-overview.spec.ts', 'docs/AI-CHANGELOG.md'}
          assert {entry['path'] for entry in payload['files']} == allowed
          assert len(payload['files']) == len(allowed)
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared = []
          for entry in payload['files']:
              path = pathlib.Path(entry['path'])
              if entry['previous_sha'] is None:
                  assert not path.exists(), str(path)
                  original = b''
              else:
                  original = path.read_bytes()
                  assert blob_sha(original) == entry['previous_sha'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['start'] <= edit['end'] <= len(lines)
                  lines[edit['start']:edit['end']] = [edit['text']]
              content = ''.join(lines).encode('utf-8')
              assert blob_sha(content) == entry['sha'], str(path)
              prepared.append((entry['path'], entry['sha'], content))
          manifest = []
          for path, expected_sha, content in prepared:
              request = urllib.request.Request(endpoint, method='POST', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected_sha, path
              manifest.append({'path': path, 'sha': result['sha']})
          pathlib.Path('/tmp/dashboard-blob-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified and prepared', len(manifest), 'Git blobs. No commits or branch updates performed.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-blob-manifest
          path: /tmp/dashboard-blob-manifest.json
          retention-days: 1
