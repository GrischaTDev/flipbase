name: Prepare purchase validation workspace once

on:
  push:
    branches: [feat/purchase-workflow-20260916]
    paths: [.github/workflows/purchase-workspace-once.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Package matching Node runtime without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/purchase-runtime/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/purchase-runtime/bin/node"
          node --version > "$RUNNER_TEMP/purchase-runtime/version.txt"
          tar -czf "$RUNNER_TEMP/purchase-runtime.tar.gz" -C "$RUNNER_TEMP/purchase-runtime" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: purchase-validation-node-runtime
          path: ${{ runner.temp }}/purchase-runtime.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
