name: Label validation tools

on:
  push:
    branches: ['juna/brand-labels']
    paths: ['.github/workflows/brand-label-validation-tools.yml']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Prepare public PostgreSQL binaries and media package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/label-tools"
          mkdir -p "$out/pg/usr/lib/postgresql" "$out/pg/usr/share/postgresql" "$out/pg/deps" "$out/bin" "$out/media"
          docker pull postgres:17-bookworm
          docker run -d --name label-pg-tools --entrypoint sleep postgres:17-bookworm 900
          trap 'docker rm -f label-pg-tools >/dev/null' EXIT
          docker cp label-pg-tools:/usr/lib/postgresql/17 "$out/pg/usr/lib/postgresql/"
          docker cp label-pg-tools:/usr/share/postgresql/17 "$out/pg/usr/share/postgresql/"
          while IFS= read -r lib; do
            case "$(basename "$lib")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*) continue ;; esac
            docker cp -L "label-pg-tools:$lib" "$out/pg/deps/"
          done < <(docker exec label-pg-tools bash -c 'ldd /usr/lib/postgresql/17/bin/postgres /usr/lib/postgresql/17/bin/psql /usr/lib/postgresql/17/lib/pgcrypto.so' | awk '/=> \// {print $3}' | sort -u)
          cp "$(command -v deno)" "$out/bin/deno"
          cp "$(command -v node)" "$out/bin/node"
          npm install --prefix "$out/media" --ignore-scripts --save-exact @imagemagick/magick-wasm@0.0.42
          docker exec label-pg-tools postgres --version > "$out/versions.txt"
          docker image inspect postgres:17-bookworm --format '{{json .RepoDigests}}' >> "$out/versions.txt"
          deno --version >> "$out/versions.txt"
          node --version >> "$out/versions.txt"
          tar -czf "$RUNNER_TEMP/label-validation-tools.tar.gz" -C "$out" .
      - name: Upload short-lived validation tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-validation-tools
          path: ${{ runner.temp }}/label-validation-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
