name: Marketplace UI verification transfer
on:
  push:
    branches: ['juna/vinted-marketplace-foundation']
    paths: ['tools/marketplace-ui-transfer.part*', '.github/workflows/marketplace-ui-transfer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NG_BUILD_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Apply checksum-verified UI changes
        run: |
          mkdir -p /tmp/marketplace-ui/screenshots
          cat tools/marketplace-ui-transfer.part1 tools/marketplace-ui-transfer.part2 tools/marketplace-ui-transfer.part3 > /tmp/marketplace-ui/transfer.json
          python3 - <<'PY'
          import json,base64,lzma,hashlib,subprocess
          from pathlib import Path
          m=json.loads(Path('/tmp/marketplace-ui/transfer.json').read_text())
          assert m['base']=='611687a43d214f3532f2464a9e04dedd94082c2c'
          subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
          patch=lzma.decompress(base64.b64decode(m['patch']))
          assert hashlib.sha256(patch).hexdigest()==m['sha256']
          Path('/tmp/marketplace-ui/changes.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/marketplace-ui/changes.patch'],check=True)
          subprocess.run(['git','apply','/tmp/marketplace-ui/changes.patch'],check=True)
          for path in m['files']:
            assert not Path(path).is_absolute() and '..' not in Path(path).parts
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==m['hashes'][path],path
          PY
      - run: npm ci
      - name: Formatting and shared controls
        run: |
          node --input-type=module -e "import{readFileSync}from'node:fs';import{execFileSync}from'node:child_process';const m=JSON.parse(readFileSync('/tmp/marketplace-ui/transfer.json'));execFileSync('npx',['prettier','--check',...m.files],{stdio:'inherit'});execFileSync('npx',['eslint',...m.files.filter(p=>/\.(ts|html)$/.test(p))],{stdio:'inherit'});"
          node scripts/check-admin-shared-ui.mjs
      - name: Marketplace and navigation tests
        run: |
          node --experimental-strip-types --test supabase/functions/_shared/marketplace-*.test.ts
          npx vitest run --project=node --maxWorkers=1 src/app/features/marketplaces src/app/core/config/workspace-navigation.spec.ts src/app/core/i18n/translations.spec.ts
          npx vitest run --project=angular --maxWorkers=1 src/app/features/marketplaces src/app/layout/sidebar/sidebar-ideas.angular.spec.ts src/app/layout/sidebar/sidebar.component.angular.spec.ts src/app/features/settings/settings-shell/settings-shell.component.angular.spec.ts
          npm run typecheck
      - name: Angular production build
        run: npm run build
      - name: Preserve built application for review
        run: tar -czf /tmp/marketplace-ui/application.tar.gz -C dist/flipbase/browser .
      - name: Browser interactions on desktop and mobile
        env:
          MARKETPLACE_SCREENSHOT_DIR: /tmp/marketplace-ui/screenshots
          MARKETPLACE_TEST_OUTPUT: /tmp/marketplace-ui/test-results
        run: |
          npx playwright install --with-deps chromium
          python3 - <<'PY' &
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          import os
          os.chdir('dist/flipbase/browser')
          class Handler(SimpleHTTPRequestHandler):
            def do_GET(self):
              if not os.path.isfile(self.translate_path(self.path)): self.path='/index.html'
              super().do_GET()
          ThreadingHTTPServer(('127.0.0.1',4200),Handler).serve_forever()
          PY
          server=$!
          trap 'kill "$server"' EXIT
          npx playwright test --config e2e/support/marketplace-preview.config.ts
      - name: Prepare verified commit without updating any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFile,writeFile } from 'node:fs/promises';
          const repo=process.env.GITHUB_REPOSITORY,base=process.env.GITHUB_SHA;
          if(repo!=='GrischaTDev/flipbase'||process.env.GITHUB_REF!=='refs/heads/juna/vinted-marketplace-foundation')throw Error('Invalid context');
          const m=JSON.parse(await readFile('/tmp/marketplace-ui/transfer.json','utf8'));
          async function api(path,body){const r=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method:body?'POST':'GET',headers:{authorization:`Bearer ${process.env.GITHUB_TOKEN}`,accept:'application/vnd.github+json','content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(`GitHub ${r.status}`);return r.json();}
          const prior=await api(`git/commits/${base}`),tree=[];
          for(const path of m.files){const blob=await api('git/blobs',{content:await readFile(path,'utf8'),encoding:'utf-8'});tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          for(const path of ['tools/marketplace-ui-transfer.part1','tools/marketplace-ui-transfer.part2','tools/marketplace-ui-transfer.part3','.github/workflows/marketplace-ui-transfer.yml'])tree.push({path,mode:'100644',type:'blob',sha:null});
          const result=await api('git/trees',{base_tree:prior.tree.sha,tree});
          const author={name:prior.author.name,email:prior.author.email};
          const commit=await api('git/commits',{message:'feat(ui): add integrated Vinted account workspace\n\nConnect scoped account management and cached account views to existing RPCs.\nValidate server responses and discard stale workspace, account and conversation results.\nVerify focused tests, type checking, production build and desktop/mobile browser flows.\nKeep real marketplace sessions, publishing, migrations and deployments untouched.',tree:result.sha,parents:[base],author,committer:author});
          const review={base,sha:commit.sha,tree:result.sha,files:m.files};
          await writeFile('/tmp/marketplace-ui/review-commit.json',JSON.stringify(review,null,2));
          console.info('MARKETPLACE_UI_COMMIT',JSON.stringify(review));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: marketplace-ui-${{ github.sha }}
          path: /tmp/marketplace-ui/
          retention-days: 3
