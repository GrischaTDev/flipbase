name: Purchase seller schema preview

# Vorläufig: Lokal steht kein Docker zur Verfügung. Dieser Lauf erzeugt Migration
# und Supabase-Typen aus dem deklarativen Schema und führt die DB-Tests aus. Er
# wird vor dem Merge des Einkaufsumbaus wieder entfernt.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/purchase-seller-schema-preview.yml'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: purchase-seller-schema-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.head_ref == 'feat/purchase-workflow-20260916' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nur der wegwerfbare Runner startet Container. Keine Zugangsdaten, keine
      # Produktionsdatenbank und kein Deployment.
      - name: Generate declarative migration
        run: |
          mkdir -p schema-preview
          git rev-parse HEAD > schema-preview/source-commit.txt
          npx supabase --version > schema-preview/cli-version.txt
          if ! ls supabase/migrations/*_purchase_seller_details.sql > /dev/null 2>&1; then
            npx supabase db diff -f purchase_seller_details --schema public
          fi
          cp supabase/migrations/*_purchase_seller_details.sql schema-preview/

      - name: Apply migrations in isolated database
        run: npx supabase start

      - name: Generate database types
        run: npx supabase gen types typescript --local > schema-preview/supabase.types.ts

      - name: Test database
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee schema-preview/test-db.log

      - name: Stop isolated database
        if: ${{ always() }}
        run: npx supabase stop --no-backup

      - name: Upload review artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purchase-seller-schema-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-preview/
          if-no-files-found: warn
          retention-days: 7
