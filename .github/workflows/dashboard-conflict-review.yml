name: Dashboard conflict verification

on:
  push:
    branches: ['feat/dashboard-modern-rework']
    paths: ['.github/workflows/dashboard-conflict-review.yml']

permissions:
  contents: read

jobs:
  verify-conflict:
    if: github.repository == 'GrischaTDev/flipbase' && github.ref == 'refs/heads/feat/dashboard-modern-rework'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: 92465f04167df29d33474b69b15559491df751c1
      MASTER_SHA: 7131191fb9ef8d8fda89cf82b3f45721a282c088
      BASE_SHA: 3888cae643ce2fe01177ab595a8e4c1bcb8b2da2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 92465f04167df29d33474b69b15559491df751c1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Reproduce and resolve only the changelog conflict
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          source, master, base = (os.environ[key] for key in ('SOURCE_SHA', 'MASTER_SHA', 'BASE_SHA'))
          assert git('rev-parse', os.environ['GITHUB_SHA'] + '^').decode().strip() == source, 'Unexpected concurrent branch change'
          assert git('merge-base', source, master).decode().strip() == base
          subprocess.run(['git', 'config', 'user.name', git('show', '-s', '--format=%an', source).decode().strip()], check=True)
          subprocess.run(['git', 'config', 'user.email', git('show', '-s', '--format=%ae', source).decode().strip()], check=True)
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', master])
          conflicts = git('diff', '--name-only', '--diff-filter=U').decode().splitlines()
          assert result.returncode == 1 and conflicts == ['docs/AI-CHANGELOG.md'], (result.returncode, conflicts)
          print('Reproduced: only docs/AI-CHANGELOG.md conflicts.')
          path = 'docs/AI-CHANGELOG.md'
          original, ours, theirs = (git('show', ref + ':' + path) for ref in (base, source, master))
          header = original.split(b'\n\n', 1)[0] + b'\n\n'
          old_body = original[len(header):]
          assert ours.startswith(header) and theirs.startswith(header)
          assert theirs.endswith(old_body), 'Upstream changed existing entries; manual review required'
          added = theirs[len(header):len(theirs) - len(old_body)]
          assert added and added not in ours
          entry = '''## 2026-09-29 – Juna – Dashboard-Mergekonflikt im Änderungsprotokoll aufgelöst

          **Auftrag:** Den erneut gemeldeten Konflikt in PR #248 beheben, ohne das freigegebene Dashboard-Design zu verändern.

          **Änderung:** Den aktuellen master-Stand übernommen und die parallel ergänzten Dashboard- und Landingpage-Einträge vollständig erhalten. Der Konflikt betrifft ausschließlich das gemeinsame Änderungsprotokoll; die Landingpage und ihr Vertragstest entsprechen unverändert master. Dashboard, Theme, Plattformassets und Navigation bleiben unverändert gegenüber der freigegebenen Vorschau.

          **Prüfung:** Der Zusammenführungsversuch reproduziert ausschließlich den Konflikt im Änderungsprotokoll. Ein vollständiger Dateiabgleich und der Vergleich aller bisherigen Protokollabschnitte sichern den Erhalt beider Seiten. Gezielte Tests sowie die reguläre PR-CI prüfen den integrierten Stand vor einem Merge.

          '''.encode('utf-8')
          merged = header + entry + added + ours[len(header):]
          def sections(data):
              return collections.Counter(re.split(rb'(?m)(?=^## )', data)[1:])
          expected = sections(ours) | sections(theirs)
          actual = sections(merged)
          assert all(actual[section] == count for section, count in expected.items()), 'An existing section was changed or duplicated'
          assert not re.search(rb'(?m)^(<<<<<<< |=======\s*$|>>>>>>> )', merged)
          pathlib.Path(path).write_bytes(merged)
          subprocess.run(['git', 'add', path], check=True)
          assert not git('ls-files', '-u')
          changed = git('diff', '--cached', '--name-only', source).decode().splitlines()
          assert set(changed) == {path, 'landing/index.html', 'scripts/landing-page.test.mjs'}, changed
          for filename in ('landing/index.html', 'scripts/landing-page.test.mjs'):
              assert git('show', ':' + filename) == git('show', master + ':' + filename)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('PASS: both changelog histories preserved; all dashboard/application files unchanged; upstream landing files exact.')
          PY
      - run: npm ci
      - name: Check formatting and focused lint
        run: |
          npx prettier --check docs/AI-CHANGELOG.md landing/index.html scripts/landing-page.test.mjs
          npx eslint scripts/landing-page.test.mjs
      - name: Run landing and dashboard regression tests
        run: |
          npm run test:landing
          npm run test:angular -- src/app/features/dashboard/dashboard.component.angular.spec.ts
          npm run typecheck
          node scripts/check-admin-shared-ui.mjs
      - name: Prepare verified objects without changing commits or branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert not git('diff', '--name-only'), 'Tracked files changed during validation'
          path = 'docs/AI-CHANGELOG.md'
          data = pathlib.Path(path).read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          request = urllib.request.Request(
              'https://api.github.com/repos/GrischaTDev/flipbase/git/blobs',
              method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == sha
          manifest = {
              'source': os.environ['SOURCE_SHA'],
              'master': os.environ['MASTER_SHA'],
              'workflow_commit': os.environ['GITHUB_SHA'],
              'base_tree': git('rev-parse', os.environ['SOURCE_SHA'] + '^{tree}'),
              'expected_tree': git('write-tree'),
              'files': [{'path': filename, 'mode': '100644', 'type': 'blob', 'sha': git('rev-parse', ':' + filename)} for filename in (path, 'landing/index.html', 'scripts/landing-page.test.mjs')],
          }
          pathlib.Path('/tmp/dashboard-conflict-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('MERGE_MANIFEST=' + json.dumps(manifest))
          print('Validation passed. Prepared one changelog blob; no commits or branch updates performed.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-conflict-manifest
          path: /tmp/dashboard-conflict-manifest.json
          retention-days: 1
