name: Temporary workspace delete formatter

on:
  push:
    branches:
      - fix/workspace-delete-flow
    paths:
      - .github/workflows/format-workspace-delete-temp.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/workspace-delete-flow

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/app/features/settings/pages/data-and-audit/data-and-audit.component.html \
            src/app/features/settings/pages/data-and-audit/data-and-audit.component.spec.ts \
            src/app/features/settings/pages/data-and-audit/data-and-audit.component.ts \
            src/app/features/settings/pages/settings-behavior.angular.spec.ts \
            src/app/features/settings/pages/workspace-settings/workspace-settings.component.ts

      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/format-workspace-delete-temp.yml
          git config user.name "Grischa Tänzer"
          git config user.email "Grischa.Taenzer@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ui): format workspace deletion changes"
          git push origin HEAD:fix/workspace-delete-flow
