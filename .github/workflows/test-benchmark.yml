name: Test runner benchmark

on:
  # Einmalige, im Chat freigegebene Messung bei Eröffnung dieses Optimierungs-PRs.
  # Keine Wiederholung bei weiteren Pushes; andere Branches starten keinen Job.
  pull_request:
    types: [opened]
    branches: [master]
    paths: ['.github/workflows/test-benchmark.yml']
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Einzelvergleich oder ausdrücklich der vollständige Runnervergleich'
        type: choice
        default: browser-cache
        options:
          - browser-cache
          - angular-imports
          - angular-runners
      order:
        description: 'Reihenfolge im Cache-Vergleich'
        type: choice
        default: baseline-first
        options:
          - baseline-first
          - candidate-first

permissions:
  contents: read

# Nur Diagnose: kein Deployment und keine Schreibrechte auf Repository oder Pakete.
concurrency:
  group: test-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.experiment != 'angular-runners') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'perf/ci-cache-measurement-20260916' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPERIMENT: ${{ inputs.experiment || 'browser-cache' }}
      CACHE_BENCHMARK_ORDER: ${{ inputs.order || 'baseline-first' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Test measurement and report validation
        run: node --test scripts/ci-performance.test.mjs
      - run: npm ci
      - name: Install Chromium only for the browser comparison
        if: ${{ env.EXPERIMENT == 'browser-cache' }}
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run bounded performance experiment
        run: node scripts/ci-performance.mjs "$EXPERIMENT" "$RUNNER_TEMP/ci-performance"
      - name: Retain measurements and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-performance/
          retention-days: 3
          if-no-files-found: ignore

  # Der bisherige Sechs-Job-Vergleich bleibt unverändert, aber nur nach bewusster Auswahl.
  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment == 'angular-runners' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [angular-builder, angular-fallback]
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run test suite and record result
        run: |
          started_at=$(date +%s)
          set +e
          npm run test:${{ matrix.runner }}
          exit_code=$?
          elapsed_seconds=$(( $(date +%s) - started_at ))
          {
            echo "### Test runner benchmark"
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Sample: \`${{ matrix.sample }}\`"
            echo "- Duration: \`${elapsed_seconds}s\`"
            echo "- Result: \`$( [ "$exit_code" -eq 0 ] && echo passed || echo failed )\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
