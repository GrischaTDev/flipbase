name: Test runner benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [angular-builder, angular-fallback]
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run test suite and record result
        run: |
          started_at=$(date +%s)
          set +e
          npm run test:${{ matrix.runner }}
          exit_code=$?
          elapsed_seconds=$(( $(date +%s) - started_at ))
          {
            echo "### Test runner benchmark"
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Sample: \`${{ matrix.sample }}\`"
            echo "- Duration: \`${elapsed_seconds}s\`"
            echo "- Result: \`$( [ "$exit_code" -eq 0 ] && echo passed || echo failed )\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
