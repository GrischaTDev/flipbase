name: Label isolated test tools

on:
  push:
    branches: ['juna/brand-labels']
    paths: ['.github/workflows/brand-label-test-tools.yml']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Install local test database binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-pgtap
      - name: Prepare explicitly selected test tools
        run: |
          root="$RUNNER_TEMP/label-test-tools"
          mkdir -p "$root/pg17/bin" "$root/pg17/lib" "$root/pg17/share" "$root/lib" "$root/bin"
          cp -a /usr/lib/postgresql/17/bin/. "$root/pg17/bin/"
          cp -a /usr/lib/postgresql/17/lib/. "$root/pg17/lib/"
          cp -a /usr/share/postgresql/17/. "$root/pg17/share/"
          for binary in /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so; do
            ldd "$binary" 2>/dev/null | awk '/=> \// {print $3}' || true
          done | sort -u | while IFS= read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*) continue ;;
            esac
            cp -L "$library" "$root/lib/"
          done
          cp "$(command -v deno)" "$root/bin/deno"
          cp "$(command -v node)" "$root/bin/node"
          npm install --prefix "$root/media" --ignore-scripts --save-exact @imagemagick/magick-wasm@0.0.42
          /usr/lib/postgresql/17/bin/postgres --version > "$root/versions.txt"
          deno --version >> "$root/versions.txt"
          node --version >> "$root/versions.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/label-test-tools.tar.gz" label-test-tools
      - name: Upload disposable test tools only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-test-tools
          path: ${{ runner.temp }}/label-test-tools.tar.gz
          retention-days: 1
          if-no-files-found: error
