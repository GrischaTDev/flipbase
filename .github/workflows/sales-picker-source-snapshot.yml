name: Temporary sales picker source snapshot

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/sales-picker-source-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'juna/sales-variant-picker-table'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export tracked source and installed development tools
        shell: bash
        run: |
          git archive HEAD -o "$RUNNER_TEMP/sales-picker-source.tar"
          tar -rf "$RUNNER_TEMP/sales-picker-source.tar" node_modules
          mkdir -p "$RUNNER_TEMP/sales-picker-node"
          cp "$(command -v node)" "$RUNNER_TEMP/sales-picker-node/node"
          tar -rf "$RUNNER_TEMP/sales-picker-source.tar" -C "$RUNNER_TEMP" sales-picker-node
          gzip "$RUNNER_TEMP/sales-picker-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sales-picker-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/sales-picker-source.tar.gz
          retention-days: 1
          if-no-files-found: error
