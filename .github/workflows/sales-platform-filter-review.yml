name: Sales platform filter review

on:
  push:
    branches: ['juna/shared-sales-platforms']

permissions:
  contents: read

jobs:
  sales-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files for transfer
        run: >
          npx prettier --write
          src/app/features/sales/sales.component.ts
          src/app/features/sales/sales.component.html
          src/app/features/sales/sales-deep-link.angular.spec.ts
          src/app/features/dashboard/models/dashboard-overview.ts
          src/app/features/dashboard/models/dashboard-platform.ts
          src/app/shared/models/marketplace-platform.ts
          src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.ts
          src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.html
          docs/AI-CHANGELOG.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-sales-platform-files
          path: |
            src/app/features/sales/sales.component.ts
            src/app/features/sales/sales.component.html
            src/app/features/sales/sales-deep-link.angular.spec.ts
            src/app/features/dashboard/models/dashboard-overview.ts
            src/app/features/dashboard/models/dashboard-platform.ts
            src/app/shared/models/marketplace-platform.ts
            src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.ts
            src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.html
            docs/AI-CHANGELOG.md
          retention-days: 1
      - name: Check changed file formatting
        run: >
          npx prettier --check
          src/app/features/sales/sales.component.ts
          src/app/features/sales/sales.component.html
          src/app/features/sales/sales-deep-link.angular.spec.ts
          src/app/features/dashboard/models/dashboard-overview.ts
          src/app/features/dashboard/models/dashboard-platform.ts
          src/app/shared/models/marketplace-platform.ts
          src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.ts
          src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.html
          docs/AI-CHANGELOG.md
      - name: Lint changed TypeScript
        run: >
          npx eslint
          src/app/features/sales/sales.component.ts
          src/app/features/sales/sales-deep-link.angular.spec.ts
          src/app/features/dashboard/models/dashboard-overview.ts
          src/app/features/dashboard/models/dashboard-platform.ts
          src/app/shared/models/marketplace-platform.ts
          src/app/shared/components/marketplace-platform-identity/marketplace-platform-identity.component.ts
      - name: Check types
        run: npm run typecheck
      - name: Run focused Angular regressions
        run: >
          npm run test:angular --
          src/app/features/sales/sales-deep-link.angular.spec.ts
          src/app/features/dashboard/dashboard.component.angular.spec.ts
      - name: Run application test suites
        run: npm test
      - name: Check shared UI contract
        run: node scripts/check-admin-shared-ui.mjs
      - name: Build production application
        run: npm run build
