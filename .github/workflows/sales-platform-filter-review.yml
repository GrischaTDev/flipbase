name: Sales platform filter review

on:
  push:
    branches: ['juna/shared-sales-platforms']

permissions:
  contents: read

jobs:
  sales-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run sales platform regression
        run: npm run test:angular -- src/app/features/sales/sales-deep-link.angular.spec.ts
