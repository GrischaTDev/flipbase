name: Vinted search filter final check

on:
  push:
    branches: [juna/vinted-central-search-filters]

permissions:
  contents: write
  actions: read

concurrency:
  group: vinted-central-search-filters-check
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'GrischaTDev/flipbase' && github.ref == 'refs/heads/juna/vinted-central-search-filters'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NG_BUILD_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare the verified feature on current master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/vinted-integration-review
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/GrischaTDev/flipbase/actions/artifacts/11371194246/zip \
            -o /tmp/vinted-integration-review/generator.zip
          python3 tools/vinted-search-filter-followup.py > /tmp/vinted-integration-review/preparation.log 2>&1
          git write-tree > /tmp/vinted-integration-review/prepared-tree.txt
      - name: Install locked dependencies
        run: |
          npm ci > /tmp/vinted-integration-review/install.log 2>&1
          npm ci --prefix services/sniper >> /tmp/vinted-integration-review/install.log 2>&1
      - name: Formatting, lint, types and workflow contracts
        run: |
          npm run format:check > /tmp/vinted-integration-review/format.log 2>&1
          npm run lint > /tmp/vinted-integration-review/lint.log 2>&1
          npm run typecheck > /tmp/vinted-integration-review/types.log 2>&1
          npm run typecheck --prefix services/sniper > /tmp/vinted-integration-review/collector-types.log 2>&1
          npm run test:audit > /tmp/vinted-integration-review/audit.log 2>&1
          npm run test:workflow > /tmp/vinted-integration-review/workflow-tests.log 2>&1
      - name: Production Angular build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build > /tmp/vinted-integration-review/build.log 2>&1
      - name: Start disposable database and verify generated types
        run: |
          npx supabase start > /tmp/vinted-integration-review/database-start.log 2>&1
          npx supabase migration up --local > /tmp/vinted-integration-review/migration.log 2>&1
          npx supabase gen types typescript --local > /tmp/vinted-integration-review/supabase.types.ts
          diff -u src/app/core/models/supabase.types.ts /tmp/vinted-integration-review/supabase.types.ts > /tmp/vinted-integration-review/types-diff.log
      - name: Desktop and mobile keyboard regression twice without retries
        run: |
          npx playwright install --with-deps chromium > /tmp/vinted-integration-review/browser-install.log 2>&1
          npx playwright test e2e/sniper-administration.spec.ts --workers=1 --retries=0 --repeat-each=2 --timeout=90000 > /tmp/vinted-integration-review/browser-tests.log 2>&1
      - name: All collector tests
        run: npm test --prefix services/sniper > /tmp/vinted-integration-review/collector-tests.log 2>&1
      - name: Full database regression suite
        run: npm run test:db > /tmp/vinted-integration-review/database-tests.log 2>&1
      - name: All application tests
        run: npx vitest run --maxWorkers=4 > /tmp/vinted-integration-review/application-tests.log 2>&1
      - name: Record evidence and commit only the verified feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/juna/vinted-central-search-filters
          test "$(git ls-remote origin refs/heads/juna/vinted-central-search-filters | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$(cat /tmp/vinted-integration-review/merged-master.txt)"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          review = pathlib.Path('/tmp/vinted-integration-review')
          def count(name, pattern):
              text = re.sub(r'\x1b\[[0-9;]*m', '', (review / name).read_text())
              matches = re.findall(pattern, text)
              assert matches, name
              return matches[-1]
          counts = {
              'application': count('application-tests.log', r'Tests\s+(\d+)\s+passed'),
              'collector': count('collector-tests.log', r'Tests\s+(\d+)\s+passed'),
              'database': count('database-tests.log', r'Files=\d+, Tests=(\d+)'),
              'browser': count('browser-tests.log', r'(\d+) passed'),
              'workflow': count('workflow-tests.log', r'# pass (\d+)'),
              'workflow_skipped': count('workflow-tests.log', r'# skipped (\d+)'),
          }
          evidence = (
              f"**Abschlussprüfung vom 06.10.2026:** Lauf `{os.environ['GITHUB_RUN_ID']}`: "
              f"{counts['application']} Anwendungstests, {counts['collector']} Collector-Tests, "
              f"{counts['database']} Datenbankassertions und {counts['browser']} Browserabläufe "
              "bestanden. Desktop hell und Mobil dunkel jeweils zweimal ohne Wiederholungsversuch; "
              "Enter zum Zurücksetzen, Tab/Shift+Tab, Escape, Fokuswiederherstellung und AXE enthalten. "
              f"{counts['workflow']} Workflow-Tests bestanden; {counts['workflow_skipped']} "
              "vorhandener optionaler Umgebungsfall übersprungen. Produktionsbau, Formatierung, "
              "Lint und Typprüfungen erfolgreich. Generierte Datenbanktypen stimmen exakt. "
              "Aktuelles master einschließlich PR 306 und 307 integriert. Temporäre Transportdateien "
              "und Prüfworkflow sind entfernt. Kein PR, kein Merge nach master und keine "
              "Produktionsänderung; Abschlussfreigabe steht noch aus.\n\n"
          )
          file = pathlib.Path('docs/AI-CHANGELOG.md')
          text = file.read_text()
          marker = '**Stand:** Eigener Zweig `juna/vinted-central-search-filters`.'
          assert text.count(marker) == 1
          file.write_text(text.replace(marker, evidence + marker, 1))
          plan = pathlib.Path('docs/superpowers/plans/2026-10-05-vinted-search-filter-progress.md')
          plan.write_text(plan.read_text() + '\n## Abschlussprüfung\n\n' + evidence)
          subprocess.run(['node', 'node_modules/prettier/bin/prettier.cjs', '--write', str(file), str(plan)], check=True)
          paths = json.loads((review / 'product-paths.json').read_text())
          upstream = json.loads((review / 'upstream-paths.json').read_text())
          temporary = json.loads((review / 'temporary-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *sorted(set(paths + upstream))], check=True)
          master = (review / 'merged-master.txt').read_text().strip()
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', master], text=True).splitlines()
          assert set(changed) <= set(paths + temporary)
          assert not any(pathlib.Path(path).exists() for path in temporary)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          (review / 'counts.json').write_text(json.dumps(counts, indent=2))
          PY
          git config user.name 'Grischa Tänzer'
          git config user.email 'Grischa.Taenzer@gmail.com'
          tree="$(git write-tree)"
          master="$(cat /tmp/vinted-integration-review/merged-master.txt)"
          commit="$(git commit-tree "$tree" -p "$GITHUB_SHA" -p "$master" -m 'feat(sniper): integrate verified central category brand and title filters')"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "$commit":refs/heads/juna/vinted-central-search-filters
          printf '%s\n' "$commit" > /tmp/vinted-integration-review/verified-commit.txt
          git archive "$commit" | gzip > /tmp/vinted-integration-review/verified-source.tar.gz
      - name: Collect diagnostics
        if: always()
        run: |
          for name in preparation format lint types collector-types workflow-tests build types-diff browser-tests collector-tests database-tests application-tests; do
            file="/tmp/vinted-integration-review/$name.log"
            if test -f "$file"; then echo "=== $name ==="; tail -n 35 "$file"; fi
          done
          git diff --binary HEAD > /tmp/vinted-integration-review/integration.patch
          git rev-parse HEAD > /tmp/vinted-integration-review/revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vinted-search-filter-followup-review
          path: |
            /tmp/vinted-integration-review/
            test-results/
          retention-days: 3
      - name: Stop disposable database
        if: always()
        run: npx --no-install supabase stop --no-backup
