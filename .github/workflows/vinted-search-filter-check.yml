name: Vinted search filter development check

on:
  push:
    branches: [juna/vinted-central-search-filters]

permissions:
  contents: read

concurrency:
  group: vinted-central-search-filters-check
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Validate the scoped schema patch
        run: |
          mkdir -p /tmp/vinted-schema-review
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('tools/vinted-search-filter-schema-transfer.json').read_text())
          allowed = ['supabase/config.toml', 'supabase/schemas/50_sniper.sql', 'supabase/schemas/105_sniper_administration.sql', 'supabase/schemas/108_sniper_search_filters.sql', 'supabase/tests/sniper_search_filters.sql']
          assert sorted(manifest['paths']) == sorted(allowed)
          assert manifest['base_commit'] == '147a8c7c72bf9eff6e190da5263a80adf5c0ab12'
          subprocess.run(['git', 'merge-base', '--is-ancestor', manifest['base_commit'], 'HEAD'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', manifest['base_commit'], 'HEAD', '--', *allowed], check=True)
          patch = gzip.decompress(base64.b64decode(manifest['patch_gzip_base64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == manifest['sha256'] == '8799360cadf657708d56720fa8b7c3e3fa96576b090e0aeec458dd95721ab7aa'
          path = pathlib.Path('/tmp/vinted-schema-review/schema.patch')
          path.write_bytes(patch)
          entries = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines()
          assert sorted(line.split('\t', 2)[2] for line in entries) == sorted(allowed)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          PY
      - name: Install locked dependencies and inspect CLI
        run: |
          npm ci
          npx supabase --version
          npx supabase db diff --help
          npx supabase migration up --help
          npx supabase gen types --help
      - name: Capture pre-existing declarative drift in a disposable baseline
        run: |
          npx supabase db diff -f vinted_generation_baseline --schema public,storage > /tmp/vinted-schema-review/baseline-generation.log 2>&1
          find supabase/migrations -maxdepth 1 -name '*_vinted_generation_baseline.sql' -exec cp {} /tmp/vinted-schema-review/ \;
      - name: Generate only the new filter changes
        run: |
          git apply /tmp/vinted-schema-review/schema.patch
          npx supabase db diff -f vinted_central_search_filters --schema public,storage > /tmp/vinted-schema-review/generation.log 2>&1
          find supabase/migrations -maxdepth 1 -name '*_vinted_central_search_filters.sql' -exec cp {} /tmp/vinted-schema-review/ \;
          find supabase/migrations -maxdepth 1 -name '*_vinted_generation_baseline.sql' -delete
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('supabase/migrations').glob('*_vinted_central_search_filters.sql'))
          assert len(files) == 1
          text = files[0].read_text()
          for excluded in ['public.marketplace_', 'public.purchase_', 'public.catalog_product_', 'public.expense_', 'public.listing_images', 'public.beta_discord_links']:
              assert excluded not in text, f'Unrelated schema drift: {excluded}'
          PY
      - name: Start disposable database with only the real feature migration
        run: npx supabase start > /tmp/vinted-schema-review/start.log 2>&1
      - name: Apply generated migration
        run: npx supabase migration up --local > /tmp/vinted-schema-review/migration.log 2>&1
      - name: Generate actual database types
        run: npx supabase gen types typescript --local > /tmp/vinted-schema-review/supabase.types.ts
      - name: Run database regression suite
        run: npm run test:db > /tmp/vinted-schema-review/database-tests.log 2>&1
      - name: Print diagnostics
        if: ${{ always() }}
        run: |
          for file in /tmp/vinted-schema-review/*.log; do
            echo "=== $file ==="
            tail -n 80 "$file"
          done
          git rev-parse HEAD > /tmp/vinted-schema-review/revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: vinted-search-filter-database-review
          path: /tmp/vinted-schema-review/
          retention-days: 1
      - name: Stop disposable database
        if: ${{ always() }}
        run: npx supabase stop --no-backup
