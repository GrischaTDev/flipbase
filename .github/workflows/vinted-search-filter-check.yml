name: Vinted search filter development check

on:
  push:
    branches: [juna/vinted-central-search-filters]

permissions:
  contents: read

concurrency:
  group: vinted-central-search-filters-check
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install locked collector dependencies
        run: npm ci --prefix services/sniper
      - name: Prepare isolated source and dependency archive
        run: |
          mkdir -p /tmp/vinted-search-filter-workspace
          git archive --format=tar.gz HEAD > /tmp/vinted-search-filter-workspace/source.tar.gz
          tar -czf /tmp/vinted-search-filter-workspace/dependencies.tar.gz node_modules services/sniper/node_modules
          gzip -c "$(command -v node)" > /tmp/vinted-search-filter-workspace/node.gz
          git rev-parse HEAD > /tmp/vinted-search-filter-workspace/revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vinted-search-filter-workspace
          path: /tmp/vinted-search-filter-workspace/
          retention-days: 1
          compression-level: 0
      - name: Existing collector baseline
        working-directory: services/sniper
        run: npx vitest run test/vinted/collector.spec.ts
      - name: New collector regression tests
        working-directory: services/sniper
        run: npx vitest run test/vinted/central-search-filters.spec.ts
      - name: New filter model regression tests
        if: ${{ !cancelled() }}
        run: npx vitest run --project=node src/app/features/platform-admin/models/central-search-filter.spec.ts
