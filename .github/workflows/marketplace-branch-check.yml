name: Marketplace branch checks

on:
  push:
    branches: ['juna/vinted-marketplace-foundation']

permissions:
  contents: read

concurrency:
  group: marketplace-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Nur versionierte Dateien, keine Zugangsdaten oder lokalen Laufzeitdateien.
      - name: Archive source for isolated review
        run: |
          mkdir -p /tmp/marketplace-review
          git archive --format=tar.gz HEAD > /tmp/marketplace-review/source.tar.gz
          git rev-parse HEAD > /tmp/marketplace-review/source-commit.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Marketplace contracts
        run: node --experimental-strip-types --test supabase/functions/_shared/marketplace-*.test.ts

      - name: Type check
        run: npm run typecheck

      - name: Angular production build
        run: npm run build

      - name: Upload review snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marketplace-review-${{ github.sha }}
          path: /tmp/marketplace-review/
          if-no-files-found: error
          retention-days: 3
