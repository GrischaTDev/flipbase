name: Temporary verified sales picker integration

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/sales-picker-integration-prepare.yml
      - docs/implementation/.pr270-*.transfer

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'GrischaTDev/flipbase' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'juna/sales-variant-picker-table'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate complete file tree and prepare commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import urllib.request

          repo = 'GrischaTDev/flipbase'
          branch = 'juna/sales-variant-picker-table'
          base = 'eee3cf3cf304ed1bd9f87b294dcebbd89f60c568'
          expected_tree = '96feb99c14565a00aa2657eb0c98ec82e90689f5'
          expected_patch = 'c0eaaa84acc51f5c7701800434c970fcf86745db52989c5b181f63710d209375'
          head = os.environ['PREPARATION_SHA']

          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()

          def api(method, path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          assert git('rev-parse', 'HEAD') == head, 'Unexpected checkout'
          assert git('rev-parse', 'HEAD^') == base, 'Unexpected source parent'
          assert api('GET', '/git/ref/heads/' + branch)['object']['sha'] == head, 'Branch changed'
          chunks = [pathlib.Path('docs/implementation/.pr270-' + str(i) + '.transfer') for i in range(5)]
          encoded = ''.join(path.read_text().strip() for path in chunks)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == expected_patch, 'Patch integrity mismatch'
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-sales-picker.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'rm', '--', *(str(path) for path in chunks), '.github/workflows/sales-picker-integration-prepare.yml'], check=True)
          tree = git('write-tree')
          assert tree == expected_tree, 'Complete source tree differs from checked local integration'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z', 'HEAD']).decode().split('\0')
          entries = []
          for name in filter(None, names):
              path = pathlib.Path(name)
              entry = {'path': name, 'mode': '100644', 'type': 'blob'}
              if path.exists():
                  entry['content'] = path.read_text()
              else:
                  entry['sha'] = None
              entries.append(entry)
          prepared_tree = api('POST', '/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert prepared_tree['sha'] == expected_tree, 'Published tree differs'
          author = {'name': 'Grischa Tänzer', 'email': 'Grischa.Taenzer@gmail.com'}
          commit = api('POST', '/git/commits', {
              'message': 'feat(sales): integrate shared variant picker and sales table\n\nConnect the existing entry forms and table to the shared picker and labels. Preserve concrete variant identities and validate stock selection across all loaded purchases. Add Angular and browser regressions without changing inventory or financial calculations.',
              'tree': expected_tree,
              'parents': [head],
              'author': author,
              'committer': author,
          })
          print(json.dumps({'prepared_commit': commit['sha'], 'parent': head, 'tree': expected_tree}, indent=2))
          print('No branch or pull request was changed by this preparation job.')
          PY
