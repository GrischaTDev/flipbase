name: Dashboard layout review snapshot

on:
  push:
    branches: ['feat/dashboard-modern-rework']
    paths: ['.github/workflows/dashboard-layout-review.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3888cae643ce2fe01177ab595a8e4c1bcb8b2da2
          persist-credentials: false
      - name: Package the integration base without credentials or dependencies
        run: git archive --format=tar.gz --output=/tmp/dashboard-layout-master.tgz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-layout-master
          path: /tmp/dashboard-layout-master.tgz
          retention-days: 1
