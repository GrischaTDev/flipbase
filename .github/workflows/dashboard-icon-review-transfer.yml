name: Dashboard icon review transfer

on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-icon-review-transfer.yml'

permissions:
  contents: read

jobs:
  prepare-objects:
    if: github.event.pull_request.number == 248 && github.event.pull_request.head.ref == 'feat/dashboard-modern-rework' && github.event.pull_request.head.repo.full_name == 'GrischaTDev/flipbase'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 715247dded23e6f8f58b80c2bce8dc72dc655970
          persist-credentials: false
      - name: Prepare verified Git blobs without changing branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          endpoint = 'https://api.github.com/repos/GrischaTDev/flipbase/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          chunks = ['ad9c9e7cb9ccda9fa96fbbc59b7028b1fa79d7ed', 'ea4ce9d87b3b761bcf0ee7a75fad270aabdb2deb', '39f096777a6785e3b32b7e5d24a261170efa59ed', '69fabc42ccfd483520c3184e69e7e9414e40d48a']
          encoded = ''
          for sha in chunks:
              request = urllib.request.Request(endpoint + '/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  chunk = json.load(response)
              assert chunk['sha'] == sha
              encoded += base64.b64decode(chunk['content']).decode('ascii')
          assert len(encoded) == 9248
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a9cd18df1a8048aaa0658d287a638ad99c7064114b67763c8910a9b6ba84a405'
          payload = json.loads(raw)
          allowed = {'docs/AI-CHANGELOG.md', 'src/styles/flipbase-theme.css', 'src/app/features/dashboard/dashboard.component.ts', 'src/app/features/dashboard/dashboard.component.html', 'src/app/features/dashboard/dashboard.component.css', 'src/app/features/dashboard/dashboard.component.angular.spec.ts', 'src/app/features/dashboard/models/dashboard-platform.ts', 'public/images/platforms/README.md', 'public/images/platforms/ebay.svg', 'public/images/platforms/kleinanzeigen.svg', 'public/images/platforms/vinted.svg'}
          assert {entry['path'] for entry in payload['files']} == allowed
          assert len(payload['files']) == len(allowed)
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared = []
          for entry in payload['files']:
              path = pathlib.Path(entry['path'])
              if entry['previous_sha'] is None:
                  assert not path.exists(), str(path)
                  original = b''
              else:
                  original = path.read_bytes()
                  assert blob_sha(original) == entry['previous_sha'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(entry['edits']):
                  assert 0 <= edit['start'] <= edit['end'] <= len(lines)
                  lines[edit['start']:edit['end']] = [edit['text']]
              content = ''.join(lines).encode('utf-8')
              assert blob_sha(content) == entry['sha'], str(path)
              prepared.append((entry['path'], entry['sha'], content))
          manifest = []
          for path, expected_sha, content in prepared:
              request = urllib.request.Request(endpoint, method='POST', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode(), headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected_sha, path
              manifest.append({'path': path, 'sha': result['sha']})
          pathlib.Path('/tmp/dashboard-icon-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified and prepared', len(manifest), 'Git blobs. No branch changes performed.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-icon-manifest
          path: /tmp/dashboard-icon-manifest.json
          retention-days: 1
