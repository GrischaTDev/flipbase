name: Marketplace database preview

on:
  push:
    branches: ['juna/vinted-marketplace-foundation']
    paths:
      - '.github/workflows/marketplace-database-preview.yml'
      - 'scripts/marketplace-review-commit.mjs'
      - 'scripts/marketplace-database-preview.test.mjs'
      - 'scripts/marketplace-migration-permissions*.mjs'
      - 'supabase/schemas/250_marketplace_accounts.sql'
      - 'supabase/tests/marketplace-accounts.test.sql'
      - 'supabase/migrations/*marketplace_accounts*'

permissions:
  contents: read

concurrency:
  group: marketplace-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format review scripts and test migration permissions
        run: |
          npx prettier --write scripts/marketplace-migration-permissions*.mjs scripts/marketplace-review-commit.mjs
          node --test scripts/marketplace-migration-permissions.test.mjs scripts/marketplace-database-preview.test.mjs
      - name: Record revision and register schema
        run: |
          mkdir -p /tmp/marketplace-database
          git rev-parse HEAD > /tmp/marketplace-database/source-commit.txt
          node scripts/marketplace-review-commit.mjs register
      - name: Start disposable database
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor
      # Nur die Historie und dieses Feature vergleichen. Der vollständige
      # deklarative Stand kann unabhängige, noch nicht migrierte Änderungen enthalten.
      - name: Generate isolated marketplace migration
        if: ${{ hashFiles('supabase/migrations/*marketplace_accounts*') == '' }}
        run: |
          docker exec -i supabase_db_flipbase-supabase psql -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction < supabase/schemas/250_marketplace_accounts.sql
          npx supabase db diff --from migrations --to local --schema public > /tmp/marketplace-database/generated.sql
          test -s /tmp/marketplace-database/generated.sql
          npx supabase migration new marketplace_accounts
          shopt -s nullglob
          migrations=(supabase/migrations/*_marketplace_accounts.sql)
          test "${#migrations[@]}" -eq 1
          cp /tmp/marketplace-database/generated.sql "${migrations[0]}"
          node scripts/marketplace-migration-permissions.mjs
          find supabase/migrations -name '*marketplace_accounts*' -exec cp {} /tmp/marketplace-database/ \;
      - name: Verify migration replay
        run: npx supabase db reset --local
      - name: Marketplace database tests
        run: npx supabase test db supabase/tests/marketplace-accounts.test.sql
      - name: Database regression tests
        run: npm run test:db
      - name: Generate database types
        run: |
          npx supabase gen types typescript --local > src/app/core/models/supabase.types.ts
          cp src/app/core/models/supabase.types.ts /tmp/marketplace-database/supabase.types.ts
      - name: Prepare unattached review commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/marketplace-review-commit.mjs prepare
      - name: Stop disposable database
        if: ${{ always() }}
        run: npx supabase stop --no-backup
      - name: Upload reviewed migration and types
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marketplace-database-${{ github.sha }}
          path: /tmp/marketplace-database/
          retention-days: 3
