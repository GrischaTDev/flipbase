name: Purchase documents type preview

# Vorläufig: Lokal steht kein Docker zur Verfügung. Dieser Lauf wendet die
# Migrationen an, erzeugt die Supabase-Typen und führt die DB-Tests aus. Er wird
# vor dem Merge des Einkaufsumbaus wieder entfernt.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/purchase-documents-type-preview.yml'
      - 'supabase/**'

permissions:
  contents: read

concurrency:
  group: purchase-documents-type-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.head_ref == 'feat/purchase-documents' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nur der wegwerfbare Runner startet Container. Keine Zugangsdaten, keine
      # Produktionsdatenbank und kein Deployment. `supabase db diff` scheitert
      # derzeit an der Reihenfolge der vorhandenen Schemadateien; die Migration
      # liegt deshalb im Zweig und wird hier angewendet und geprüft.
      - name: Record revision
        run: |
          mkdir -p type-preview
          git rev-parse HEAD > type-preview/source-commit.txt
          npx supabase --version > type-preview/cli-version.txt

      - name: Apply migrations in isolated database
        run: npx supabase start

      - name: Generate database types
        run: npx supabase gen types typescript --local > type-preview/supabase.types.ts

      - name: Test database
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee type-preview/test-db.log

      - name: Stop isolated database
        if: ${{ always() }}
        run: npx supabase stop --no-backup

      - name: Upload review artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purchase-documents-type-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: type-preview/
          if-no-files-found: warn
          retention-days: 7
