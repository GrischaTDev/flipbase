name: Temporary formatting for unified data tables

on:
  push:
    branches:
      - feat/unified-data-table-system
    paths:
      - .github/workflows/format-unified-data-table-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/unified-data-table-system

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-09-18-unified-data-table-system.md \
            scripts/check-admin-shared-ui.test.mjs \
            src/app/core/config/table-defaults.config.ts \
            src/app/features/accounting/accounting.component.html \
            src/app/features/analytics/analytics.component.html \
            src/app/features/catalog/catalog.component.html \
            src/app/features/catalog/catalog.component.ts \
            src/app/features/dashboard/dashboard.component.html \
            src/app/features/expenses/expenses.component.html \
            src/app/features/expenses/expenses.component.ts \
            src/app/features/fulfillment/fulfillment.component.html \
            src/app/features/inventory/components/stock-position-list/stock-position-list.component.html \
            src/app/features/inventory/components/stock-position-list/stock-position-list.component.ts \
            src/app/features/inventory/inventory.component.html \
            src/app/features/platform-admin/pages/beta-applications/beta-applications.component.html \
            src/app/features/platform-admin/pages/sniper-queries/sniper-queries.component.html \
            src/app/features/purchases/components/purchase-detail-table/purchase-detail-table.component.html \
            src/app/features/purchases/components/purchase-line-editor/purchase-line-editor.component.html \
            src/app/features/purchases/purchases.component.html \
            src/app/features/sales/sales.component.html \
            src/app/features/sellers/sellers.component.html \
            src/app/features/settings/pages/data-and-audit/data-and-audit.component.html

      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/format-unified-data-table-temp.yml
          git config user.name "Grischa Tänzer"
          git config user.email "Grischa.Taenzer@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ui): format unified data table changes"
          git push origin HEAD:feat/unified-data-table-system
