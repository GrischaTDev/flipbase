name: Optional quality checks

# Keine täglichen oder wöchentlichen Wiederholungen. Nur den benötigten Check starten.
on:
  workflow_dispatch:
    inputs:
      check:
        description: 'Gezielte Zusatzprüfung'
        type: choice
        default: browser
        options: [browser, coverage, database]
      browser:
        description: 'Browser für die erweiterte Regression'
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]

permissions:
  contents: read

concurrency:
  group: optional-quality-${{ github.ref }}-${{ inputs.check }}-${{ inputs.browser }}
  cancel-in-progress: true

jobs:
  browser:
    name: Extended browser regression
    if: ${{ inputs.check == 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install selected browser
        run: |
          case "$BROWSER" in
            chromium) npx playwright install --with-deps --only-shell chromium ;;
            firefox|webkit) npx playwright install --with-deps "$BROWSER" ;;
            *) echo 'Unknown browser' >&2; exit 1 ;;
          esac
      - name: Run extended regression
        run: npm run test:e2e:nightly -- --project="$BROWSER"
      - name: Retain failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-browser-${{ inputs.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  coverage:
    name: Full coverage
    if: ${{ inputs.check == 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Retain coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 3

  database:
    name: Full local database checks
    if: ${{ inputs.check == 'database' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Run database tests and concurrent sale check
        shell: bash
        run: |
          npm run test:db 2>&1 | tee database-full.log
          pwsh -NoProfile -File supabase/test-support/manual/inventory_double_sale.ps1 2>&1 | tee -a database-full.log
      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx supabase stop --no-backup
      - name: Retain failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-database
          path: |
            database-full.log
            supabase/.temp/logs/
          if-no-files-found: ignore
          retention-days: 3
