name: Temporary expense formatter

on:
  push:
    branches:
      - feat/expenses-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/expenses-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format expense changes
        run: |
          npx prettier --write \
            "src/app/features/expenses/**/*.{ts,html}" \
            "src/app/core/models/expense*.ts" \
            "src/app/core/models/private-document.models*.ts" \
            "src/app/core/models/purchase-document.models.ts" \
            "src/app/core/services/expense*.ts" \
            "src/app/core/services/dashboard-report.service.ts" \
            "src/app/core/services/dashboard-report.service.spec.ts" \
            "src/app/core/utils/expense-*.ts" \
            "src/app/features/dashboard/dashboard.component.ts" \
            "src/app/features/dashboard/dashboard.component.html" \
            "src/app/features/dashboard/dashboard.component.angular.spec.ts" \
            "src/app/core/config/workspace-navigation.ts" \
            "src/app/core/config/workspace-navigation.spec.ts" \
            "src/app/core/i18n/translations.ts" \
            "src/app/core/i18n/translations.spec.ts" \
            "src/app/app.routes.ts"

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app
          git commit -m "style(expenses): format implementation"
          git push origin HEAD:feat/expenses-foundation
