name: Label database candidate

on:
  pull_request:
    branches: [master]
    paths:
      - 'supabase/test-support/brand-label-candidate/**'
      - 'src/app/features/brand-labels/**'
      - 'scripts/run-brand-label-database-tests*.mjs'
      - '.github/workflows/brand-label-candidate.yml'

permissions:
  contents: read

concurrency:
  group: label-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-candidate:
    name: Label SQL candidate (isolated PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runner safeguards
        run: node --test scripts/run-brand-label-database-tests.test.mjs
      - name: Test isolated database candidate
        run: node scripts/run-brand-label-database-tests.mjs

  label-modules:
    name: Label module integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test label modules with the project runner
        run: npx vitest run --project=node src/app/features/brand-labels
      - name: Check project types
        run: npm run typecheck
      - name: Check label lint
        run: npx eslint src/app/features/brand-labels
      - name: Show required formatting changes
        if: ${{ always() }}
        run: |
          npx --no-install prettier --write src/app/features/brand-labels
          git diff --exit-code -- src/app/features/brand-labels
