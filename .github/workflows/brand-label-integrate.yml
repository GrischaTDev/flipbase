name: Label branch integration

on:
  push:
    branches: ['juna/brand-labels']
    paths: ['handoff/brand-label-transfer/manifest.json']

permissions:
  contents: write

concurrency:
  group: label-branch-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ github.repository == 'GrischaTDev/flipbase' && github.ref == 'refs/heads/juna/brand-labels' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out only the authorized feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: juna/brand-labels
          fetch-depth: 0
      - name: Verify the local source transfer before applying it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          root=Path('handoff/brand-label-transfer')
          manifest=json.loads((root/'manifest.json').read_text())
          assert 1 <= manifest['parts'] <= 25
          assert 1 <= manifest['bytes'] <= 2000000
          assert manifest['encoding']=='xz-base64'
          subprocess.run(['git','merge-base','--is-ancestor',manifest['source'],'HEAD'],check=True)
          raw=base64.b64decode(''.join((root/f'part-{i:02d}.txt').read_text().strip() for i in range(1,manifest['parts']+1)),validate=True)
          decoder=lzma.LZMADecompressor(memlimit=67108864)
          patch=decoder.decompress(raw,max_length=2000001)
          assert decoder.eof and not decoder.unused_data
          assert len(patch)==manifest['bytes'] and hashlib.sha256(patch).hexdigest()==manifest['sha256']
          marker=root/'applied.sha256'
          if marker.exists():
              assert marker.read_text().strip()==manifest['sha256']
              raise SystemExit(0)
          target=Path('/tmp/brand-label-integration.patch');target.write_bytes(patch)
          rows=subprocess.check_output(['git','apply','--numstat','-z',str(target)]).decode().split('\0')
          prefixes=('src/app/features/brand-labels/','supabase/functions/brand-label-media/','supabase/test-support/brand-labels/','supabase/test-support/label-images/')
          exact={'docs/AI-CHANGELOG.md','docs/features/brand-labels.md','docs/superpowers/plans/2026-10-05-label-lexicon.md','docs/superpowers/specs/2026-10-05-label-lexicon-design.md','scripts/brand-label-migration-supplement.mjs','scripts/brand-label-migration-supplement.test.mjs','supabase/config.toml','supabase/tests/brand_label_library.test.sql'}
          exact.update('supabase/schemas/'+name for name in ['380_brand_labels.sql','381_brand_label_content.sql','382_brand_label_operations.sql','383_brand_label_catalog.sql','384_brand_label_media.sql'])
          for row in filter(None,rows):
              name=row.split('\t',2)[2]
              assert name in exact or name.startswith(prefixes),name
              assert '..' not in Path(name).parts
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          marker.write_text(manifest['sha256']+'\n')
          subprocess.run(['git','add',str(marker)],check=True)
          PY
      - name: Preserve the reviewed work on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Grischa Tänzer'
          git config user.email 'Grischa.Taenzer@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(core): integrate protected label library foundation'
            git push origin HEAD:juna/brand-labels
          fi
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Check transferred model and migration-generator behavior
        run: |
          npm run test:node -- src/app/features/brand-labels
          node --test scripts/brand-label-migration-supplement.test.mjs
      - name: Generate migration from declared schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/label-integration-review"
          npx supabase --version
          npx supabase db diff --help
          if ! find supabase/migrations -name '*_brand_label_library.sql' | grep -q .; then
            npx supabase db diff -f brand_label_library --schema public,storage
            node scripts/brand-label-migration-supplement.mjs
          fi
          find supabase/migrations -name '*_brand_label_library.sql' -exec cp {} "$RUNNER_TEMP/label-integration-review/" \;
      - name: Apply and test in the disposable local Supabase stack
        run: |
          npx supabase start -x studio,imgproxy,inbucket,logflare,vector
          npx supabase migration up --local
          npm run test:db
          npx supabase gen types typescript --local > src/app/core/models/supabase.types.ts
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Test media components without claiming runtime qualification
        run: deno test --no-config --node-modules-dir=none --allow-read supabase/functions/brand-label-media/
      - name: Check project types and production build
        run: |
          npm run typecheck
          npm run build -- --configuration production
      - name: Commit only generated migration and database types after passing checks
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/migrations/*_brand_label_library.sql src/app/core/models/supabase.types.ts
          if ! git diff --cached --quiet; then
            git commit -m 'build(core): add verified label migration and generated database types'
            git push origin HEAD:juna/brand-labels
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/label-integration-review/verified-commit.txt"
      - name: Stop the disposable stack
        if: ${{ always() }}
        run: npx supabase stop --no-backup
      - name: Upload migration review files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-integration-review
          path: ${{ runner.temp }}/label-integration-review/
          if-no-files-found: warn
          retention-days: 3
