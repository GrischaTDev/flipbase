name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pruefen:
    name: Bauen, testen, pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Hinweis: --legacy-peer-deps ist noetig, solange lucide-angular
      # mitinstalliert wird - dessen Peer-Bereich endet bei Angular 21,
      # das Projekt laeuft auf 22. Faellt mit Plan-Punkt 8.1 weg.
      - name: Abhaengigkeiten installieren
        run: npm ci --legacy-peer-deps

      - name: Formatierung pruefen
        run: npm run format:check

      - name: Statische Analyse
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build
