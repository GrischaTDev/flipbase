name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pruefen:
    name: Bauen, testen, pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Formatierung pruefen
        run: npm run format:check

      - name: Statische Analyse
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Bauen
        run: npm run build
