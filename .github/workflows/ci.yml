name: CI and Production Deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Two runs of the same ref must never overlap. Pull requests cancel the older
# run to save minutes. master does not: a cancelled run there could abort
# halfway through a deployment and leave the server in an unclear state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. The only job that needs more says so itself.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Hard-coded rather than derived from github.repository, because a registry
  # path has to be lowercase and the owner is spelled "GrischaTDev".
  IMAGE: ghcr.io/grischatdev/flipbase
  SNIPER_IMAGE: ghcr.io/grischatdev/flipbase-sniper
  DEPLOY_HOST: 168.119.246.33
  DEPLOY_USER: root
  DEPLOY_DIR: /opt/flipbase
  CONTAINER: flipbase-web

jobs:
  changes:
    name: Detect relevant changes
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # application bleibt die Release-Auswahl; application_tests steuert nur Prüfungen.
      application: ${{ steps.filter.outputs.application }}
      application_tests: ${{ steps.filter.outputs.application_tests }}
      supabase: ${{ steps.filter.outputs.supabase }}
      sniper: ${{ steps.filter.outputs.sniper }}
      tests_reused: ${{ steps.reuse.outputs.tests_reused }}
      receipt_name: ${{ steps.reuse.outputs.receipt_name }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration completeness before validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node scripts/check-migration-changes.mjs "$BASE_SHA" "$HEAD_SHA"
          node scripts/package-migrations.mjs supabase/migrations "$RUNNER_TEMP/release-migrations"

      - name: Detect application, database and service changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-supabase-changes.mjs

      - name: Reuse successful checks for the merged tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          APPLICATION_TESTS_CHANGED: ${{ steps.filter.outputs.application_tests }}
          SUPABASE_CHANGED: ${{ steps.filter.outputs.supabase }}
          SNIPER_CHANGED: ${{ steps.filter.outputs.sniper }}
        run: node scripts/reuse-pr-checks.mjs

  quality:
    name: Quality
    needs: changes
    if: ${{ needs.changes.outputs.tests_reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Vitest only strips types, it does not check them, and the application
      # build excludes the tests. Without this step type errors in test data
      # stay invisible.
      - name: Check types
        run: npm run typecheck

      # Prueft die Workflow-Dateien selbst: Syntax, ungueltige Ausdruecke,
      # kaputte Matrizen, unsichere Shell-Interpolation. Ersetzt rund 1200
      # Zeilen selbstgeschriebener YAML-Zusicherungen, die dasselbe Ziel
      # ungenauer und mit dauerndem Pflegeaufwand verfolgt haben.
      #
      # Fest auf eine Version genagelt und gegen die Pruefsumme der
      # Veroeffentlichung abgeglichen - ein Download ohne Abgleich waere hier
      # der einzige ungesicherte Schritt der ganzen Kette.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archiv="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archiv" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archiv}"
          echo "$ACTIONLINT_SHA256  $archiv" | sha256sum --check --strict
          tar -xzf "$archiv" actionlint
          ./actionlint -color

      - name: Test workflow contracts
        run: npm run test:workflow

      - name: Test migration transactions in isolated PostgreSQL
        if: ${{ needs.changes.outputs.supabase == 'true' }}
        run: |
          docker network create release-test
          trap 'docker rm -fv release-db >/dev/null 2>&1; docker network rm release-test >/dev/null' EXIT
          docker run -d --name release-db --network release-test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=flipbase_release_test postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec release-db pg_isready -U postgres -d flipbase_release_test; then break; fi
            sleep 1
          done
          docker run --rm --network release-test -v "$PWD:/work:ro" -w /work \
            -e PGHOST=release-db -e PGUSER=postgres -e PGPASSWORD=test -e PGDATABASE=flipbase_release_test \
            node:22-alpine sh -ec 'apk add --no-cache bash postgresql-client util-linux >/dev/null; node --test scripts/release-migrations.test.mjs'

      - name: Audit test suite classification
        run: npm run test:audit

      - name: Test landing page contract
        if: ${{ needs.changes.outputs.application_tests == 'true' }}
        run: npm run test:landing

      - name: Build
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.application_tests == 'true' }}
        run: npm run build

  unit:
    name: Unit ${{ matrix.suite }} ${{ matrix.shard }}
    if: ${{ needs.changes.outputs.application_tests == 'true' && needs.changes.outputs.tests_reused != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: node
            shard: 1/1
          - suite: dom
            shard: 1/1
          - suite: angular
            shard: 1/2
          - suite: angular
            shard: 2/2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm's pretest:node lifecycle protects the orchestrator contracts during
      # local runs. CI calls the shard-only script below, so these contracts run
      # exactly once instead of once per Node shard.
      - name: Test orchestrator contracts once
        if: matrix.suite == 'node'
        run: npm run test:orchestrator

      - name: Run test suite
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: |
          start=$SECONDS
          set +e
          if [ "$SUITE" = "node" ]; then
            npm run test:node:shard -- --shard="$SHARD"
          else
            npm run "test:$SUITE" -- --shard="$SHARD"
          fi
          status=$?
          set -e
          duration=$((SECONDS - start))
          echo "### $SUITE $SHARD" >> "$GITHUB_STEP_SUMMARY"
          echo "Dauer: ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  database:
    name: Database
    if: ${{ needs.changes.outputs.supabase == 'true' && needs.changes.outputs.tests_reused != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Test database
        run: npm run test:db

      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx supabase stop --no-backup

  sniper:
    name: Sniper service
    # Nur wenn sich der Dienst geaendert hat. Er liegt in einem eigenen
    # Paket mit eigenen Abhaengigkeiten; ihn bei jedem Frontend-Push
    # mitzubauen kostete rund zwei Minuten je Lauf fuer nichts.
    if: ${{ needs.changes.outputs.sniper == 'true' && needs.changes.outputs.tests_reused != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/sniper
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: services/sniper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      # Der Bau gehoert dazu, weil das Betriebsabbild dist/ startet: Node loest
      # './config.js' nicht auf config.ts auf, ein Tippfehler im Importpfad
      # faellt erst hier auf.
      - name: Build
        run: npm run build

      - name: Build and smoke test bot image
        run: |
          docker build --tag flipbase-sniper:ci .
          node scripts/smoke-image.mjs flipbase-sniper:ci

  browser-smoke:
    name: Browser smoke
    if: ${{ needs.changes.outputs.application_tests == 'true' && needs.changes.outputs.tests_reused != 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium Headless Shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Start local Supabase
        run: npx supabase start

      - name: Run browser smoke tests
        run: npm run test:e2e:pr

      - name: Upload browser failure artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx supabase stop --no-backup

  image:
    name: Publish image
    needs: changes
    if: ${{ github.event_name == 'push' && (needs.changes.outputs.application == 'true' || needs.changes.outputs.sniper == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      app_tag: ${{ steps.tag.outputs.value }}
      app_digest: ${{ steps.publish-app.outputs.digest }}
      sniper_tag: ${{ steps.tag.outputs.value }}
      sniper_digest: ${{ steps.publish-sniper.outputs.digest }}
      version: ${{ steps.gitversion.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool --version 6.*

      - name: Determine version
        id: gitversion
        run: |
          VERSION=$(dotnet-gitversion /config GitVersion.yml /showvariable MajorMinorPatch)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "GitVersion version: $VERSION"

      # Every build gets its own immutable tag. That tag is what makes a
      # rollback a one-liner instead of a rebuild.
      - name: Determine image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The environment file in the repository points at a local Supabase for
      # development. Until now the server overwrote it with the production
      # values right before building (prepare.sh). Since the image is built
      # here, that has to happen here - otherwise the deployed app would talk
      # to 127.0.0.1 and have no backend at all.
      #
      # The key is the publishable one that every visitor's browser downloads;
      # it is only safe because row level security is switched on. The service
      # role key must never end up in a frontend build.
      - name: Write the production environment file
        if: ${{ needs.changes.outputs.application == 'true' }}
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY is not set - refusing to build an image without a backend." >&2
            exit 1
          fi
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: 'https://api.flipbase.de',
            supabaseAnonKey: '$SUPABASE_ANON_KEY',
            /**
             * Demo mode without signing in. Shows local browser data only,
             * never server data. Switched off for the hosted app.
             */
            allowDemoMode: false,
            /**
             * Domain of the cookie that tells the landing page someone is
             * signed in. Holds no token - just a flag.
             */
            landingHintCookieDomain: '.flipbase.de',
            landingUrl: 'https://flipbase.de',
          };
          EOF

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        if: ${{ needs.changes.outputs.application == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Reicht den Stand ins Abbild: Im Container gibt es kein Git, die
          # Versionsanzeige haette sonst nur einen Platzhalter.
          build-args: |
            FLIPBASE_COMMIT=${{ github.sha }}
            FLIPBASE_COMMIT_DATE=${{ github.event.repository.updated_at }}
            FLIPBASE_VERSION=${{ steps.gitversion.outputs.value }}

      # Gleicher Produktionsbau vor dem Push: nur HTTP und statische Dateien,
      # keine Anmeldung oder Schreibzugriffe auf das Produktionsbackend.
      - name: Smoke test production image
        if: ${{ needs.changes.outputs.application == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker run -d --name release-smoke -p 127.0.0.1::80 "$IMAGE:$TAG"
          trap 'docker rm -f release-smoke >/dev/null' EXIT
          port=$(docker port release-smoke 80/tcp | cut -d: -f2)
          node scripts/verify-public-deployment.mjs --base-url "http://127.0.0.1:$port" --expected-commit "$GITHUB_SHA"
          docker exec release-smoke sh -ec '
            for pattern in "*.js" "*.css"; do
              files=$(find /usr/share/nginx/html -maxdepth 1 -name "$pattern" -type f)
              test -n "$files"
              for file in $files; do
                wget -q -O /dev/null "http://127.0.0.1/$(basename "$file")"
              done
            done
          '

      - name: Publish checked image
        id: publish-app
        if: ${{ needs.changes.outputs.application == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker push "$IMAGE:$TAG"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          digest=${reference##*@}
          [[ "$reference" == "$IMAGE@$digest" && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build Sniper image
        if: ${{ needs.changes.outputs.sniper == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/sniper
          file: services/sniper/Dockerfile
          load: true
          tags: ${{ env.SNIPER_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Sniper image
        if: ${{ needs.changes.outputs.sniper == 'true' }}
        run: node services/sniper/scripts/smoke-image.mjs "$SNIPER_IMAGE:${{ steps.tag.outputs.value }}"

      - name: Publish checked Sniper image
        id: publish-sniper
        if: ${{ needs.changes.outputs.sniper == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker push "$SNIPER_IMAGE:$TAG"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$SNIPER_IMAGE:$TAG")
          digest=${reference##*@}
          [[ "$reference" == "$SNIPER_IMAGE@$digest" && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, quality, unit, database, sniper, browser-smoke, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every selected check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_REUSED: ${{ needs.changes.outputs.tests_reused }}
          APPLICATION_CHANGED: ${{ needs.changes.outputs.application }}
          APPLICATION_TESTS_CHANGED: ${{ needs.changes.outputs.application_tests }}
          SUPABASE_CHANGED: ${{ needs.changes.outputs.supabase }}
          SNIPER_CHANGED: ${{ needs.changes.outputs.sniper }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          SNIPER_RESULT: ${{ needs.sniper.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: node scripts/required-checks.mjs

      # Erst nach erfolgreicher Sammelprüfung. Der Name bindet den Nachweis an
      # den unveränderten Git-Dateibaum und den tatsächlich geprüften Umfang.
      - name: Record successful PR checks
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.changes.outputs.receipt_name }}
          path: package.json
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: [changes, required-checks, image]
    if: ${{ github.event_name == 'push' && always() && (needs.changes.outputs.application == 'true' || needs.changes.outputs.sniper == 'true') && needs.required-checks.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read access to the package, so the server can be handed a token that is
    # valid only while this job runs. Nothing long-lived is stored there.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://app.flipbase.de
    # Deployments are serialised across all runs, not just per ref.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Der Auftrag braucht die Migrationsdateien fuer den Abgleich unten -
      # ohne Checkout laeuft das Suchmuster ins Leere und meldet "*.sql".
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Schema first: code whose columns do not exist yet must not ship.
      #
      # On 21.08.2026 a migration sat in the repository unapplied - the
      # application deploys itself, migrations do not, so they can simply be
      # forgotten. This compares the files in the repository against what the
      # database reports as applied and stops the deployment naming the
      # missing ones, instead of shipping code that writes to columns that are
      # not there.
      #
      # Applying them stays a deliberate act: letting every push loose on the
      # production schema is a different risk class than replacing a frontend.
      - name: Check that all migrations are applied
        if: ${{ vars.RELEASE_MIGRATIONS_V1 != 'true' }}
        run: |
          angewendet="$(ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" migrationen)"
          fehlend=""
          for datei in supabase/migrations/*.sql; do
            # Kein Treffer heisst: das Muster steht noch da. Dann gibt es nichts
            # zu pruefen - und keine erfundene Fehlermeldung.
            [ -e "$datei" ] || continue
            version="$(basename "$datei" | cut -d_ -f1)"
            if ! echo "$angewendet" | grep -qx "$version"; then
              fehlend="$fehlend $(basename "$datei")"
            fi
          done
          if [ -n "$fehlend" ]; then
            echo "::error::Nicht angewendete Migrationen - Deployment gestoppt"
            echo "Diese Migrationen liegen im Repository, sind aber nicht angewendet:"
            for f in $fehlend; do echo "  $f"; done
            echo ""
            echo "Serverbootstrap und geprueften Migrationsweg in deploy/RELEASE-PIPELINE.md beachten."
            echo "Der alte apply-migrations.sh fuehrt SQL und Historie nicht atomar aus."
            exit 1
          fi
          echo "Alle Migrationen angewendet."
      # Three deliberate choices here.
      #
      # The key cannot run anything but deploy/deploy.sh on the server: it is
      # pinned to that script in authorized_keys. What looks like a command
      # below is only the argument the script reads - it cannot open a shell.
      #
      # The registry token is this job's own, valid only while the job runs and
      # piped through stdin so it never shows up in the server's process list.
      # The script drops it again after pulling, so the production machine
      # holds no permanent registry credential that could leak or expire.
      #
      # The deployment names the immutable tag instead of "latest", so this run
      # ships exactly the image it built, even if another run pushes meanwhile.
      # The script also waits for the container to report healthy - a restarted
      # container is not yet a working one.
      - name: Deploy the image and wait for the container to be healthy
        env:
          APP_TAG: ${{ needs.image.outputs.app_tag }}
          APP_DIGEST: ${{ needs.image.outputs.app_digest }}
          SNIPER_TAG: ${{ needs.image.outputs.sniper_tag }}
          APPLICATION_CHANGED: ${{ needs.changes.outputs.application }}
          SNIPER_CHANGED: ${{ needs.changes.outputs.sniper }}
          RELEASE_MIGRATIONS_V1: ${{ vars.RELEASE_MIGRATIONS_V1 }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command=""
          if [ "$APPLICATION_CHANGED" = true ]; then
            if [ "$RELEASE_MIGRATIONS_V1" = true ]; then
              [[ "$APP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
              command="release-v1 $APP_DIGEST"
            else
              command="web $APP_TAG"
            fi
          fi
          if [ "$SNIPER_CHANGED" = true ]; then
            [[ "$SNIPER_TAG" =~ ^sha-[0-9a-f]{7}$ ]]
            if [ -n "$command" ]; then command="$command "; fi
            command="${command}sniper $SNIPER_TAG"
          fi
          test -n "$command"
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$command"

      # Container-Health allein beweist nicht, dass der Reverse Proxy schon
      # genau dieses Build ausliefert. Die Prüfung verlangt deshalb HTTP 200
      # von der öffentlichen Startseite und dieselbe vollständige SHA, die
      # diesen Workflow ausgelöst hat.
      - name: Verify the public deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-public-deployment.mjs --base-url https://app.flipbase.de --expected-commit "$EXPECTED_COMMIT"

  release:
    name: Create GitHub Release
    needs: [deploy, image]
    if: ${{ github.event_name == 'push' && always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "Keine Versionsnummer ermittelt - überspringe Release." >&2
            exit 0
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits - überspringe."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
            echo "Release $TAG erfolgreich erstellt."
          fi
