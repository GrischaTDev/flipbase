name: Vinted feed database check
on:
  push:
    branches: [juna/vinted-feed-account-favorites]
    paths:
      - .github/workflows/vinted-feed-check.yml
      - tools/vinted-feed-database-check.py
      - supabase/schemas/400_sniper_favorites.sql
      - supabase/schemas/401_sniper_feed_search.sql
      - supabase/tests/sniper_account_favorites.sql
      - supabase/tests/sniper_feed_search.sql
permissions:
  contents: read
concurrency:
  group: vinted-feed-favorites-database
  cancel-in-progress: true
jobs:
  database:
    if: github.repository == 'GrischaTDev/flipbase' && github.ref == 'refs/heads/juna/vinted-feed-account-favorites'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies
        run: |
          mkdir -p /tmp/feed-db-review
          npm ci > /tmp/feed-db-review/install.log 2>&1
      - name: Start disposable database from existing migrations
        run: npx supabase start > /tmp/feed-db-review/start.log 2>&1
      - name: Require the new favorite regression to fail on the old schema
        run: |
          if npx supabase test db supabase/tests/sniper_account_favorites.sql > /tmp/feed-db-review/baseline.log 2>&1; then
            echo 'Die neue Funktion war unerwartet bereits vorhanden.'
            exit 1
          fi
          grep -E 'sniper_favorites|save_sniper_favorite' /tmp/feed-db-review/baseline.log
      - name: Apply only the proposed declarations to the disposable database
        run: python3 tools/vinted-feed-database-check.py > /tmp/feed-db-review/apply.log 2>&1
      - name: Generate migration and database types
        run: |
          npx supabase migration new vinted_feed_account_favorites > /tmp/feed-db-review/migration-name.log 2>&1
          migration=$(find supabase/migrations -maxdepth 1 -name '*_vinted_feed_account_favorites.sql')
          test -n "$migration"
          npx supabase db diff --from migrations --to local --schema public --use-migra > "$migration" 2> /tmp/feed-db-review/generator.log
          test -s "$migration"
          cp "$migration" /tmp/feed-db-review/
          npx supabase gen types typescript --local > /tmp/feed-db-review/supabase.types.ts
      - name: Rebuild from generated migration and verify types
        run: |
          npx supabase db reset --local > /tmp/feed-db-review/reset.log 2>&1
          npx supabase gen types typescript --local > /tmp/feed-db-review/rebuilt.types.ts
          diff -u /tmp/feed-db-review/supabase.types.ts /tmp/feed-db-review/rebuilt.types.ts
      - name: All database regressions
        run: npm run test:db > /tmp/feed-db-review/database-tests.log 2>&1
      - name: Record check result
        if: always()
        run: |
          for name in apply baseline generator migration-name reset database-tests; do
            log="/tmp/feed-db-review/$name.log"
            if test -f "$log"; then echo "=== $name ==="; tail -n 45 "$log"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vinted-feed-database-review
          path: |
            /tmp/feed-db-review/*_vinted_feed_account_favorites.sql
            /tmp/feed-db-review/*.types.ts
            /tmp/feed-db-review/database-tests.log
            /tmp/feed-db-review/generator.log
            /tmp/feed-db-review/baseline.log
          retention-days: 3
      - name: Stop disposable database
        if: always()
        run: |
          if test -x node_modules/.bin/supabase; then node_modules/.bin/supabase stop --no-backup; fi
