<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manual browser drag fixture</title>
  </head>
  <body style="margin: 0">
    <input
      aria-label="Synthetic range"
      type="range"
      min="0"
      max="100"
      value="0"
      style="position: absolute; left: 100px; top: 100px; width: 400px; height: 40px; margin: 0"
    />
  </body>
</html>
