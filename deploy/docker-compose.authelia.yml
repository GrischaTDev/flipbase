# Authelia sichert die Verwaltungsoberflaeche ab.
# Laeuft im selben Netz wie Caddy, damit forward_auth es erreicht.
# Kein veroeffentlichter Port - erreichbar ausschliesslich ueber Caddy.
services:
  authelia:
    container_name: authelia
    image: authelia/authelia:4.39.20
    restart: unless-stopped
    volumes:
      - /opt/authelia/config:/config
      - /opt/authelia/secrets:/secrets:ro
    secrets:
      - authelia_smtp_password
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption
      AUTHELIA_NOTIFIER_SMTP_ADDRESS: submission://${SMTP_HOST:?SMTP_HOST fehlt}:${SMTP_PORT:?SMTP_PORT fehlt}
      AUTHELIA_NOTIFIER_SMTP_USERNAME: ${SMTP_USER:?SMTP_USER fehlt}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /run/secrets/authelia_smtp_password
      AUTHELIA_NOTIFIER_SMTP_SENDER: ${SMTP_ADMIN_EMAIL:?SMTP_ADMIN_EMAIL fehlt}
      AUTHELIA_NOTIFIER_SMTP_IDENTIFIER: flipbase.de
      AUTHELIA_NOTIFIER_SMTP_STARTUP_CHECK_ADDRESS: ${SMTP_ADMIN_EMAIL:?SMTP_ADMIN_EMAIL fehlt}
      TZ: Europe/Berlin
    healthcheck:
      # Den Unterbefehl "authelia health" gibt es seit 4.39 nicht mehr;
      # geprueft wird deshalb der Endpunkt. 127.0.0.1 statt localhost,
      # damit die Aufloesung nicht ueber IPv6 danebengreift.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:9091/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  caddy:
    depends_on:
      authelia:
        condition: service_started

secrets:
  authelia_smtp_password:
    environment: SMTP_PASS
