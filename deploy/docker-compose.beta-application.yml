# Reicht die Variablen der Beta-Bewerbungsfunktion an den Funktionsdienst durch.
#
# Eigene Datei, weil das offizielle Supabase-Paket seine `docker-compose.yml`
# beim Aktualisieren ueberschreibt. Der dortige `environment:`-Block des Dienstes
# `functions` zaehlt die Variablen einzeln auf; eine neue Zeile in der `.env`
# allein erreicht den Container also nicht.
#
# Ohne diese Durchreichung verweigert `beta-application` absichtlich den Dienst
# und antwortet mit 500 - der fehlende Pfeffer wuerde sonst zu ungesalzenen
# Streuwerten fuehren, und das soll nicht unbemerkt passieren.
#
# Auf dem Server gehoert die Datei nach /opt/supabase/ und in die Liste
# COMPOSE_FILE in /opt/supabase/.env.
services:
  auth:
    environment:
      # GoTrue sperrt dadurch den oeffentlichen /signup-Endpunkt. Admin-Einladungen
      # ueber inviteUserByEmail bleiben weiterhin moeglich.
      GOTRUE_DISABLE_SIGNUP: "true"

  functions:
    environment:
      BETA_APPLICATION_PEPPER: ${BETA_APPLICATION_PEPPER}
      BETA_APPLICATION_ALLOWED_ORIGINS: ${BETA_APPLICATION_ALLOWED_ORIGINS}
      BETA_SMTP_HOST: ${SMTP_HOST}
      BETA_SMTP_PORT: ${SMTP_PORT}
      BETA_SMTP_USER: ${SMTP_USER}
      BETA_SMTP_PASS: ${SMTP_PASS}
      BETA_SMTP_FROM_EMAIL: ${SMTP_ADMIN_EMAIL}
      BETA_SMTP_FROM_NAME: ${SMTP_SENDER_NAME:-Flipbase}
      BETA_APP_URL: ${BETA_APP_URL:-https://app.flipbase.de}
