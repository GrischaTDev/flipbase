name: flipbase

services:
  web:
    # Das Abbild wird von GitHub Actions gebaut und in die GitHub Container
    # Registry gelegt (siehe .github/workflows/ci.yml). Der Server baut nichts
    # mehr selbst - er laedt nur noch das fertige Abbild.
    #
    # IMAGE_TAG bleibt im Normalfall leer und zeigt damit auf "latest", also
    # den letzten Stand von master. Fuer einen Rueckfall auf eine aeltere
    # Fassung wird der Wert gesetzt, siehe deploy/README.md.
    image: ghcr.io/grischatdev/flipbase:${IMAGE_TAG:-latest}
    container_name: flipbase-web
    restart: unless-stopped
    # Kein ports-Abschnitt: erreichbar ausschliesslich ueber Caddy im selben Netz.
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
