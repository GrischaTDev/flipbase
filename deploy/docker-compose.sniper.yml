name: flipbase-sniper

services:
  sniper:
    image: ${FLIPBASE_SNIPER_IMAGE:?Ein geprueftes Bot-Abbild angeben}
    container_name: flipbase-sniper
    restart: unless-stopped
    init: true
    # Vorhandene Serveranbindung; API nur am internen Docker-Gateway,
    # Gesundheitsendpunkte und Chrome-Steuerung ausschließlich an Loopback.
    network_mode: host
    env_file:
      - ${SNIPER_ENV_FILE:-/opt/flipbase-sniper/sniper.env}
    environment:
      SNIPER_BROWSER_HOST: 172.18.0.1
      SNIPER_BROWSER_PORT: '8081'
      SNIPER_BROWSER_CDP_PORT: '9228'
      SNIPER_BROWSER_PROFILE_DIR: /var/lib/flipbase-sniper/browser
    volumes:
      - ${SNIPER_BROWSER_PROFILE_PATH:-/opt/flipbase-sniper/browser}:/var/lib/flipbase-sniper/browser
    tmpfs:
      - /tmp:size=384m,mode=1777
    shm_size: 128m
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp:${SNIPER_SECCOMP_FILE:-/opt/flipbase-sniper/chromium-seccomp.json}
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # Der Healthcheck bindet nur an localhost. Der Dienst greift ausgehend
    # auf die vorhandene HTTPS-API und Vinted zu.
