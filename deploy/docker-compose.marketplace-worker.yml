name: flipbase-marketplace

services:
  marketplace-worker:
    image: ${FLIPBASE_MARKETPLACE_IMAGE:?Ein geprüftes Worker-Abbild angeben}
    container_name: flipbase-marketplace-worker
    restart: unless-stopped
    init: true
    env_file:
      - ${MARKETPLACE_ENV_FILE:-/opt/flipbase-marketplace/marketplace-worker.env}
    environment:
      MARKETPLACE_BROWSER_HOST: 0.0.0.0
      MARKETPLACE_BROWSER_PORT: 4179
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
