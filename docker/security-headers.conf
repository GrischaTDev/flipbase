# Sicherheits-Header.
#
# Wichtig: In nginx ersetzen add_header-Anweisungen in einem location-Block
# ALLE geerbten Header der uebergeordneten Ebene. Diese Datei wird deshalb in
# jedem location-Block eingebunden, der eigene Header setzt.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# connect-src braucht blob:, weil der Bildoptimierer Fotos ueber eine
# blob:-Adresse einliest (ngx-image-cropper holt das Bild per fetch, nicht
# ueber ein img-Element - img-src reicht dafuer nicht). Ohne diese Freigabe
# scheitert im Betrieb jedes Foto, waehrend es lokal funktioniert: Der
# Entwicklungsserver liefert gar keine CSP aus. Blob-Adressen zeigen immer auf
# Daten der Seite selbst, die Freigabe oeffnet also nichts nach aussen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' blob: https://api.flipbase.de wss://api.flipbase.de https://world.openfoodfacts.org https://world.openbeautyfacts.org https://world.openpetfoodfacts.org https://world.openproductsfacts.org https://discord.com https://api.telegram.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
