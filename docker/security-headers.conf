# Sicherheits-Header.
#
# Wichtig: In nginx ersetzen add_header-Anweisungen in einem location-Block
# ALLE geerbten Header der uebergeordneten Ebene. Diese Datei wird deshalb in
# jedem location-Block eingebunden, der eigene Header setzt.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://api.flipbase.de wss://api.flipbase.de https://world.openfoodfacts.org https://discord.com https://api.telegram.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
