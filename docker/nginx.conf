server {
    listen       80;
    server_name  localhost reflip.local;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip-Kompression für schnellere Auslieferung
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Caching für statische Assets (JS, CSS, Bilder)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback – alle Routen auf index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }
}
