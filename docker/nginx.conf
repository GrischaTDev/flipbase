server {
    listen       80;
    server_name  localhost flipbase.local flipbase.localhost _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serverkennung nicht preisgeben
    server_tokens off;

    # Sicherheits-Header (siehe security-headers.conf)
    include /etc/nginx/security-headers.conf;

    # Gzip-Kompression für schnellere Auslieferung
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ──────────────────────────────────────────────────────────────────────
    # Zwischenspeicherung
    # ──────────────────────────────────────────────────────────────────────

    # Statische Dateien tragen einen Inhalts-Hash im Namen und duerfen deshalb
    # lange zwischengespeichert werden.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html, Service Worker und Manifest niemals zwischenspeichern.
    # Sonst zeigt der Browser nach einem neuen Stand weiterhin die alte
    # Anwendung, weil er auf die alte index.html verweist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # Endpunkt fuer die Zustandspruefung des Containers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Versteckte Dateien nicht ausliefern
    location ~ /\. {
        deny all;
    }

    # SPA-Fallback – alle Routen auf index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }
}
