name: flipbase-web

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: flipbase-web
    ports:
      # Port 80, damit die gewohnten Adressen http://localhost/ und
      # http://reflip.localhost/ ohne Portangabe funktionieren.
      # Falls Port 80 auf dem Rechner einmal belegt ist, hier auf
      # "8080:80" umstellen - die Anwendung laeuft dann unter :8080.
      - '80:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Der Container liefert nur statische Dateien aus und braucht kein
    # Schreibrecht auf sein Dateisystem.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
